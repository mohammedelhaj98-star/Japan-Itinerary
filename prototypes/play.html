<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Motion prototypes</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Zen+Old+Mincho:wght@700&display=swap">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
@font-face { font-family: 'Zen Kaku'; font-weight: 400; font-display: swap; src: url(../vendor/fonts/zen-kaku-gothic-new-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Zen Kaku'; font-weight: 500; font-display: swap; src: url(../vendor/fonts/zen-kaku-gothic-new-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Zen Kaku'; font-weight: 700; font-display: swap; src: url(../vendor/fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format('woff2'); }
:root {
  --ink:#141412; --ink2:#4b4a45; --ink3:#86847c; --paper:#f4f2ee;
  --ease:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --serif:'Instrument Serif', 'Times New Roman', serif; --mincho:'Zen Old Mincho', 'Hiragino Mincho ProN', serif;
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:'Zen Kaku','Hiragino Sans','Noto Sans JP',system-ui,sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent; font-variant-numeric:tabular-nums; overscroll-behavior-y:none; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
h1,h2,h3,p,dl,dd { margin:0; }
svg { display:inline-block; vertical-align:middle; fill:none; }
a { color:inherit; }
#stage { min-height:100dvh; }
.phone { max-width:440px; margin:0 auto; min-height:100dvh; position:relative; }
.pad { height:110px; }
.leaflet-div-icon { background:transparent; border:0; }

/* ═══ 1 · Island ═══ */
.w1 { background:linear-gradient(180deg, var(--tint) 0, var(--paper) 380px); padding-bottom:110px; overflow-x:clip; }
.w1h { padding:calc(76px + env(safe-area-inset-top)) 22px 14px; position:relative; }
.w1h .kanji { position:absolute; right:6px; top:58px; font-family:var(--mincho); font-size:118px; line-height:1; color:rgba(60,30,0,.07); writing-mode:vertical-rl; white-space:nowrap; pointer-events:none; }
.w1h .eb { font-size:13px; color:var(--ink3); font-weight:500; }
.w1h h1 { font-size:36px; font-weight:700; letter-spacing:-.035em; line-height:1.05; margin-top:6px; max-width:12ch; }
.w1h .tg { font-size:15px; color:var(--ink2); margin-top:10px; max-width:30ch; }
.w1notes { display:flex; gap:8px; overflow-x:auto; padding:8px 14px 18px; scrollbar-width:none; scroll-snap-type:x proximity; }
.w1notes::-webkit-scrollbar { display:none; }
.nchip { flex:none; scroll-snap-align:start; border:0; background:rgba(255,255,255,.7); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-radius:16px; padding:9px 14px; text-align:left; line-height:1.2; max-width:230px; box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 4px 14px -8px rgba(60,40,0,.25); transition:transform 160ms var(--ease); }
.nchip:active { transform:scale(.97); }
.nchip small { display:block; font-size:11px; color:var(--ink3); font-weight:500; }
.nchip b { display:block; font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.fc { position:relative; margin:0 14px; background:#fff; border-radius:24px; box-shadow:0 1px 2px rgba(40,30,10,.05), 0 10px 24px -14px rgba(40,30,10,.22); animation:rise 560ms var(--ease) both; animation-delay:calc(var(--i) * 45ms); transition:background 240ms ease, box-shadow 240ms ease; }
@keyframes rise { from { opacity:0; transform:translateY(16px) scale(.98); } }
.fc-main { all:unset; display:block; box-sizing:border-box; width:100%; padding:16px 64px 16px 18px; cursor:pointer; }
.fc-top { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--ink3); }
.fc-cat { color:var(--c); font-weight:700; }
.fc-nx { color:#e5483a; font-weight:700; }
.fc h3 { font-size:18px; font-weight:700; letter-spacing:-.02em; line-height:1.25; margin-top:3px; transition:color 200ms; }
.fc-more { display:grid; grid-template-rows:0fr; transition:grid-template-rows 340ms var(--ease); }
.fc-more > div { overflow:hidden; padding:0 18px; }
.fc-more > div > :last-child { margin-bottom:16px; }
.fc.open .fc-more { grid-template-rows:1fr; }
.fc-more p { font-size:14.5px; color:var(--ink2); white-space:pre-line; margin-top:-4px; }
.fc-cost { margin-top:6px !important; font-size:13px !important; color:var(--ink3) !important; }
.fc-dir { display:inline-flex; gap:6px; align-items:center; margin-top:12px; font-size:13.5px; font-weight:700; text-decoration:none; background:var(--paper); border-radius:999px; padding:7px 12px; }
.tick { position:absolute; right:12px; top:14px; width:38px; height:38px; border-radius:50%; border:1.5px solid #dcd9d1; background:#fff; display:grid; place-items:center; color:transparent; transition:background 200ms, border-color 200ms, color 200ms, transform 160ms var(--ease); }
.tick:active { transform:scale(.88); }
.tick.on { background:var(--c); border-color:var(--c); color:#fff; animation:pop 360ms cubic-bezier(.3,1.7,.5,1); }
@keyframes pop { from { transform:scale(.7); } }
.fc.done { background:rgba(255,255,255,.5); box-shadow:none; }
.fc.done h3 { color:var(--ink3); }
.w1leg { display:flex; justify-content:center; align-items:center; height:46px; position:relative; }
.w1leg::before { content:''; position:absolute; top:0; bottom:0; left:50%; border-left:2px dotted var(--c); opacity:.5; }
.w1leg span { position:relative; background:#fff; color:var(--c); border-radius:999px; padding:4px 11px 4px 9px; font-size:12px; font-weight:700; display:inline-flex; gap:5px; align-items:center; box-shadow:0 3px 10px -4px rgba(0,0,0,.18); }
.w1gap { height:10px; }
.isl { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; width:250px; height:42px; border-radius:21px; background:#0c0c0d; color:#fff; z-index:1000; overflow:hidden; box-shadow:0 12px 30px -12px rgba(0,0,0,.5); transform:translateX(-50%); will-change:width,height; }
.isl-sm { all:unset; position:absolute; inset:0; display:flex; align-items:center; gap:9px; padding:0 9px 0 15px; cursor:pointer; transition:opacity 130ms ease, filter 130ms ease; }
.isl-pulse { width:8px; height:8px; border-radius:50%; background:#ff5b4d; flex:none; animation:breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow:0 0 0 5px rgba(255,91,77,0); } 0%,100% { box-shadow:0 0 0 0 rgba(255,91,77,.55); } }
.isl-t { flex:1; min-width:0; font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.isl-time { font-size:13px; color:#ffb3a0; font-weight:500; }
.isl-ring { width:24px; height:24px; transform:rotate(-90deg); flex:none; }
.isl-ring circle { fill:none; stroke:rgba(255,255,255,.18); stroke-width:2.6; }
.isl-ring .pr { stroke:#7be08e; stroke-dasharray:50.27; stroke-linecap:round; transition:stroke-dashoffset 700ms var(--ease); }
.isl.open .isl-sm { opacity:0; filter:blur(4px); pointer-events:none; }
.isl-lg { position:absolute; top:0; left:0; padding:20px 20px 18px; opacity:0; filter:blur(6px); transform:scale(.96); transform-origin:50% 0; pointer-events:none; transition:opacity 150ms ease, filter 150ms ease, transform 150ms ease; }
.isl.open .isl-lg { opacity:1; filter:none; transform:none; pointer-events:auto; transition-duration:260ms; transition-delay:80ms; }
.isl.open .isl-lg.swap { opacity:0; filter:blur(8px); transform:translateY(-4px); transition-delay:0ms; transition-duration:160ms; }
.lg-k { display:flex; justify-content:space-between; font-size:12px; color:#ff8e74; font-weight:700; letter-spacing:.02em; }
.isl-lg h2 { font-size:25px; letter-spacing:-.03em; line-height:1.12; margin-top:6px; }
.lg-t { font-size:14px; color:rgba(255,255,255,.62); margin-top:6px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.lg-t span { display:inline-flex; gap:5px; align-items:center; color:var(--c2); font-weight:700; }
.lg-d { font-size:14.5px; color:rgba(255,255,255,.84); margin-top:10px; white-space:pre-line; }
.lg-a { display:flex; gap:8px; margin-top:16px; }
.lg-a a, .lg-done { flex:1; min-height:46px; border-radius:15px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; font-weight:700; font-size:14.5px; border:0; transition:background 220ms, color 220ms, transform 160ms var(--ease); }
.lg-a a { background:rgba(255,255,255,.12); color:#fff; }
.lg-done { background:#fff; color:#0c0c0d; }
.lg-a a:active, .lg-done:active { transform:scale(.97); }
.lg-done.ok { background:#34c759; color:#fff; }
.scrim { position:fixed; inset:0; background:rgba(25,20,12,.26); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); opacity:0; pointer-events:none; transition:opacity 260ms ease; z-index:999; }
.scrim.on { opacity:1; pointer-events:auto; }
.notepop { position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); max-width:416px; margin:0 auto; z-index:1001; background:#fff; border-radius:26px; padding:18px 20px 20px; box-shadow:0 24px 60px -20px rgba(0,0,0,.4); transform-origin:50% 100%; transition:opacity 200ms ease, transform 260ms var(--ease); }
.notepop[hidden] { display:block; opacity:0; transform:translateY(16px) scale(.97); pointer-events:none; }
.notepop small { font-size:12px; color:var(--ink3); font-weight:700; }
.notepop h3 { font-size:20px; letter-spacing:-.02em; margin-top:2px; }
.notepop p { font-size:14.5px; color:var(--ink2); margin-top:8px; white-space:pre-line; }

/* ═══ 2 · Glass ═══ */
.w2 { position:fixed; inset:0; overflow:hidden; background:#e8e6df; }
#m2 { position:absolute; inset:0; }
#m2 .leaflet-tile-pane { filter:saturate(.5) contrast(.92) brightness(1.06) sepia(.08); }
#m2 .leaflet-control-attribution { font-size:9px; background:rgba(255,255,255,.6); }
.glass { background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(22px) saturate(1.8); backdrop-filter:blur(22px) saturate(1.8); box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 0 0 .5px rgba(0,0,0,.06), 0 10px 30px -12px rgba(0,0,0,.28); }
.g2top { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; gap:8px; z-index:600; justify-content:center; }
.gb { height:48px; min-width:48px; border-radius:24px; display:grid; place-items:center; text-decoration:none; color:var(--ink); transition:transform 160ms var(--ease); }
.gb:active { transform:scale(.95); }
.gday { flex:1; max-width:280px; display:block; padding:7px 18px; text-align:center; line-height:1.15; }
.gday small { display:block; font-size:11.5px; color:var(--ink3); font-weight:500; }
.gday b { display:block; font-size:15px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sh2 { -webkit-user-select:none; user-select:none; position:absolute; left:0; right:0; top:0; height:100%; z-index:700; border-radius:30px 30px 0 0; touch-action:none; will-change:transform; display:flex; flex-direction:column; max-width:440px; margin:0 auto; }
.sh2-grab { padding:8px 18px 4px; flex:none; touch-action:none; }
.sh2-grab > i { display:block; width:38px; height:5px; border-radius:3px; background:rgba(0,0,0,.18); margin:0 auto 10px; }
.sh2-list { flex:1; overflow:hidden; padding:4px 10px 120px; overscroll-behavior:contain; }
.sh2.full .sh2-list { overflow-y:auto; touch-action:pan-y; }
.h2c { padding-bottom:12px; }
.h2top { display:flex; gap:12px; align-items:center; }
.h2top > div { flex:1; min-width:0; }
.h2go { width:46px; height:46px; border-radius:50%; background:#1e6bff; color:#fff; display:grid; place-items:center; flex:none; transition:transform 160ms var(--ease); }
.h2go:active { transform:scale(.94); }
.h2top small { display:block; font-size:12px; color:var(--ink3); font-weight:700; }
.h2top h3 { font-size:21px; letter-spacing:-.025em; line-height:1.15; }
.h2t { font-size:13.5px; color:var(--ink2); margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
.h2t span { display:inline-flex; gap:4px; align-items:center; color:var(--c); font-weight:700; }
.h2d { font-size:14.5px; color:var(--ink2); margin-top:8px; white-space:pre-line; }
.h2a { display:flex; gap:8px; margin-top:14px; }
.h2a a, .h2a button { flex:1; min-height:46px; border-radius:15px; border:0; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:14.5px; text-decoration:none; transition:transform 160ms var(--ease), background 200ms; }
.h2a a { background:#1e6bff; color:#fff; }
.h2a button { background:rgba(0,0,0,.06); }
.h2a button.on { background:#34c759; color:#fff; }
.h2a a:active, .h2a button:active { transform:scale(.97); }
.p2 { width:30px; height:30px; border-radius:50%; background:#fff; color:var(--ink); border:2.5px solid var(--c); font-weight:700; font-size:12.5px; display:grid; place-items:center; font-family:'Zen Kaku',system-ui,sans-serif; box-shadow:0 4px 10px -3px rgba(0,0,0,.35); position:relative; transition:transform 300ms cubic-bezier(.3,1.5,.5,1), background 200ms, color 200ms; }
.p2.nx { background:#ff3b30; border-color:#fff; color:#fff; }
.p2.nx::after { content:''; position:absolute; inset:-3px; border-radius:50%; border:2px solid #ff3b30; animation:ping 2s var(--ease) infinite; }
@keyframes ping { from { transform:scale(1); opacity:.8; } to { transform:scale(2.2); opacity:0; } }
.p2.done { background:var(--c); color:#fff; }
.p2.sel { transform:scale(1.35) translateY(-4px); z-index:5; }
.r2 { all:unset; box-sizing:border-box; display:flex; gap:12px; align-items:center; width:100%; padding:10px 8px; border-radius:16px; cursor:pointer; transition:background 160ms; }
.r2:active { background:rgba(0,0,0,.05); }
.r2.sel { background:rgba(255,255,255,.75); }
.r2n { width:30px; height:30px; border-radius:50%; border:2.5px solid var(--c); display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; background:#fff; }
.r2n.leg { border:0; background:transparent; color:var(--c); }
.r2.done .r2n { background:var(--c); color:#fff; }
.r2b { flex:1; min-width:0; }
.r2b b { display:block; font-size:15px; font-weight:700; line-height:1.25; }
.r2.done .r2b b { color:var(--ink3); }
.r2b small { display:block; font-size:12.5px; color:var(--ink3); }

/* ═══ 3 · Journey ═══ */
.w3 { position:relative; padding-bottom:120px; color:var(--hc,var(--ink)); transition:color 500ms ease; }
.sky3 { position:fixed; inset:0; z-index:-1; }
.w3h { padding:calc(54px + env(safe-area-inset-top)) 24px 30px; }
.w3h .eb { font-size:13px; font-weight:700; opacity:.6; letter-spacing:.02em; }
.w3h h1 { font-weight:700; font-size:40px; letter-spacing:-.04em; line-height:1; margin-top:10px; }
.w3h h1 em { font-family:var(--serif); font-weight:400; font-size:64px; letter-spacing:-.02em; display:block; line-height:.9; margin-bottom:4px; }
.w3h .tg { font-size:15px; opacity:.75; margin-top:12px; max-width:30ch; }
.trail { position:relative; padding:20px 0 40px; }
.t3svg { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:0; }
#t3base { stroke:currentColor; opacity:.22; stroke-width:2.5; stroke-dasharray:2 7; stroke-linecap:round; fill:none; }
#t3prog { stroke:currentColor; stroke-width:3.5; fill:none; stroke-linecap:round; opacity:.85; }
.i3 { position:relative; width:74%; margin:0 0 78px 18px; padding:20px 18px 16px 20px; border-radius:28px; background:rgba(255,255,255,.8); -webkit-backdrop-filter:blur(16px) saturate(1.5); backdrop-filter:blur(16px) saturate(1.5); color:var(--ink); box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 20px 40px -24px rgba(30,20,60,.5); opacity:0; transform:translateY(28px) scale(.96); transition:opacity 600ms var(--ease), transform 700ms var(--ease); z-index:1; }
.i3.R { margin-left:auto; margin-right:18px; }
.i3.in { opacity:1; transform:none; }
.i3n { position:absolute; top:-15px; left:-8px; width:34px; height:34px; border-radius:50%; background:var(--c); color:#fff; font-weight:700; font-size:14px; display:grid; place-items:center; box-shadow:0 0 0 4px rgba(255,255,255,.9); }
.i3.R .i3n { left:auto; right:-8px; }
.i3n.leg { width:18px; height:18px; top:-9px; left:-1px; font-size:0; }
.i3.R .i3n.leg { right:-1px; }
.i3t { font-size:12.5px; color:var(--ink3); font-weight:500; }
.i3 h3 { font-size:18px; letter-spacing:-.02em; line-height:1.2; margin-top:2px; padding-right:28px; }
.i3d { font-size:14px; color:var(--ink2); margin-top:6px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; cursor:pointer; }
.i3.open .i3d { -webkit-line-clamp:unset; display:block; }
.i3 .tick { top:12px; right:10px; width:34px; height:34px; }
.i3.done h3 { color:var(--ink3); }
.leg3 { position:absolute; z-index:2; transform:translate(-50%,-50%); background:var(--legbg,rgba(255,255,255,.9)); color:var(--c); border-radius:999px; padding:3px 10px 3px 8px; font-size:11.5px; font-weight:700; display:inline-flex; gap:4px; align-items:center; white-space:nowrap; box-shadow:0 4px 12px -6px rgba(0,0,0,.3); }
.trav { position:absolute; left:0; top:0; z-index:3; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; box-shadow:0 0 0 5px rgba(255,255,255,.55), 0 10px 20px -6px rgba(0,0,0,.45); will-change:transform; }
.trav svg { width:18px; height:18px; }
.w3end { margin:0 18px; padding:20px; border-radius:28px; background:rgba(255,255,255,.14); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.25); }
.w3end small { display:block; font-size:12px; opacity:.7; font-weight:700; }
.w3end b { display:block; font-size:17px; margin:2px 0 10px; }
.w3end b:last-child { margin-bottom:0; }

/* ═══ 4 · Passes ═══ */
.w4 { background:#101012; color:#fff; min-height:100dvh; }
.w4h { padding:calc(30px + env(safe-area-inset-top)) 22px 20px; }
.w4h p { font-size:13px; color:rgba(255,255,255,.55); font-weight:500; }
.w4h h1 { font-size:32px; letter-spacing:-.035em; line-height:1.05; margin-top:4px; }
.w4h .cnt { margin-top:8px; display:inline-flex; gap:8px; align-items:center; font-size:13px; color:rgba(255,255,255,.7); }
.w4h .cnt i { font-style:normal; font-family:var(--mincho); color:#ff5b4d; font-size:15px; }
.stk { position:relative; margin:0 12px; }
.ps { position:absolute; left:0; right:0; top:0; border-radius:20px; overflow:hidden; color:#fff; background:linear-gradient(165deg, color-mix(in srgb, var(--c) 80%, #fff) 0, var(--c) 34%, color-mix(in srgb, var(--c) 82%, #000) 100%); box-shadow:0 -1px 0 rgba(255,255,255,.18) inset, 0 -10px 30px -12px rgba(0,0,0,.6); will-change:transform; transform-origin:50% 0; }
.ps-band { height:68px; display:flex; align-items:center; gap:12px; padding:0 18px; cursor:pointer; position:relative; }
.ps-n { font-family:var(--serif); font-style:italic; font-size:34px; line-height:1; width:34px; opacity:.9; }
.ps-tt { flex:1; min-width:0; line-height:1.2; }
.ps-tt small { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:.7; }
.ps-tt b { display:block; font-size:16.5px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ps-time { font-size:14px; font-weight:700; opacity:.9; }
.ps-body { padding:6px 18px 18px; height:calc(var(--ch) - 68px); overflow:auto; }
.ps-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; padding:14px 0; border-top:1px solid rgba(255,255,255,.2); }
.ps-grid dt { font-size:11px; letter-spacing:.06em; text-transform:uppercase; opacity:.65; font-weight:700; }
.ps-grid dd { font-size:14.5px; font-weight:700; line-height:1.3; margin-top:2px; }
.ps-grid .wide { grid-column:1/-1; }

      <header class="w3h"><p class="eb">${esc(shortDate).toUpperCase()} · ${esc(DAY.city).toUpperCase()}</p><h1><em>Day ${DAY.n}</em>${esc(DAY.title)}</h1>${DAY.tagline ? `<p class="tg">${esc(DAY.tagline)}</p>` : ''}</header>

      <div class="w3end"><small>Dinner</small><b>${esc(DAY.dinner)}</b><small>Sleep</small><b>${esc(HOTEL.name || '')}</b></div><div class="pad"></div></div>`;

    if (!RM) st.forEach((c, i) => { c.Y.set(i * PEEK + 300 + i * 30); c.el.style.opacity = 0; setTimeout(() => { c.el.style.transition = 'opacity 300ms ease'; c.el.style.opacity = 1; c.Y.to(i * PEEK, { response: 0.6, damping: 0.8 }); }, 40 + i * 35); });
    /* drag the open pass down to put it back */
    const T = tracker(); let drag = null, suppress = false;
    on(stk, 'pointerdown', (e) => { if (sel < 0) return; const c = st[sel]; if (!c.el.contains(e.target) || e.target.closest('a,button')) return; drag = { id: e.pointerId, y0: e.clientY, base: c.Y.t, active: false }; T.reset(); });
    on(window, 'pointermove', (e) => { if (!drag || e.pointerId !== drag.id) return; const dy = e.clientY - drag.y0; if (!drag.active) { if (Math.abs(dy) < 8) return; drag.active = true; st[sel].Y.stop(); } const y = drag.base + (dy > 0 ? dy : -rubber(-dy, 400)); st[sel].Y.set(y); T.add(y); });
    const end = (e) => { if (!drag || e.pointerId !== drag.id) return; if (drag.active) { const v = T.vel(); const dy = st[sel].Y.x - drag.base; suppress = true; setTimeout(() => (suppress = false), 60); if (dy + project(v, 0.99) > 160) close(v); else st[sel].Y.to(drag.base, { response: 0.4, damping: 0.8, velocity: v }); } drag = null; };
    on(window, 'pointerup', end); on(window, 'pointercancel', end);
    on(stk, 'click', (e) => {
      if (suppress) return;
      const sp = e.target.closest('[data-stamp]'); if (sp) { const id = sp.dataset.stamp; const d = toggleCheck(id); const card = sp.closest('.ps'); const c = st[+card.dataset.i]; card.classList.toggle('done', d); card.classList.remove('stamped'); sp.textContent = d ? 'Unstamp' : 'Stamp 済'; if (d) { void card.offsetWidth; card.classList.add('stamped'); c.S.set(0.97); c.S.to(1, { response: 0.32, damping: 0.45 }); } stage.querySelector('#cnt4').textContent = `${checks.size} of ${events.length} stamped`; return; }
      const b = e.target.closest('.ps'); if (!b || e.target.closest('a')) return; const i = +b.dataset.i;
      if (sel === i) { if (e.target.closest('[data-band]')) close(); } else openAt(i);
    });
    on(document, 'keydown', (e) => { if (e.key === 'Escape' && sel >= 0) close(); });
    on(window, 'resize', () => { size(); if (sel >= 0) openAt(sel); else rest(); });
    cleanups.push(() => { document.documentElement.style.overflow = ''; st.forEach((c) => { c.Y.stop(); c.S.stop(); }); });
  },
};

/* ═══════════ 5 · DIAL — the day as a clock face; scrub, flick, it snaps to the stop ═══════════ */
const V5 = {
  html() {
    const sp = events.map((e) => ({ e, s: span(e) })).filter((x) => x.s);
    return `<div class="phone w5"><header class="w5h"><p>Day ${DAY.n} · ${esc(shortDate)} · ${esc(DAY.city)}</p><h1>${esc(DAY.title)}</h1></header>
      <div class="dialw" id="dialw"><svg id="dial" viewBox="0 0 340 340"></svg><div class="dc"><p class="dc-k" id="dck">Next up</p><p class="dc-time" id="dct"></p><p class="dc-title" id="dctt"></p></div></div>
      <div class="d5chips" id="d5chips">${sp.map(({ e }) => `<button class="d5chip" data-jump="${e.id}" style="--c:${e.place ? catOf(e).c : legHex(e)}"><i></i>${esc(startTime(e.time))} ${esc(e.title)}</button>`).join('')}</div>
      <div class="d5card" id="d5card"></div><div class="pad"></div></div>`;
  },
  init(stage) {
    const svg = stage.querySelector('#dial'), wrap = stage.querySelector('#dialw'), card = stage.querySelector('#d5card'), chips = stage.querySelector('#d5chips');
    const sp = events.map((e) => ({ e, s: span(e) })).filter((x) => x.s);
    const t0 = Math.floor(Math.min(...sp.map((x) => x.s[0])) / 60) * 60 - 30, t1 = Math.ceil(Math.max(...sp.map((x) => x.s[1])) / 60) * 60 + 30;
    const A0 = -150, A1 = 150, CX = 170, CY = 170, R = 138;
    const ang = (m) => A0 + ((m - t0) / (t1 - t0)) * (A1 - A0), minAt = (a) => t0 + ((a - A0) / (A1 - A0)) * (t1 - t0);
    const pt = (a, r) => [CX + r * Math.sin((a * Math.PI) / 180), CY - r * Math.cos((a * Math.PI) / 180)];
    const arc = (a0, a1, r) => { const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r); return `M ${x0} ${y0} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
    let g = `<path class="trk" d="${arc(A0, A1, R)}"/>`;
    sp.forEach(({ e, s }) => { const a0 = ang(s[0]) + 0.8, a1 = Math.max(a0 + 1.5, ang(s[1]) - 0.8); g += `<path class="arc ${checks.has(e.id) ? 'done' : ''}" data-arc="${e.id}" stroke="${e.place ? catOf(e).c : legHex(e)}" d="${arc(a0, a1, R)}"/>`; });
    for (let h = Math.ceil(t0 / 60); h * 60 <= t1; h++) { const a = ang(h * 60); const [x0, y0] = pt(a, R + 17), [x1, y1] = pt(a, R + 22); const [tx, ty] = pt(a, R - 27); g += `<g class="hr"><line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>${(h - Math.ceil(t0 / 60)) % 2 === 0 ? `<text x="${tx}" y="${ty}">${h % 12 || 12}${h < 12 ? 'a' : 'p'}</text>` : ''}</g>`; }
    g += `<g id="knob"><circle class="k1" r="17"/><circle class="k2" r="6"/></g>`;
    svg.innerHTML = g;
    const knob = svg.querySelector('#knob');
    let curId = null;
    const at = (m) => { let best = null; for (const x of sp) if (x.s[0] <= m + 0.5) best = x; return best || sp[0]; };
    const renderCard = (x) => { const e = x.e; const c = e.place ? catOf(e) : { c: legHex(e), label: 'Getting there' }; const done = checks.has(e.id); const n = numOf(e.id);
      card.style.setProperty('--c', c.c); card.innerHTML = `<small>${c.label}${n ? ' · stop ' + n : ''}</small><h3>${esc(e.title)}</h3><p class="t">${esc(e.time)}${e.travel ? ' · ' + esc(e.travel.label || legMin(e)) : ''}</p>${e.desc ? `<p class="d">${esc(e.desc)}</p>` : ''}${e.place ? `<a class="fc-dir" href="${gm(e.place)}" target="_blank" rel="noopener">${ICON.dir}${esc(e.place.name)}</a>` : ''}<button class="tick ${done ? 'on' : ''}" data-check="${e.id}" style="--c:${c.c}" aria-label="Mark done">${ICON.check}</button>`; };
    const A = new Spring(A0, (a) => {
      const [x, y] = pt(a, R); knob.setAttribute('transform', `translate(${x} ${y})`);
      const m = minAt(a); const x0 = at(m); const [tm, ap] = fmt(Math.round(m / 5) * 5); stage.querySelector('#dct').innerHTML = `${tm}<small>${ap}</small>`;
      const col = x0.e.place ? catOf(x0.e).c : legHex(x0.e); wrap.style.setProperty('--kc', col);
      const nx = nextEv(); stage.querySelector('#dck').textContent = nx && nx.id === x0.e.id ? 'Next up' : checks.has(x0.e.id) ? 'Done' : m > x0.s[1] ? 'After' : 'Then';
      if (x0.e.id !== curId) { curId = x0.e.id; buzz(4); const tt = stage.querySelector('#dctt'); tt.classList.add('swap'); card.classList.add('swap'); setTimeout(() => { tt.textContent = x0.e.title; tt.classList.remove('swap'); renderCard(x0); card.classList.remove('swap'); }, 120);
        chips.querySelectorAll('.d5chip').forEach((c) => { const onn = c.dataset.jump === curId; c.classList.toggle('on', onn); if (onn) c.scrollIntoView({ inline: 'center', block: 'nearest', behavior: RM ? 'auto' : 'smooth' }); }); }
    }, 0.05);
    const snapTo = (id, v = 0) => { const x = sp.find((y) => y.e.id === id); if (x) A.to(ang(x.s[0]) + 0.01, { response: 0.5, damping: 0.86, velocity: v }); };
    const nx = nextEv(); A.set(A0); requestAnimationFrame(() => snapTo((nx || sp[0].e).id));
    /* scrub: angle follows the finger; release projects momentum then snaps to the nearest start */
    const T = tracker(); let drag = null;
    const angleOf = (e) => { const r = svg.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); return (Math.atan2(dx, -dy) * 180) / Math.PI; };
    on(wrap, 'pointerdown', (e) => { drag = { id: e.pointerId, last: angleOf(e) }; A.stop(); T.reset(); try { wrap.setPointerCapture(e.pointerId); } catch {} let a = Math.max(A0, Math.min(A1, drag.last)); A.set(a); T.add(a); });
    on(wrap, 'pointermove', (e) => { if (!drag || e.pointerId !== drag.id) return; let a = angleOf(e); if (Math.abs(a - drag.last) > 180) return; drag.last = a; const over = a < A0 ? a - A0 : a > A1 ? a - A1 : 0; a = Math.max(A0, Math.min(A1, a)) + (over ? Math.sign(over) * rubber(Math.abs(over), 60) : 0); A.set(a); T.add(a); });
    const end = (e) => { if (!drag || e.pointerId !== drag.id) return; drag = null; const v = T.vel(); const p = Math.max(A0, Math.min(A1, A.x + project(v, 0.995))); const m = minAt(p); let best = sp[0]; for (const x of sp) if (Math.abs(x.s[0] - m) < Math.abs(best.s[0] - m)) best = x; snapTo(best.e.id, v); };
    on(wrap, 'pointerup', end); on(wrap, 'pointercancel', end);
    on(stage, 'click', (e) => { const j = e.target.closest('[data-jump]'); if (j) { snapTo(j.dataset.jump); return; } const ck = e.target.closest('[data-check]'); if (ck) { const id = ck.dataset.check; const d = toggleCheck(id); ck.classList.toggle('on', d); svg.querySelector(`[data-arc="${id}"]`)?.classList.toggle('done', d); } });
    cleanups.push(() => A.stop());
  },
};

/* ─── harness ─── */
const variants = [V1, V2, V3, V4, V5];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const pitems = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;
function moveHighlight() { const el = pitems[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { cleanups.forEach((f) => { try { f(); } catch {} }); cleanups = []; document.documentElement.style.overflow = ''; window.scrollTo(0, 0); stage.innerHTML = variants[i].html(); variants[i].init(stage); }
function setActive(i) { if (i < 0 || i >= variants.length) return; current = i; pitems.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); }); moveHighlight(); const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url); mount(i); }
pitems.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => { if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return; const n = parseInt(e.key, 10); if (n >= 1 && n <= variants.length) setActive(n - 1); else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length); else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length); });
setActive((parseInt(qs.get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
