<style>
@font-face { font-family:'Zen Kaku'; font-weight:400; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:500; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:700; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format('woff2'); }
:root {
  --ink:#141412; --ink2:#4b4a45; --ink3:#86847c; --paper:#f6f4ef; --line:rgba(20,20,10,.08);
  --blue:#1e6bff; --red:#e23b2e; --ok:#2f9e57;
  --ease:cubic-bezier(.23,1,.32,1);
  --serif:'Instrument Serif','Times New Roman',serif; --mincho:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;
  --top:calc(10px + env(safe-area-inset-top));
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:var(--sans); color:var(--ink); background:#e9e6df; -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent; font-variant-numeric:tabular-nums; overscroll-behavior-y:none; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; border:0; background:none; padding:0; }
h1,h2,h3,p { margin:0; }
a { color:inherit; }
svg { display:inline-block; vertical-align:middle; fill:none; }
.glass { background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(22px) saturate(1.8); backdrop-filter:blur(22px) saturate(1.8); box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 0 0 .5px rgba(0,0,0,.06), 0 10px 30px -12px rgba(0,0,0,.28); }
.press { transition:transform 160ms var(--ease); }
.press:active { transform:scale(.96); }

/* ── map + floating chrome ── */
#map { position:fixed; inset:0; z-index:0; background:#e9e6df; }
#map .leaflet-tile-pane { filter:saturate(.5) contrast(.92) brightness(1.06) sepia(.08); }
#map .leaflet-control-attribution { font-size:9px; background:rgba(255,255,255,.6); }
.leaflet-div-icon { background:transparent; border:0; }
.pin { width:30px; height:30px; border-radius:50%; background:#fff; border:2.5px solid var(--c); font:700 12.5px var(--sans); display:grid; place-items:center; box-shadow:0 4px 10px -3px rgba(0,0,0,.35); position:relative; transition:transform 320ms cubic-bezier(.3,1.5,.5,1), background 200ms, color 200ms; }
.pin.done { background:var(--c); color:#fff; }
.pin.nx::after { content:''; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--red); animation:ping 2s var(--ease) infinite; }
@keyframes ping { from { transform:scale(1); opacity:.8; } to { transform:scale(2.2); opacity:0; } }
.pin.sel { transform:scale(1.4) translateY(-5px); z-index:9; background:var(--ink); border-color:#fff; color:#fff; }
.pin.hotel { border-radius:9px; background:var(--ink); color:#fff; border-color:#fff; }
.topfade { position:fixed; top:0; left:0; right:0; height:calc(84px + env(safe-area-inset-top)); z-index:550; pointer-events:none; background:linear-gradient(180deg, rgba(246,244,239,.96) 55%, rgba(246,244,239,0)); opacity:0; transition:opacity 200ms ease; }
body.scrolled .topfade { opacity:1; }
.top { position:fixed; top:var(--top); left:10px; right:10px; z-index:600; display:flex; gap:8px; justify-content:center; max-width:460px; margin:0 auto; }
.tb { height:48px; min-width:48px; border-radius:24px; display:grid; place-items:center; }
.tb:disabled { opacity:.35; }
.dayp { flex:1 1 0; width:0; min-width:0; overflow:hidden; max-width:250px; padding:6px 16px; text-align:center; line-height:1.15; display:block; }
.dayp small { display:block; font-size:11.5px; color:var(--ink3); font-weight:500; }
.dayp b { display:block; max-width:100%; font-size:15px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.yen { font:700 18px var(--sans); }

/* ── sheet (native scroll = native momentum) ── */
.wrap { position:relative; z-index:400; pointer-events:none; max-width:460px; margin:0 auto; }
.spacer { height:42vh; height:42svh; }
.sheet { pointer-events:auto; min-height:100vh; border-radius:30px 30px 0 0; background:rgba(248,246,241,.9); -webkit-backdrop-filter:blur(26px) saturate(1.6); backdrop-filter:blur(26px) saturate(1.6); box-shadow:0 -1px 0 rgba(255,255,255,.9) inset, 0 -14px 40px -18px rgba(0,0,0,.35); padding:8px 0 calc(40px + env(safe-area-inset-bottom)); }
.grab { width:38px; height:5px; border-radius:3px; background:rgba(0,0,0,.16); margin:0 auto 12px; }
.fadein > * { animation:rise 520ms var(--ease) both; }
.fadein > *:nth-child(2) { animation-delay:40ms; } .fadein > *:nth-child(3) { animation-delay:80ms; } .fadein > *:nth-child(4) { animation-delay:120ms; } .fadein > *:nth-child(n+5) { animation-delay:160ms; }
@keyframes rise { from { opacity:0; transform:translateY(14px); } }
.hd { padding:0 20px; }
.hd-r { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.eb { font-size:13px; color:var(--ink3); font-weight:500; }
.hd h1 { font-size:32px; letter-spacing:-.035em; line-height:1.05; margin-top:4px; }
.hd .tg { font-size:14.5px; color:var(--ink2); margin-top:6px; }
.seg { display:inline-flex; background:rgba(0,0,0,.05); border-radius:999px; padding:3px; position:relative; flex:none; }
.seg button { position:relative; z-index:1; padding:5px 10px; font-size:12.5px; font-weight:700; color:var(--ink3); border-radius:999px; transition:color 160ms; }
.seg button.on { color:var(--ink); }
.seg i { position:absolute; top:3px; bottom:3px; left:0; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); transition:transform 260ms var(--ease), width 260ms var(--ease); }
.facts { display:flex; gap:6px; overflow-x:auto; padding:12px 20px 4px; scrollbar-width:none; }
.facts::-webkit-scrollbar { display:none; }
.fact { flex:none; display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:14px; background:#fff; font-size:13px; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.05); white-space:nowrap; }
.fact small { font-weight:500; color:var(--ink3); }
.fact svg { width:18px; height:18px; }
.fact.cd { background:var(--ink); color:#fff; }
.fact.cd small { color:rgba(255,255,255,.6); }

/* ── sun-arc dial ── */
.dial { position:relative; margin:6px auto 0; width:100%; max-width:420px; padding:0 8px; touch-action:none; -webkit-user-select:none; user-select:none; }
#arc { width:100%; display:block; overflow:visible; }
#arc .trk { fill:none; stroke-width:20; stroke-linecap:round; }
#arc .ev { fill:none; stroke-width:20; transition:opacity 300ms; }
#arc .ev.done { opacity:.28; }
#arc .ev.opt { stroke-dasharray:3 3; }
#arc .tk { stroke:#cfc9bc; stroke-width:1.5; stroke-linecap:round; }
#arc text { font:500 10px var(--sans); fill:var(--ink3); text-anchor:middle; dominant-baseline:central; }
#arc .sunmark text { font-size:9px; fill:#c48a12; }
#knob .k1 { filter:drop-shadow(0 4px 8px rgba(0,0,0,.28)); transition:fill 300ms; }
#knob .k2 { transition:opacity 300ms; }
.dc { position:absolute; left:0; right:0; bottom:2px; text-align:center; pointer-events:none; }
.dc-k { font-size:12px; font-weight:700; color:var(--kc,var(--ink3)); letter-spacing:.02em; transition:color 200ms; }
.dc-t { font-family:var(--serif); font-size:58px; line-height:.9; letter-spacing:-.02em; }
.dc-t small { font-family:var(--sans); font-size:13px; letter-spacing:0; margin-left:3px; color:var(--ink3); }
.dc-n { font-size:14.5px; font-weight:700; margin:4px auto 0; max-width:17ch; line-height:1.25; min-height:1.25em; transition:opacity 140ms, filter 140ms; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dc-n
/* ── wallet of passes ── */
.stack { position:relative; margin:18px 12px 0; }
.pass { position:absolute; left:0; right:0; top:0; border-radius:22px; overflow:hidden; color:#fff; background:linear-gradient(165deg, color-mix(in srgb, var(--c) 82%, #fff) 0, var(--c) 36%, color-mix(in srgb, var(--c) 82%, #000) 100%); box-shadow:0 -1px 0 rgba(255,255,255,.2) inset, 0 -8px 22px -12px rgba(0,0,0,.45); will-change:transform; transform-origin:50% 0; }
.band { height:64px; display:flex; align-items:center; gap:12px; padding:0 10px 0 16px; cursor:pointer; }
.pn { font-family:var(--serif); font-style:italic; font-size:30px; line-height:1; width:32px; opacity:.92; flex:none; }
.pt { flex:1; min-width:0; line-height:1.2; }
.pt small { display:block; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; opacity:.72; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pt b { display:block; font-size:16px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.thumb { width:44px; height:44px; border-radius:12px; background:center/cover no-repeat rgba(255,255,255,.15); flex:none; box-shadow:0 0 0 1.5px rgba(255,255,255,.35); }
.pass.open .band { display:none; }
.hero { display:none; position:relative; height:220px; background:center/cover no-repeat var(--c); cursor:pointer; }
.pass.open .hero { display:block; }
.hero .wm { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mincho); font-size:64px; color:rgba(255,255,255,.18); letter-spacing:.06em; padding:0 20px 40px; text-align:center; line-height:1.1; }
.thumb.wm { display:grid; place-items:center; font-family:var(--mincho); font-size:18px; color:rgba(255,255,255,.75); }
.hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.25) 0, rgba(0,0,0,0) 32%, rgba(0,0,0,0) 48%, rgba(0,0,0,.72) 100%); }
.hero-in { position:absolute; left:16px; right:16px; bottom:14px; z-index:1; display:flex; align-items:flex-end; gap:12px; }
.hero-in .pn { font-size:40px; }
.hero-in .pt b { font-size:23px; letter-spacing:-.025em; white-space:normal; line-height:1.12; text-wrap:balance; }
.hero-in .pt small { opacity:.85; }
.pnav { display:none; position:absolute; top:12px; left:12px; right:12px; z-index:2; align-items:flex-start; justify-content:space-between; gap:8px; }
.pass.open .pnav { display:flex; }
.pass.open { touch-action:pan-y; }
.st { width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.36); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; display:grid; place-items:center; flex:none; transition:transform 160ms var(--ease), opacity 200ms; }
.st:active { transform:scale(.92); }
.st:disabled { opacity:.25; }
.pnav .mid { flex:1; min-width:0; display:flex; justify-content:center; }
.jp2 { display:inline-flex; flex-direction:column; align-items:center; max-width:100%; padding:5px 13px 6px; border-radius:16px; background:rgba(0,0,0,.36); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); line-height:1.2; text-align:center; }
.jp2 b { font-family:var(--mincho); font-size:15.5px; font-weight:700; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.jp2 small { font-size:11.5px; font-weight:500; opacity:.88; letter-spacing:.01em; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cnt { font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; background:rgba(0,0,0,.36); }
.pass.tk .pnav { position:static; padding:12px 12px 0; }
.pass.tk .st, .pass.tk .jp2, .pass.tk .cnt { background:rgba(0,0,0,.07); color:var(--ink); -webkit-backdrop-filter:none; backdrop-filter:none; }
.jpn { position:absolute; top:12px; right:14px; max-width:52%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:1; font-family:var(--mincho); font-size:15px; padding:4px 10px; border-radius:999px; background:rgba(0,0,0,.35); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.area { position:absolute; top:12px; left:14px; max-width:42%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:1; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.35); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.body { display:none; padding:14px 16px 16px; }
.pass.open .body { display:block; animation:fadeup 360ms var(--ease) both 60ms; }
@keyframes fadeup { from { opacity:0; transform:translateY(6px); } }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; gap:6px; align-items:center; padding:5px 10px; border-radius:10px; background:rgba(255,255,255,.16); font-size:13px; font-weight:700; }
.chip small { font-weight:500; opacity:.75; }
.desc { font-size:15px; line-height:1.5; margin-top:12px; white-space:pre-line; opacity:.95; }
.cv-in { font:inherit; font-size:.82em; font-weight:700; padding:0 5px; border-radius:6px; background:rgba(255,255,255,.18); white-space:nowrap; color:inherit; transition:background 160ms; }
.cv-in:active { background:rgba(255,255,255,.32); }
.dyk { margin-top:14px; padding:12px 14px; border-radius:14px; background:rgba(0,0,0,.16); font-size:14px; line-height:1.45; }
.dyk b { display:block; font-family:var(--serif); font-style:italic; font-size:18px; font-weight:400; margin-bottom:2px; }
.acts { display:flex; gap:8px; margin-top:14px; }
.acts > * { flex:1; min-height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:14.5px; text-decoration:none; }
.a-dir { background:#fff; color:var(--c); }
.a-jp { background:rgba(255,255,255,.16); color:#fff; font-family:var(--mincho); flex:0 0 58px; font-size:17px; }
.a-st { background:rgba(255,255,255,.16); color:#fff; }
.pass.done .a-st { background:rgba(0,0,0,.2); }
.credit { font-size:10.5px; opacity:.6; margin-top:12px; }
.credit a { text-decoration:none; }
.hanko { position:absolute; top:7px; right:66px; width:50px; height:50px; border-radius:50%; border:2.5px solid var(--red); color:var(--red); background:rgba(252,247,238,.95); display:grid; place-items:center; font-family:var(--mincho); font-size:25px; opacity:0; transform:scale(1.6) rotate(-30deg); pointer-events:none; z-index:3; }
.pass.open .hanko { top:auto; bottom:auto; top:150px; right:16px; }
.pass.done .hanko { opacity:.96; transform:rotate(-14deg); }
.pass.done.stamped .hanko { animation:stamp 380ms cubic-bezier(.2,1.3,.4,1); }
@keyframes stamp { 0% { opacity:0; transform:scale(1.7) rotate(-30deg); } 60% { opacity:1; transform:scale(.94) rotate(-12deg); } 100% { transform:rotate(-14deg); } }
/* tickets: transit legs on paper */
.pass.tk { color:var(--ink); background:radial-gradient(circle at 0 64px, transparent 10px, #f3eee3 10.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 64px, transparent 10px, #f3eee3 10.5px) right/51% 100% no-repeat; box-shadow:none; filter:drop-shadow(0 -6px 14px rgba(0,0,0,.28)); }
.pass.tk .band { border-bottom:2px dashed rgba(0,0,0,.12); margin:0 0; }
.pass.tk .tkic { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 14%, #fff); color:var(--c); flex:none; }
.pass.tk.open .band { display:flex; }
.pass.tk .chip { background:rgba(0,0,0,.06); }
.pass.tk .a-st, .pass.tk .a-jp { background:rgba(0,0,0,.07); color:var(--ink); }
.pass.tk .a-dir { background:var(--ink); color:#fff; }
.pass.tk .cv-in { background:rgba(0,0,0,.07); }
.route { display:flex; align-items:center; gap:10px; padding:4px 0 10px; }
.route div { flex:1; min-width:0; }
.route small { display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; }
.route b { display:block; font-size:16px; letter-spacing:-.015em; line-height:1.2; }
.route .arr { color:var(--c); flex:none; }

/* ── after the wallet ── */
.sec { padding:26px 20px 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; }
.cards { display:grid; gap:10px; padding:0 12px; }
.card { background:#fff; border-radius:20px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 20px -14px rgba(0,0,0,.25); }
.card small { font-size:11.5px; font-weight:700; color:var(--ink3); letter-spacing:.02em; }
.card h3 { font-size:16.5px; letter-spacing:-.015em; line-height:1.25; margin-top:1px; }
.card p { font-size:14px; color:var(--ink2); margin-top:4px; white-space:pre-line; }
.card.warn small { color:#c2410c; }
.opts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.opt { padding:8px 12px; border-radius:12px; background:var(--paper); font-size:13.5px; font-weight:700; text-align:left; transition:background 180ms, color 180ms, transform 160ms var(--ease); }
.opt.on { background:var(--ink); color:#fff; }
.opt:active { transform:scale(.97); }
.know { display:flex; gap:8px; overflow-x:auto; padding:0 12px 4px; scrollbar-width:none; scroll-snap-type:x mandatory; }
.know::-webkit-scrollbar { display:none; }
.know .card { flex:0 0 78%; scroll-snap-align:start; }
.know .card h3 { font-size:15px; }
.stay { position:relative; border-radius:22px; overflow:hidden; margin:0 12px; height:150px; background:center/cover no-repeat #555; color:#fff; display:flex; align-items:flex-end; text-decoration:none; }
.stay::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.7)); }
.stay div { position:relative; z-index:1; padding:14px 16px; }
.stay small { font-size:11.5px; font-weight:700; opacity:.8; }
.stay b { display:block; font-size:19px; letter-spacing:-.02em; }
.foot { padding:24px 20px 0; font-size:11.5px; color:var(--ink3); text-align:center; }

/* ── modal sheets (kit + japanese card) ── */
.scrim { position:fixed; inset:0; z-index:900; background:rgba(20,16,10,.3); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 260ms ease; }
.scrim.on { opacity:1; pointer-events:auto; }
.kit { position:fixed; left:0; right:0; bottom:0; z-index:950; max-width:460px; margin:0 auto; border-radius:30px 30px 0 0; background:rgba(250,248,244,.94); -webkit-backdrop-filter:blur(30px) saturate(1.7); backdrop-filter:blur(30px) saturate(1.7); padding:8px 0 calc(16px + env(safe-area-inset-bottom)); transform:translate3d(0,110%,0); touch-action:none; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 -20px 60px -20px rgba(0,0,0,.4); }
.kit-h { padding:0 16px 10px; display:flex; justify-content:center; }
.kit-b { overflow-y:auto; padding:0 16px; touch-action:pan-y; overscroll-behavior:contain; }
.cvbox { background:#fff; border-radius:24px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.cvin { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:2px 2px 12px; border-bottom:1px solid var(--line); }
.cvin small, .cvo small { font-size:12px; font-weight:700; color:var(--ink3); display:block; line-height:1.2; }
.cvin small i, .cvo small i { font-style:normal; font-weight:500; }
.cvin b { font-family:var(--serif); font-size:50px; line-height:1; letter-spacing:-.02em; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cvo { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; padding:10px 2px; border-bottom:1px solid var(--line); text-align:left; }
.cvo:last-child { border-bottom:0; padding-bottom:2px; }
.cvo b { font-family:var(--serif); font-size:30px; line-height:1; font-weight:400; color:var(--ink2); white-space:nowrap; }
.cvo:active b { color:var(--ink); }
.cvinl { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; font-size:13px; font-weight:700; color:var(--ink2); }
.swap { width:40px; height:40px; border-radius:50%; background:var(--paper); display:grid; place-items:center; transition:transform 300ms var(--ease); }
.qk { display:flex; gap:6px; overflow-x:auto; margin:12px 0 0; scrollbar-width:none; }
.qk button { flex:none; padding:8px 12px; border-radius:12px; background:#fff; font-size:13.5px; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.05); }

  g += `<path class="trk" stroke="#efe5cc" d="${arc(Math.max(A0, aRise), Math.min(A1, aSet), R)}"/>`;
  if (aSet < A1) g += `<path class="trk" stroke="#d6d5e2" d="${arc(aSet, A1, R)}"/>`;

  svg.innerHTML = g;

  let curId = null, flyT = 0;
  const at = (m) => { let best = null; for (const x of sp) if (x.s[0] <= m + 0.5) best = x; return best || sp[0]; };

    const m = minAt(a); const night = m >= sun.set || m < sun.rise; k1.setAttribute('fill', night ? '#f4f1ff' : '#ffc53d'); k2.setAttribute('opacity', night ? 1 : 0);
    const [tm, ap] = fmt(Math.round(m / 5) * 5); document.getElementById('dct').innerHTML = `${tm}<small>${ap}</small>`;
    const x0 = at(m); const nx = nextEv();
    wrap.style.setProperty('--kc', isTicket(x0.e) ? legHex(x0.e) : catOf(x0.e).c);
    document.getElementById('dck').textContent = nx && nx.id === x0.e.id ? 'Next up' : done(x0.e.id) ? 'Done' : m > x0.s[1] ? 'Then, free time' : 'Then';
    if (x0.e.id !== curId) { curId = x0.e.id; buzz(4); const n = document.getElementById('dcn'); n.classList.add('swap'); setTimeout(() => { n.textContent = x0.e.title; n.classList.remove('swap'); }, 110);

  };
}

/* ═══ wallet: chosen pass rises to the top, the rest fall into a pile ═══ */
function buildStack() {
  const stack = document.getElementById('stack'); const cards = [...stack.querySelectorAll('.pass')];
  const BAND = 64, GAP = 12;
  const st = cards.map((el) => { const o = { y: 0, s: 1 }; const ap = () => { el.style.transform = `translate3d(0,${o.y.toFixed(2)}px,0) scale(${o.s.toFixed(4)})`; }; return { el, id: el.dataset.id, o, Y: new Spring(0, (v) => { o.y = v; ap(); }, 0.3), S: new Spring(1, (v) => { o.s = v; ap(); }, 0.0005) }; });
  const layout = (instant) => {
    const selIdx = st.findIndex((c) => c.id === ui.sel);
    st.forEach((c) => c.el.classList.toggle('open', c.id === ui.sel));
    const Hs = selIdx >= 0 ? st[selIdx].el.offsetHeight : 0;
    let k = 0;
    st.forEach((c, i) => {
      let y;
      if (i === selIdx) { y = 0; c.el.style.zIndex = 1; }
      else { y = (selIdx >= 0 ? Hs + GAP : 0) + k * BAND; c.el.style.zIndex = 10 + k; k++; c.el.style.height = ''; }
      if (instant) c.Y.set(y); else c.Y.to(y, { response: 0.48, damping: 0.86 });
    });
    stack.style.height = (selIdx >= 0 ? Hs + GAP : 0) + Math.max(0, k - 1) * BAND + 76 + 'px';
  };

    select(id, { fromDial, scroll } = {}) {

      if (scroll) { const top = stack.getBoundingClientRect().top; if (top < 70 || top > innerHeight * 0.6) window.scrollTo({ top: scrollY + top - 90, behavior: RM ? 'auto' : 'smooth' }); }
    },
    layout,
    refresh() { st.forEach((c) => { const d = done(c.id); c.el.classList.toggle('done', d); const b = c.el.querySelector('[data-stamp]'); if (b) b.textContent = d ? 'Stamped 済' : 'Stamp 済'; }); },
    thump(id) { const c = st.find((x) => x.id === id); if (!c) return; c.el.classList.remove('stamped'); void c.el.offsetWidth; c.el.classList.add('stamped'); c.S.set(0.975); c.S.to(1, { response: 0.32, damping: 0.45 }); },
  };
}

}

  stops.forEach((s) => { const e = s.e; const m = L.marker([e.place.lat, e.place.lng], { icon: L.divIcon({ className: '', html: `<div class="pin" data-pin="${s.n}" style="--c:${catOf(e).c}">${s.n}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map); m.on('click', () => { stackApi.select(e.id, { scroll: true }); dialApi.focus(e.id); focusMap(e.id); }); layers.push(m); });

    lines.forEach(({ pl, dashed }, i) => { const p = pl._path; if (!p) return; const len = p.getTotalLength(); if (RM) { p.style.strokeDasharray = dashed ? '2 10' : ''; return; } p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.getBoundingClientRect(); p.style.transition = `stroke-dashoffset 800ms cubic-bezier(.77,0,.175,1) ${200 + i * 120}ms`; p.style.strokeDashoffset = 0; setTimeout(() => { p.style.transition = ''; p.style.strokeDasharray = dashed ? '2 10' : ''; p.style.strokeDashoffset = ''; }, 1050 + i * 120); });

const kitEl = document.getElementById('kit'), scrim = document.getElementById('scrim');
let kitH = 0; const KY = new Spring(0, (y) => { kitEl.style.transform = `translate3d(0,${y}px,0)`; }, 0.3);
function openKit() { renderKit(); kitH = kitEl.offsetHeight; KY.set(kitH + 40); scrim.classList.add('on'); KY.to(0, { response: 0.42, damping: 0.86 }); refreshFx().then(() => { updateInline(); if (kit.tab === 'yen' && scrim.classList.contains('on')) renderKit(); }); }
function closeKit(v = 0) { scrim.classList.remove('on'); KY.to(kitEl.offsetHeight + 40, { response: 0.36, damping: 1, velocity: v }); }
{ const T = tracker(); let d = null;
  kitEl.addEventListener('pointerdown', (e) => { if (e.target.closest('.kit-b') && kitEl.querySelector('.kit-b').scrollTop > 0) return; if (e.target.closest('button,select,a')) return; d = { id: e.pointerId, y0: e.clientY, s0: KY.x, on: false }; T.reset(); });
  window.addEventListener('pointermove', (e) => { if (!d || e.pointerId !== d.id) return; const dy = e.clientY - d.y0; if (!d.on) { if (dy < 8) return; d.on = true; KY.stop(); } const y = dy > 0 ? dy : -rubber(-dy, 300); KY.set(d.s0 + y); T.add(KY.x); });
  const end = (e) => { if (!d || e.pointerId !== d.id) return; if (d.on) { const v = T.vel(); if (KY.x + project(v, 0.99) > kitEl.offsetHeight * 0.35) closeKit(v); else KY.to(0, { response: 0.4, damping: 0.85, velocity: v }); } d = null; };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end); }
kitEl.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (t) { kit.tab = t.dataset.tab; renderKit(); return; }
  const k = e.target.closest('[data-k]'); if (k) { const v = k.dataset.k; if (kit.fresh) { kit.amt = '0'; kit.fresh = false; }
    if (v === '⌫') kit.amt = kit.amt.slice(0, -1) || '0';
    else if (v === '.') { if (!kit.amt.includes('.')) kit.amt += '.'; }

    if (kit.amt === '00' || kit.amt === '') kit.amt = '0'; if (kit.amt.length > 9) kit.amt = kit.amt.slice(0, 9); renderKit(); return; }
  const fr = e.target.closest('[data-from]'); if (fr) { const yen = (+kit.amt || 0) * rateOf(kit.from); const c = fr.dataset.from; const v = yen / rateOf(c); kit.amt = String(c === 'JPY' ? Math.round(v) : Math.round(v * 100) / 100); kit.from = c; kit.fresh = true; renderKit(); return; }
  const il = e.target.closest('[data-inl]'); if (il) { fx.cur = il.dataset.inl; ls.set('japan2026.cur3', fx.cur); updateInline(); renderKit(); return; }
  const q = e.target.closest('[data-q]'); if (q) { kit.amt = q.dataset.q; kit.fresh = true; renderKit(); return; }
  const p = e.target.closest('[data-phr]'); if (p) { const [en, jp, ro] = PHRASES[+p.dataset.phr]; showJp(jp, ro, null, null, en); }

scrim.addEventListener('click', () => closeKit());

/* ═══ wiring ═══ */
function renderDay({ keepScroll } = {}) {
  prepare(); renderTop(); renderSheet(); renderMap();
  const nx = nextEv(); const first = (tripDay && tripDay.id === day.id) ? (events.find((e) => { const s = span(e); return s && s[1] > nowMin() && !done(e.id); }) || nx) : nx;
  ui.sel = null; const target = (first || events[0] || {}).id;
  if (target) { ui.sel = target; stackApi.layout(true); syncPins(); const s = span(events.find((e) => e.id === target)); dialApi.initAt ? dialApi.initAt(tripDay && tripDay.id === day.id ? nowMin() : (s ? s[0] : 0)) : null; if (!(tripDay && tripDay.id === day.id)) setTimeout(() => dialApi.focus(target), 0); }
  if (!keepScroll) window.scrollTo(0, 0);
  const url = new URL(location); url.searchParams.set('d', day.id); history.replaceState(null, '', url);
}
function go(delta) { const i = DAYS.indexOf(day) + delta; if (i < 0 || i >= DAYS.length) return; ui.dayId = DAYS[i].id; renderDay(); }
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('dayp').addEventListener('click', () => { if (tripDay) { ui.dayId = tripDay.id; renderDay(); } else window.scrollTo({ top: 0, behavior: 'smooth' }); });
document.getElementById('kitbtn').addEventListener('click', openKit);
document.getElementById('sheet').addEventListener('click', (e) => {
  if (e.target.closest('.cv-in')) { cycleCur(); buzz(4); return; }
  const sp = e.target.closest('[data-step]'); if (sp) { if (!sp.disabled) step(+sp.dataset.step); return; }
  if (swiped) { swiped = false; return; }
  const st = e.target.closest('[data-stamp]'); if (st) { const id = st.dataset.stamp; const was = done(id); store.toggleCheck(id); if (!was) { buzz(12); stackApi.thump(id); } return; }
  const j = e.target.closest('[data-jp]'); if (j) { const pi = PLACES[j.dataset.jp]; showJp(pi.ja, pi.ro, 'ここに行きたいです', 'koko ni ikitai desu', `${j.dataset.jp} · "I'd like to go here"`); return; }
  const pk = e.target.closest('[data-pick]'); if (pk && !e.target.closest('a')) { const id = pk.dataset.pick; if (ui.sel !== id) { stackApi.select(id, { scroll: true }); dialApi.focus(id); focusMap(id); } return; }
  const w = e.target.closest('[data-who]'); if (w) { ui.who = w.dataset.who; ls.set('japan2026.whoMix', ui.who); renderDay({ keepScroll: true }); return; }
  const c = e.target.closest('[data-choice]'); if (c) { store.setChoice(c.dataset.choice, c.dataset.opt); renderDay({ keepScroll: true }); }
});
function step(d) { const i = events.findIndex((x) => x.id === ui.sel); const j = Math.max(0, Math.min(events.length - 1, i + d)); if (j === i) return; const id = events[j].id; stackApi.select(id, { scroll: true }); dialApi.focus(id); focusMap(id); buzz(4); }
let swiped = false;
{ let sw = null;
  document.getElementById('sheet').addEventListener('pointerdown', (e) => { const card = e.target.closest('.pass.open'); if (!card || e.target.closest('a,button')) return; sw = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() }; });
  const end = (e) => { if (!sw || e.pointerId !== sw.id) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y, v = Math.abs(dx) / Math.max(1, performance.now() - sw.t); sw = null; if (Math.abs(dx) > Math.abs(dy) * 1.6 && (Math.abs(dx) > 60 || (Math.abs(dx) > 25 && v > 0.5))) { swiped = true; setTimeout(() => (swiped = false), 80); step(dx < 0 ? 1 : -1); } };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', () => (sw = null)); }
store.subscribe(() => { if (!stackApi) return; stackApi.refresh(); dialApi.refresh(); syncPins(); });
