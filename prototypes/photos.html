<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip photos · prototype</title>
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
@font-face { font-family:'Zen Kaku'; font-weight:500; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:700; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format('woff2'); }
:root { --ink:#141412; --ink2:#4b4a45; --ink3:#86847c; --paper:#f6f4ef; --line:rgba(20,20,10,.08); --blue:#1e6bff; --red:#e23b2e; --ok:#2f9e57; --ease:cubic-bezier(.23,1,.32,1);
  --sans:'Zen Kaku','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:var(--sans); font-weight:500; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; line-height:1.45; -webkit-tap-highlight-color:transparent; font-variant-numeric:tabular-nums; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; border:0; background:none; padding:0; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,p { margin:0; }
.press { transition:transform 160ms var(--ease); } .press:active { transform:scale(.96); }
.page { max-width:520px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 0 130px; }

/* top */
.bar { display:flex; align-items:center; gap:8px; padding:0 14px; }
.tback { display:flex; align-items:center; gap:4px; height:36px; padding:0 14px 0 9px; border-radius:999px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:14.5px; font-weight:700; }
.bar .sp { flex:1; }
.pill { height:36px; padding:0 14px; border-radius:999px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px; }
.pill.dark { background:var(--ink); color:#fff; box-shadow:none; }
.proto { margin:12px 14px 0; padding:9px 12px; border-radius:14px; background:#fff4d6; color:#7a5a00; font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.proto b { font-weight:700; }
.proto .seg { margin-left:auto; }
.ph { padding:18px 20px 6px; }
.ph small { font-size:12px; font-weight:700; color:var(--ink3); letter-spacing:.06em; text-transform:uppercase; }
.ph h1 { font-size:32px; letter-spacing:-.035em; line-height:1.05; margin-top:2px; font-weight:700; }
.ph p { font-size:14.5px; color:var(--ink2); margin-top:6px; }
.seg { display:inline-flex; background:rgba(0,0,0,.06); border-radius:999px; padding:3px; }
.seg button { padding:5px 12px; font-size:13px; font-weight:700; color:var(--ink3); border-radius:999px; }
.seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.filters { display:flex; align-items:center; gap:10px; padding:10px 20px 4px; font-size:13px; color:var(--ink3); }

/* "on the plan" preview: a pass with its photo strip */
.sec { padding:22px 20px 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; }
.pass { margin:0 14px; border-radius:22px; overflow:hidden; color:#fff; background:linear-gradient(165deg, color-mix(in srgb, var(--c) 82%, #fff) 0, var(--c) 40%, color-mix(in srgb, var(--c) 80%, #000) 100%); box-shadow:0 14px 30px -18px rgba(0,0,0,.5); }
.pass .hero { height:150px; background-size:cover; background-position:center; position:relative; }
.pass .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.55)); }
.pass .t { position:absolute; left:16px; right:16px; bottom:12px; z-index:1; }
.pass .t small { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.9; }
.pass .t b { display:block; font-size:22px; line-height:1.1; }
.pstrip { display:flex; align-items:center; gap:6px; padding:12px 12px 14px; }
.pstrip .th { width:52px; height:52px; border-radius:12px; overflow:hidden; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.35); }
.pstrip .cnt { margin-left:auto; height:34px; padding:0 12px; border-radius:999px; background:rgba(255,255,255,.2); font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; }
.passnote { padding:8px 22px 0; font-size:13px; color:var(--ink3); }

/* the gallery, laid out like the plan */
.day { margin-top:18px; }
.dh { position:sticky; top:0; z-index:5; padding:calc(8px + env(safe-area-inset-top)) 20px 8px; background:rgba(246,244,239,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); display:flex; align-items:baseline; gap:8px; }
.dh b { font-size:20px; letter-spacing:-.02em; }
.dh small { font-size:13px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dh .n { margin-left:auto; font-size:12.5px; font-weight:700; color:var(--ink3); white-space:nowrap; }
.stop { padding:10px 14px 0; }
.sh { display:flex; align-items:center; gap:8px; padding:0 6px 7px; }
.sh i { width:9px; height:9px; border-radius:3px; background:var(--c); flex:none; }
.sh b { font-size:15px; line-height:1.2; }
.sh small { font-size:12.5px; color:var(--ink3); white-space:nowrap; }
.sh .n { margin-left:auto; font-size:12.5px; color:var(--ink3); font-weight:700; }
.sh .plan { font-size:12.5px; font-weight:700; color:var(--blue); white-space:nowrap; }
.grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:3px; border-radius:16px; overflow:hidden; touch-action:pan-y; }
.th { position:relative; aspect-ratio:1; overflow:hidden; background:#ddd8cc; }
.th img, .th video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; }
.th .vd { position:absolute; right:6px; bottom:5px; z-index:1; color:#fff; font-size:11.5px; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.6); display:flex; align-items:center; gap:3px; }
.th .by { position:absolute; left:5px; bottom:5px; z-index:1; width:18px; height:18px; border-radius:50%; background:var(--c); color:#fff; font-size:8.5px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 1.5px #fff; }
.th .new { position:absolute; left:5px; top:5px; z-index:1; padding:2px 6px; border-radius:6px; background:var(--ok); color:#fff; font-size:10.5px; font-weight:700; }
.th .ck { display:none; position:absolute; right:6px; top:6px; z-index:2; width:22px; height:22px; border-radius:50%; box-shadow:inset 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.4); }
body.sel .th .ck { display:block; }
.th.on .ck { background:var(--blue); box-shadow:inset 0 0 0 2px #fff; }
.th.on .ck::after { content:''; position:absolute; left:7px; top:3.5px; width:6px; height:11px; border:solid #fff; border-width:0 2.4px 2.4px 0; transform:rotate(45deg); }
.th.on img, .th.on video { transform:scale(.88); border-radius:6px; transition:transform 160ms var(--ease); }
.other .sh i { background:#c9c4b8; }
.empty { margin:8px 14px 0; padding:18px; border-radius:16px; border:1.5px dashed rgba(20,20,10,.15); color:var(--ink3); font-size:14px; text-align:center; }
.hiddenrow { margin:26px 14px 0; display:flex; justify-content:center; }

/* select bar */
.selbar { position:fixed; left:0; right:0; bottom:0; z-index:40; padding:10px 14px calc(12px + env(safe-area-inset-bottom)); background:rgba(252,250,246,.96); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 -1px 0 var(--line); display:flex; align-items:center; gap:8px; transform:translateY(110%); transition:transform 280ms var(--ease); }
body.sel .selbar { transform:none; }
.selbar .n { flex:1; font-weight:700; font-size:15px; }
.selbar button { height:42px; padding:0 16px; border-radius:14px; background:rgba(0,0,0,.06); font-weight:700; font-size:14.5px; }
.selbar button.go { background:var(--ink); color:#fff; }
.selbar button:disabled { opacity:.4; }

/* sheets */
.scrim { position:fixed; inset:0; z-index:60; background:rgba(14,12,8,.4); opacity:0; pointer-events:none; transition:opacity 220ms ease; }
.scrim.on { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; max-width:520px; margin:0 auto; max-height:86vh; overflow-y:auto; overscroll-behavior:contain; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); border-radius:28px 28px 0 0; background:#faf8f4; box-shadow:0 -20px 60px -20px rgba(0,0,0,.4); transform:translate3d(0,105%,0); transition:transform 360ms var(--ease); }
.sheet.on { transform:none; }
.grab { width:38px; height:5px; border-radius:3px; background:rgba(0,0,0,.16); margin:0 auto 12px; }
.sh-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.sh-h b { font-size:19px; }
.sh-h button { color:var(--ink3); font-weight:700; }
.daychips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
.daychips::-webkit-scrollbar { display:none; }
.daychips button { flex:none; padding:7px 12px; border-radius:12px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:13px; font-weight:700; text-align:left; line-height:1.15; }
.daychips button small { display:block; font-size:11px; font-weight:500; color:var(--ink3); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.daychips button.on { background:var(--ink); color:#fff; box-shadow:none; }
.daychips button.on small { color:rgba(255,255,255,.7); }
.stoplist { background:#fff; border-radius:18px; box-shadow:0 0 0 1px var(--line); overflow:hidden; }
.stoplist button { display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; text-align:left; border-top:1px solid var(--line); }
.stoplist button:first-child { border-top:0; }
.stoplist button:active { background:#f3f0ea; }
.stoplist i { width:10px; height:10px; border-radius:3px; background:var(--c); flex:none; }
.stoplist small { font-size:12.5px; color:var(--ink3); width:66px; flex:none; }
.stoplist b { font-size:15px; line-height:1.25; }
/* upload */
.up-pick { display:flex; flex-direction:column; align-items:center; gap:6px; padding:22px; border-radius:18px; border:1.5px dashed rgba(20,20,10,.2); text-align:center; color:var(--ink2); font-size:14px; }
.up-pick b { font-size:16px; color:var(--ink); }
.up-pick input { display:none; }
.uprow { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.uprow .th { width:46px; height:46px; border-radius:10px; flex:none; }
.uprow .m { flex:1; min-width:0; }
.uprow .m b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.uprow .m small { display:block; font-size:12.5px; color:var(--ink3); }
.uprow .m small em { font-style:normal; color:var(--ink); font-weight:700; }
.prog { height:4px; border-radius:2px; background:rgba(0,0,0,.08); margin-top:6px; overflow:hidden; }
.prog i { display:block; height:100%; width:0; background:var(--blue); transition:width 200ms linear; }
.uprow.done .prog i { background:var(--ok); }
.honest { font-size:12.5px; color:var(--ink3); margin-top:12px; }

/* full-screen viewer */
.vw { position:fixed; inset:0; z-index:80; background:#000; touch-action:none; opacity:0; pointer-events:none; transition:opacity 200ms ease; }
.vw.on { opacity:1; pointer-events:auto; }
.vw .track { position:absolute; inset:0; display:flex; will-change:transform; }
.vw .slide { flex:none; width:100vw; height:100%; display:grid; place-items:center; overflow:hidden; }
.vw .frame { position:relative; width:100vw; max-height:78vh; aspect-ratio:3/4; overflow:hidden; transform-origin:50% 50%; will-change:transform; }
.vw .frame.free { aspect-ratio:auto; height:78vh; }
.vw .frame img, .vw .frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; }
.vw .frame.free img, .vw .frame.free video { object-fit:contain; }
.vw .playbadge { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:68px; height:68px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center; color:#fff; }
.vw .top { position:absolute; left:0; right:0; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:calc(12px + env(safe-area-inset-top)) 14px 10px; color:#fff; background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0)); transition:opacity 200ms; }
.vw .top b { font-size:14.5px; }
.vw .x { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.14); display:grid; place-items:center; }
.vw .cap { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); color:#fff; background:linear-gradient(0deg, rgba(0,0,0,.7), rgba(0,0,0,0)); transition:opacity 200ms; }
.vw .who { display:flex; align-items:center; gap:10px; }
.vw .who .av { width:32px; height:32px; border-radius:50%; background:var(--c); display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
.vw .who b { display:block; font-size:15px; }
.vw .who small { display:block; font-size:12.5px; opacity:.75; }
.vw .acts { display:flex; gap:8px; margin-top:12px; }
.vw .acts a, .vw .acts button { height:38px; padding:0 14px; border-radius:12px; background:rgba(255,255,255,.14); color:#fff; font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px; }
.vw.chrome-off .top, .vw.chrome-off .cap { opacity:0; pointer-events:none; }

.toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:90; transform:translate(-50%, 20px); opacity:0; pointer-events:none; display:flex; align-items:center; gap:12px; padding:10px 10px 10px 16px; border-radius:16px; background:#141412; color:#fff; font-size:14px; white-space:nowrap; transition:opacity 200ms, transform 260ms var(--ease); }
.toast.on { opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
.toast button { height:32px; padding:0 12px; border-radius:10px; background:rgba(255,255,255,.16); color:#fff; font-weight:700; }
.fab { position:fixed; right:max(16px, calc(50% - 244px)); bottom:calc(20px + env(safe-area-inset-bottom)); z-index:30; height:56px; padding:0 22px 0 18px; border-radius:28px; background:var(--ink); color:#fff; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; box-shadow:0 14px 30px -10px rgba(0,0,0,.5); transition:transform 280ms var(--ease); }
body.sel .fab, body.guest .fab { transform:translateY(160%); }
body.guest [data-select] { display:none; }
@media (prefers-reduced-motion: reduce) { .sheet, .selbar, .toast, .fab, .vw { transition-duration:1ms; } }
</style>
</head>
<body>
<main class="page" id="page"></main>
<button class="fab press" id="fab" data-upload><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Upload</button>
<div class="selbar" id="selbar"><span class="n" id="seln">Tap or drag across photos</span><button data-hide disabled>Hide</button><button class="go" data-assign disabled>Assign to…</button><button data-selx>Done</button></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>
<div class="vw" id="vw" role="dialog" aria-label="Photo viewer"><div class="track" id="track"></div>
  <div class="top"><button class="x" data-vclose aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button><b id="vcount"></b><span style="width:40px"></span></div>
  <div class="cap" id="vcap"></div></div>
<div class="toast" id="toast" role="status"></div>
<script type="module">
import { DAYS } from '../data/itinerary.js?v=9';
import { PLACES } from '../data/places.js?v=9';
import { CAT } from '../js/colors.js?v=9';
import { stopsOf, jstOf, matchStop, fmtMin } from '../js/plan-time.js?v=9';
import { readTaken } from '../js/exif.js?v=9';

/* PROTOTYPE: demo photos only. Nothing is uploaded or saved, and nothing here touches the real trip data. */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s) => document.querySelector(s);
const PEOPLE = { naf: { name: 'Naf', ini: 'N', c: '#2c4f86', couple: 'nasa' }, sara: { name: 'Sara', ini: 'S', c: '#6f4f98', couple: 'nasa' }, mariam: { name: 'Mariam', ini: 'Ma', c: '#cc5a26', couple: 'mm' }, m: { name: 'Mo', ini: 'Mo', c: '#b94b74', couple: 'mm' } };
const ME = (() => { try { const v = JSON.parse(localStorage.getItem('trips.me')); return PEOPLE[v] ? v : 'naf'; } catch { return 'naf'; } })();
const JST = 9 * 3600e3;
const dayStart = (d) => Date.parse(d.date + 'T00:00:00Z') - JST;
const dayById = Object.fromEntries(DAYS.map((d) => [d.id, d]));
const fmtDate = (d) => new Date(d.date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const kindColor = (s) => { const k = /dinner|lunch|breakfast|market|ramen|sushi|food|cafe|izakaya|okonomiyaki/i.test(s.title) ? 'food' : /shop|vintage|streetwear|don quijote|mall|arcade|ginza|uniqlo|street/i.test(s.title) ? 'shop' : /train|bus|subway|walk|→|keihan|shinkansen|transfer|taxi/i.test(s.title) ? 'transit' : /hotel|check/i.test(s.title) ? 'hotel' : 'sight'; return CAT[k][0]; };
const placeImg = (s) => (s.place && PLACES[s.place.name] && PLACES[s.place.name].img) ? '../img/places/' + PLACES[s.place.name].img : null;

/* ── demo photos: our place pictures, cropped differently so a stop looks like several shots, on real stops Day 1–9 ── */
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pick = (a) => a[Math.floor(rnd() * a.length)];
let photos = [];
for (const d of DAYS.slice(0, 9)) {
  const stops = stopsOf(d).filter((s) => s.range && placeImg(s) && !/train|bus|subway|→|keihan|shinkansen/i.test(s.title));
  for (const s of stops) {
    const n = 2 + Math.floor(rnd() * 8);
    for (let i = 0; i < n; i++) {
      const min = s.range[0] + Math.floor(rnd() * Math.max(5, s.range[1] - s.range[0]));
      photos.push({ id: 'p' + photos.length, day: d.id, stop: s.id, takenAt: dayStart(d) + min * 60e3, by: pick(Object.keys(PEOPLE)), img: placeImg(s),
        crop: { x: Math.round(rnd() * 100), y: Math.round(rnd() * 100), z: (1 + rnd() * 0.9).toFixed(2), hue: Math.round(rnd() * 16 - 8), br: (0.92 + rnd() * 0.16).toFixed(2) },
        video: rnd() < 0.08 ? `0:${String(5 + Math.floor(rnd() * 50)).padStart(2, '0')}` : null });
    }
  }
  // a couple of in-between moments (on the walk, at the hotel) that don't belong to a stop
  const imgs = stops.map(placeImg);
  if (imgs.length) for (let i = 0; i < 2; i++) photos.push({ id: 'p' + photos.length, day: d.id, stop: null, takenAt: dayStart(d) + (22 * 60 + Math.floor(rnd() * 80)) * 60e3, by: pick(Object.keys(PEOPLE)), img: pick(imgs), crop: { x: Math.round(rnd() * 100), y: 50, z: '1.8', hue: 0, br: '0.8' }, video: null });
}

const ui = { couple: 'all', viewer: 'member', sel: new Set() };
const visible = () => photos.filter((p) => !p.hidden && (ui.couple === 'all' || PEOPLE[p.by].couple === ui.couple));
const stopOf = (p) => (p.stop ? stopsOf(dayById[p.day]).find((s) => s.id === p.stop) : null);
const imgTag = (p, cls = '') => p.url
  ? (p.isVideo ? `<video class="${cls}" src="${p.url}#t=0.1" muted playsinline preload="metadata"></video>` : `<img class="${cls}" src="${p.url}" alt="" loading="lazy">`)
  : `<img class="${cls}" src="${p.img}" alt="" loading="lazy" style="object-position:${p.crop.x}% ${p.crop.y}%;transform:scale(${p.crop.z});filter:hue-rotate(${p.crop.hue}deg) brightness(${p.crop.br})">`;
const thumb = (p, ix) => `<button class="th" data-pid="${p.id}" data-ix="${ix}" aria-label="Photo by ${PEOPLE[p.by].name}">${imgTag(p)}${p.video || p.isVideo ? `<span class="vd"><svg width="11" height="11" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="#fff"/></svg>${p.video || ''}</span>` : ''}<span class="by" style="--c:${PEOPLE[p.by].c}">${PEOPLE[p.by].ini}</span>${p.fresh ? '<span class="new">New</span>' : ''}<span class="ck"></span></button>`;

/* ── the page ── */
let order = []; // every photo on the page in reading order, for the viewer and range-select
function render() {
  const y = scrollY; order = [];
  const vis = visible(); const byDay = {};
  for (const p of vis) (byDay[p.day] = byDay[p.day] || []).push(p);
  // the sample pass: the Day 7 stop with the most photos
  const d7 = dayById.d07; const d7stops = stopsOf(d7); const best = d7stops.map((s) => [s, vis.filter((p) => p.stop === s.id)]).sort((a, b) => b[1].length - a[1].length)[0];
  const pass = best && best[1].length ? `<p class="sec">On the plan</p>
    <button class="pass press" data-strip="${best[0].id}" style="--c:${kindColor(best[0])};display:block;width:calc(100% - 28px);text-align:left">
      <div class="hero" style="background-image:url('${placeImg(best[0])}')"><div class="t"><small>Day 7 · ${esc(best[0].time)}</small><b>${esc(best[0].title)}</b></div></div>
      <div class="pstrip">${best[1].slice(0, 4).map((p) => `<span class="th">${imgTag(p)}</span>`).join('')}<span class="cnt">📷 ${best[1].length}</span></div></button>
    <p class="passnote">This is how a stop's pass would look on the trip page. Tap it to open that stop's photos.</p>` : '';
  const days = DAYS.filter((d) => byDay[d.id]).map((d) => {
    const ps = byDay[d.id].sort((a, b) => a.takenAt - b.takenAt);
    const stops = stopsOf(d).filter((s) => ps.some((p) => p.stop === s.id));
    const block = (title, small, c, list, sid) => { const start = order.length; order.push(...list);
      return `<div class="stop ${sid ? '' : 'other'}"><div class="sh"><i style="--c:${c}"></i><span><b>${esc(title)}</b> ${small ? `<small>${esc(small)}</small>` : ''}</span><span class="n">${list.length}</span>${sid ? `<a class="plan" href="../?d=${d.id}">Plan ›</a>` : ''}</div>
        <div class="grid">${list.map((p, i) => thumb(p, start + i)).join('')}</div></div>`; };
    const others = ps.filter((p) => !p.stop || !stopsOf(d).some((s) => s.id === p.stop));
    return `<section class="day"><div class="dh"><b>Day ${d.n}</b><small>${fmtDate(d)} · ${esc(d.title)}</small><span class="n">${ps.length}</span></div>
      ${stops.map((s) => block(s.title, s.time, kindColor(s), ps.filter((p) => p.stop === s.id), s.id)).join('')}
      ${others.length ? block('Other moments', 'between stops', '#c9c4b8', others, null) : ''}</section>`;
  }).join('');
  const nHidden = photos.filter((p) => p.hidden).length;
  $('#page').innerHTML = `<div class="bar"><a class="tback press" href="../"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Trip</a><span class="sp"></span><button class="pill press" data-select>Select</button></div>
    <div class="proto"><span><b>Prototype</b> · demo photos, nothing is uploaded or saved</span><span class="seg">${[['member', 'Me'], ['guest', 'Guest']].map(([k, l]) => `<button data-as="${k}" class="${ui.viewer === k ? 'on' : ''}">${l}</button>`).join('')}</span></div>
    <header class="ph"><small>Japan 2026 · photos</small><h1>The trip, in photos</h1><p>Everyone's photos, filed under the stop where they were taken.</p></header>
    <div class="filters"><span class="seg">${[['all', 'Everyone'], ['nasa', 'NASA'], ['mm', 'M&amp;M']].map(([k, l]) => `<button data-couple="${k}" class="${ui.couple === k ? 'on' : ''}">${l}</button>`).join('')}</span><span>${vis.length} photos</span></div>
    ${pass}${days || '<p class="empty">No photos yet.</p>'}
    ${nHidden ? `<div class="hiddenrow"><button class="pill press" data-unhideall>${nHidden} hidden · Show them again</button></div>` : ''}`;
  document.body.classList.toggle('guest', ui.viewer === 'guest');
  for (const id of ui.sel) { const el = document.querySelector(`.th[data-pid="${id}"]`); if (el) el.classList.add('on'); }
  window.scrollTo(0, y);
}

/* ── toast with undo ── */
let undoFn = null, toastT = 0;
function toast(msg, undo) { undoFn = undo || null; $('#toast').innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-undo>Undo</button>' : ''}`; $('#toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('on'), 5000); }
$('#toast').addEventListener('click', (e) => { if (e.target.closest('[data-undo]') && undoFn) { undoFn(); undoFn = null; $('#toast').classList.remove('on'); render(); } });

/* ── select mode: tap, or drag sideways across photos to select a run of them (like the Photos app) ── */
const setSel = (on) => { document.body.classList.toggle('sel', on); if (!on) ui.sel.clear(); render(); updSel(); };
function updSel() { const n = ui.sel.size; $('#seln').textContent = n ? `${n} selected` : 'Tap or drag across photos'; $('#selbar [data-assign]').disabled = !n; $('#selbar [data-hide]').disabled = !n; }
let drag = null;
$('#page').addEventListener('pointerdown', (e) => {
  const th = e.target.closest('.grid .th'); if (!th || !document.body.classList.contains('sel')) return;
  drag = { x: e.clientX, y: e.clientY, start: +th.dataset.ix, mode: null, on: !ui.sel.has(th.dataset.pid), before: new Set(ui.sel), id: e.pointerId };
});
$('#page').addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.mode) { if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; drag.mode = Math.abs(dx) > Math.abs(dy) ? 'select' : 'scroll'; if (drag.mode === 'select') try { $('#page').setPointerCapture(e.pointerId); } catch {} }
  if (drag.mode !== 'select') return;
  const hit = document.elementFromPoint(e.clientX, e.clientY); const th = hit && hit.closest('.grid .th'); if (!th) return;
  const a = Math.min(drag.start, +th.dataset.ix), b = Math.max(drag.start, +th.dataset.ix);
  ui.sel = new Set(drag.before); for (let i = a; i <= b; i++) { const id = order[i].id; if (drag.on) ui.sel.add(id); else ui.sel.delete(id); }
  document.querySelectorAll('.grid .th').forEach((el) => el.classList.toggle('on', ui.sel.has(el.dataset.pid))); updSel();
});
const dragEnd = (e) => { if (!drag) return; const was = drag; drag = null; if (!was.mode) { const id = order[was.start].id; if (ui.sel.has(id)) ui.sel.delete(id); else ui.sel.add(id); document.querySelectorAll('.grid .th').forEach((el) => el.classList.toggle('on', ui.sel.has(el.dataset.pid))); updSel(); } };
$('#page').addEventListener('pointerup', dragEnd); $('#page').addEventListener('pointercancel', () => { drag = null; });

/* ── sheets ── */
const sheet = $('#sheet'), scrim = $('#scrim');
const openSheet = (html) => { sheet.innerHTML = '<div class="grab"></div>' + html; sheet.classList.add('on'); scrim.classList.add('on'); sheet.scrollTop = 0; };
const closeSheet = () => { sheet.classList.remove('on'); scrim.classList.remove('on'); };
scrim.addEventListener('click', closeSheet);
let assignIds = [], assignDay = 'd07';
function openAssign(ids) {
  assignIds = ids; const p0 = photos.find((p) => p.id === ids[0]); assignDay = p0 ? p0.day : 'd07';
  renderAssign();
}
function renderAssign() {
  const d = dayById[assignDay];
  openSheet(`<div class="sh-h"><b>Assign ${assignIds.length} photo${assignIds.length > 1 ? 's' : ''} to…</b><button data-sheetx>Cancel</button></div>
    <div class="daychips" id="daychips">${DAYS.map((x) => `<button data-aday="${x.id}" class="${x.id === assignDay ? 'on' : ''}">Day ${x.n}<small>${esc(x.title)}</small></button>`).join('')}</div>
    <div class="stoplist">${stopsOf(d).map((s) => `<button data-astop="${s.id}" style="--c:${kindColor(s)}"><small>${s.range ? fmtMin(s.range[0]) : esc(s.time || '—')}</small><i></i><b>${esc(s.title)}</b></button>`).join('')}<button data-astop=""><small>—</small><i style="--c:#c9c4b8"></i><b>Other moments (no stop)</b></button></div>`);
  const on = sheet.querySelector('#daychips .on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function assign(ids, day, stop) {
  const prev = ids.map((id) => { const p = photos.find((x) => x.id === id); return [p, p.day, p.stop]; });
  for (const [p] of prev) { p.day = day; p.stop = stop || null; }
  const s = stop ? stopsOf(dayById[day]).find((x) => x.id === stop) : null;
  closeSheet(); if (document.body.classList.contains('sel')) setSel(false); else render();
  if (vw.classList.contains('on')) drawViewer();
  toast(`Moved ${ids.length} to ${s ? s.title : 'Other moments'}`, () => prev.forEach(([p, d0, s0]) => { p.day = d0; p.stop = s0; }));
}
function hide(ids) {
  const ps = ids.map((id) => photos.find((x) => x.id === id)); ps.forEach((p) => (p.hidden = true));
  if (document.body.classList.contains('sel')) setSel(false); else render();
  toast(`Hidden ${ids.length}. Still kept in Drive`, () => ps.forEach((p) => (p.hidden = false)));
}

/* ── upload (mock): real photos from this phone, real taken time and stop matching, fake progress; nothing leaves the phone ── */
function openUpload() {
  openSheet(`<div class="sh-h"><b>Upload photos</b><button data-sheetx>Close</button></div>
    <label class="up-pick press"><input type="file" id="upfiles" multiple accept="image/*,video/*"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="15" rx="3" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10.5" r="1.8" fill="currentColor"/><path d="M5 18l5-5 3 3 3-3 3 3" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><b>Choose photos &amp; videos</b>Each one is filed under the day and stop it was taken at.</label>
    <div id="uplist"></div>
    <p class="honest">Prototype: the photos stay on this phone and disappear when you leave the page. Photos from before the trip are treated as Day 7 (same time of day), so you can see where they'd land.</p>`);
}
async function handleFiles(files) {
  const list = $('#uplist'); const rows = [];
  for (const f of files) {
    const t = await readTaken(f);
    let { day, min } = jstOf(t.takenAt, DAYS); let practice = false;
    if (!day) { day = dayById.d07; practice = true; }
    const m = matchStop(day, min, t.lat, t.lng);
    const p = { id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), day: day.id, stop: m ? m.stop.id : null, takenAt: dayStart(day) + min * 60e3, by: ME, url: URL.createObjectURL(f), isVideo: /^video\//.test(f.type), fresh: true };
    const how = m ? { location: 'by location', time: 'by time', near: 'closest in time' }[m.how] : 'no stop at that time';
    const where = `Day ${day.n} · ${m ? m.stop.title : 'Other moments'}`;
    const src = t.source === 'exif' ? 'photo data' : t.source === 'video' ? 'video data' : 'file date';
    const row = document.createElement('div'); row.className = 'uprow';
    row.innerHTML = `<span class="th">${p.isVideo ? '<video src="' + p.url + '#t=0.1" muted playsinline preload="metadata"></video>' : '<img src="' + p.url + '" alt="">'}</span><div class="m"><b>${esc(f.name)}</b><small>${fmtMin(min)} (${src}${practice ? ', treated as Day 7' : ''}) → <em>${esc(where)}</em> · ${how}</small><div class="prog"><i></i></div></div>`;
    list.appendChild(row); rows.push([row, p, f.size]);
  }
  // fake progress, a bit like the real chunked upload
  for (const [row, p, size] of rows) {
    const bar = row.querySelector('.prog i'); const steps = Math.min(12, 3 + Math.round(size / 2e6));
    for (let i = 1; i <= steps; i++) { await new Promise((r) => setTimeout(r, 90)); bar.style.width = (i / steps) * 100 + '%'; }
    row.classList.add('done'); photos.push(p);
  }
  render(); toast(`Added ${rows.length} to the trip (on this phone only)`);
}
sheet.addEventListener('change', (e) => { if (e.target.id === 'upfiles' && e.target.files.length) handleFiles([...e.target.files]); });
sheet.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  if (t('[data-sheetx]')) return closeSheet();
  const ad = t('[data-aday]'); if (ad) { assignDay = ad.dataset.aday; return renderAssign(); }
  const as = t('[data-astop]'); if (as) return assign(assignIds, assignDay, as.dataset.astop);
});

/* ── full-screen viewer: swipe sideways, swipe down to close, double-tap to zoom ── */
const vw = $('#vw'), track = $('#track');
let vlist = [], vi = 0, zoom = null;
function openViewer(list, i) { vlist = list; vi = i; zoom = null; vw.classList.remove('chrome-off'); vw.classList.add('on'); drawViewer(); history.pushState({ viewer: 1 }, ''); }
function closeViewer(fromPop) { vw.classList.remove('on'); track.innerHTML = ''; if (!fromPop && history.state && history.state.viewer) history.back(); }
addEventListener('popstate', () => { if (vw.classList.contains('on')) closeViewer(true); });
function drawViewer() {
  vlist = vlist.filter((p) => !p.hidden); if (!vlist.length) return closeViewer();
  vi = Math.max(0, Math.min(vi, vlist.length - 1));
  // only the current photo and its neighbours are in the page
  track.innerHTML = [vi - 1, vi, vi + 1].map((k) => { const p = vlist[k]; if (!p) return '<div class="slide"></div>';
    return `<div class="slide"><div class="frame ${p.url ? 'free' : ''}">${p.url && p.isVideo ? `<video src="${p.url}" controls playsinline></video>` : imgTag(p)}${p.video ? '<span class="playbadge"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></span>' : ''}</div></div>`; }).join('');
  setTrack(0, false);
  const p = vlist[vi], s = stopOf(p), d = dayById[p.day], who = PEOPLE[p.by];
  $('#vcount').textContent = `${vi + 1} of ${vlist.length}`;
  const member = ui.viewer === 'member';
  $('#vcap').innerHTML = `<div class="who"><span class="av" style="--c:${who.c}">${who.ini}</span><span><b>${who.name} · ${fmtMin(jstOf(p.takenAt, DAYS).min)}</b><small>Day ${d.n} · ${esc(s ? s.title : 'Other moments')}${p.video ? ' · demo video' : ''}</small></span></div>
    <div class="acts"><a href="../?d=${d.id}">Show on the plan</a>${member ? '<button data-vassign>Move</button><button data-vhide>Hide</button>' : ''}<button data-vdl aria-label="Download"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`;
}
const W = () => innerWidth;
function setTrack(dx, anim) { track.style.transition = anim ? 'transform 300ms cubic-bezier(.23,1,.32,1)' : 'none'; track.style.transform = `translate3d(${-W() + dx}px,0,0)`; }
const frameEl = () => track.children[1] && track.children[1].querySelector('.frame');
let g = null, lastTap = 0;
vw.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.top, .cap, video[controls]')) return;
  g = { x: e.clientX, y: e.clientY, t: Date.now(), mode: null, id: e.pointerId, zx: zoom ? zoom.x : 0, zy: zoom ? zoom.y : 0 };
  try { vw.setPointerCapture(e.pointerId); } catch {}
});
vw.addEventListener('pointermove', (e) => {
  if (!g || e.pointerId !== g.id) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (!g.mode) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; g.mode = zoom ? 'pan' : Math.abs(dx) > Math.abs(dy) ? 'x' : dy > 0 ? 'y' : 'none'; }
  if (g.mode === 'x') { const edge = (vi === 0 && dx > 0) || (vi === vlist.length - 1 && dx < 0); setTrack(edge ? dx / 3 : dx, false); }
  else if (g.mode === 'y') { const f = frameEl(); if (f) { f.style.transition = 'none'; f.style.transform = `translate3d(${dx * 0.4}px,${dy}px,0) scale(${Math.max(0.7, 1 - dy / 1200)})`; } vw.style.background = `rgba(0,0,0,${Math.max(0, 1 - dy / 420)})`; vw.classList.add('chrome-off'); }
  else if (g.mode === 'pan') { zoom.x = g.zx + dx; zoom.y = g.zy + dy; applyZoom(false); }
});
vw.addEventListener('pointerup', (e) => {
  if (!g || e.pointerId !== g.id) return; const was = g; g = null;
  const dx = e.clientX - was.x, dy = e.clientY - was.y, dt = Math.max(1, Date.now() - was.t);
  if (was.mode === 'x') {
    const go = (dx < -W() / 4 || dx / dt < -0.5) && vi < vlist.length - 1 ? 1 : (dx > W() / 4 || dx / dt > 0.5) && vi > 0 ? -1 : 0;
    setTrack(-go * W(), true); if (go) setTimeout(() => { vi += go; drawViewer(); }, 300);
  } else if (was.mode === 'y') {
    const f = frameEl();
    if (dy > 110 || dy / dt > 0.6) { if (f) { f.style.transition = 'transform 220ms ease'; f.style.transform = `translate3d(0,${innerHeight}px,0) scale(.7)`; } setTimeout(() => { vw.style.background = ''; closeViewer(); }, 200); }
    else { if (f) { f.style.transition = 'transform 260ms cubic-bezier(.23,1,.32,1)'; f.style.transform = ''; } vw.style.background = ''; vw.classList.remove('chrome-off'); }
  } else if (!was.mode) {
    // a tap: two quick taps zoom in/out at that spot; one tap shows/hides the caption
    const now = Date.now();
    if (now - lastTap < 300) { lastTap = 0; clearTimeout(tapT); toggleZoom(e.clientX, e.clientY); }
    else { lastTap = now; tapT = setTimeout(() => vw.classList.toggle('chrome-off'), 300); }
  }
});
let tapT = 0;
function toggleZoom(x, y) { if (zoom) { zoom = null; applyZoom(true); return; } zoom = { s: 2.4, x: (innerWidth / 2 - x) * 1.4, y: (innerHeight / 2 - y) * 1.4 }; applyZoom(true); }
function applyZoom(anim) { const f = frameEl(); if (!f) return; f.style.transition = anim ? 'transform 280ms cubic-bezier(.23,1,.32,1)' : 'none'; f.style.transform = zoom ? `translate3d(${zoom.x}px,${zoom.y}px,0) scale(${zoom.s})` : ''; }
addEventListener('keydown', (e) => { if (!vw.classList.contains('on')) return; if (e.key === 'Escape') closeViewer(); if (e.key === 'ArrowRight' && vi < vlist.length - 1) { vi++; drawViewer(); } if (e.key === 'ArrowLeft' && vi > 0) { vi--; drawViewer(); } });
vw.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  if (t('[data-vclose]')) return closeViewer();
  if (t('[data-vassign]')) return openAssign([vlist[vi].id]);
  if (t('[data-vhide]')) { hide([vlist[vi].id]); return drawViewer(); }
  if (t('[data-vdl]')) return toast('Prototype: the real one downloads the original');
});

/* ── page clicks ── */
document.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  if (t('[data-upload]')) return openUpload();
  if (t('[data-select]')) return setSel(true);
  if (t('[data-selx]')) return setSel(false);
  if (t('#selbar [data-assign]')) return openAssign([...ui.sel]);
  if (t('#selbar [data-hide]')) return hide([...ui.sel]);
  const c = t('[data-couple]'); if (c) { ui.couple = c.dataset.couple; return render(); }
  const as = t('[data-as]'); if (as) { ui.viewer = as.dataset.as; if (ui.viewer === 'guest') document.body.classList.remove('sel'); return render(); }
  if (t('[data-unhideall]')) { photos.forEach((p) => (p.hidden = false)); return render(); }
  const st = t('[data-strip]'); if (st) { const list = visible().filter((p) => p.stop === st.dataset.strip).sort((a, b) => a.takenAt - b.takenAt); return openViewer(list, 0); }
  const th = t('.grid .th'); if (th && !document.body.classList.contains('sel')) return openViewer(order, +th.dataset.ix);
});
render();
window.__photos = { get photos() { return photos; }, get order() { return order; }, ui };
</script>
</body>
</html>
