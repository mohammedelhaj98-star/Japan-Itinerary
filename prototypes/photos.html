<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip photos · prototype</title>
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
@font-face { font-family:'Zen Kaku'; font-weight:500; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:700; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format('woff2'); }
:root { --ink:#141412; --ink2:#4b4a45; --ink3:#86847c; --paper:#f6f4ef; --line:rgba(20,20,10,.08); --blue:#1e6bff; --red:#e23b2e; --ok:#2f9e57; --heart:#ff375f; --ease:cubic-bezier(.23,1,.32,1);
  --sans:'Zen Kaku','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif; --strip:50px; --cell:120px; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:var(--sans); font-weight:500; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; line-height:1.45; -webkit-tap-highlight-color:transparent; font-variant-numeric:tabular-nums; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; border:0; background:none; padding:0; }
input { font:inherit; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,p { margin:0; }
.press { transition:transform 160ms var(--ease); } .press:active { transform:scale(.96); }
.page { max-width:520px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 0 130px; }

/* top */
.bar { display:flex; align-items:center; gap:8px; padding:0 14px; }
.tback { display:flex; align-items:center; gap:4px; height:36px; padding:0 14px 0 9px; border-radius:999px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:14.5px; font-weight:700; }
.bar .sp { flex:1; }
.pill { height:36px; padding:0 14px; border-radius:999px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px; }
.proto { margin:12px 14px 0; padding:9px 12px; border-radius:14px; background:#fff4d6; color:#7a5a00; font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.proto b { font-weight:700; }
.proto .seg { margin-left:auto; }
.ph { padding:18px 20px 4px; }
.ph small { font-size:12px; font-weight:700; color:var(--ink3); letter-spacing:.06em; text-transform:uppercase; }
.ph h1 { font-size:32px; letter-spacing:-.035em; line-height:1.05; margin-top:2px; font-weight:700; }
.ph p { font-size:14.5px; color:var(--ink2); margin-top:6px; }
.seg { display:inline-flex; background:rgba(0,0,0,.06); border-radius:999px; padding:3px; }
.seg button { padding:5px 12px; font-size:13px; font-weight:700; color:var(--ink3); border-radius:999px; white-space:nowrap; }
.seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }

/* filters */
.flt { padding:12px 16px 0; display:grid; gap:10px; }
.flt .lbl { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); }
.who-row { display:flex; align-items:center; gap:8px; }
.who-row .ppl { display:flex; gap:6px; }
.pp { display:flex; flex-direction:column; align-items:center; gap:3px; width:52px; font-size:11.5px; font-weight:700; color:var(--ink3); }
.pp i { width:40px; height:40px; border-radius:50%; background:var(--c); color:#fff; font-style:normal; font-size:14px; display:grid; place-items:center; opacity:.45; transition:opacity 160ms, transform 200ms var(--ease), box-shadow 160ms; }
.pp.on i { opacity:1; box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--c); transform:scale(1.04); }
.pp.on { color:var(--ink); }
.who-row .clr { margin-left:auto; font-size:13px; font-weight:700; color:var(--blue); }
.kind-row { display:flex; align-items:center; gap:8px; }
.kind-row .seg { flex:none; }
.kind-row .size { margin-left:auto; height:32px; width:32px; border-radius:10px; background:rgba(0,0,0,.06); display:grid; place-items:center; }
.search { display:flex; align-items:center; gap:8px; height:42px; padding:0 12px; border-radius:14px; background:#fff; box-shadow:0 0 0 1px var(--line); color:var(--ink3); }
.search input { flex:1; border:0; outline:0; background:none; font-size:16px; color:var(--ink); min-width:0; }
.search button { font-size:13px; font-weight:700; color:var(--blue); }
.fsum { font-size:13px; color:var(--ink3); padding:2px 4px 0; }

/* day strip: jump to any day */
.dstrip { position:sticky; top:0; z-index:8; margin-top:12px; height:var(--strip); display:flex; align-items:center; gap:6px; padding:0 14px; overflow-x:auto; scrollbar-width:none; background:rgba(246,244,239,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 1px 0 var(--line); }
.dstrip::-webkit-scrollbar { display:none; }
.dstrip button { flex:none; height:34px; padding:0 11px; border-radius:11px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
.dstrip button small { font-size:11.5px; color:var(--ink3); font-weight:700; }
.dstrip button.on { background:var(--ink); color:#fff; box-shadow:none; }
.dstrip button.on small { color:rgba(255,255,255,.65); }
.dstrip button.none { opacity:.35; }

/* "on the plan" preview */
.sec { padding:22px 20px 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; }
.pass { margin:0 14px; border-radius:22px; overflow:hidden; color:#fff; background:linear-gradient(165deg, color-mix(in srgb, var(--c) 82%, #fff) 0, var(--c) 40%, color-mix(in srgb, var(--c) 80%, #000) 100%); box-shadow:0 14px 30px -18px rgba(0,0,0,.5); }
.pass .hero { height:150px; background-size:cover; background-position:center; position:relative; }
.pass .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.55)); }
.pass .t { position:absolute; left:16px; right:16px; bottom:12px; z-index:1; }
.pass .t small { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.9; }
.pass .t b { display:block; font-size:22px; line-height:1.1; }
.pstrip { display:flex; align-items:center; gap:6px; padding:12px 12px 14px; }
.pstrip .pt { position:relative; width:52px; height:52px; border-radius:12px; overflow:hidden; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.35); }
.pstrip .pt img { width:100%; height:100%; object-fit:cover; display:block; }
.pstrip .cnt { margin-left:auto; height:34px; padding:0 12px; border-radius:999px; background:rgba(255,255,255,.2); font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; }
.passnote { padding:8px 22px 0; font-size:13px; color:var(--ink3); }

/* gallery laid out like the plan */
.day { margin-top:14px; scroll-margin-top:var(--strip); }
.dh { position:sticky; top:var(--strip); z-index:5; padding:8px 16px 8px 20px; background:rgba(246,244,239,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); display:flex; align-items:center; gap:8px; }
.dh .tt { min-width:0; flex:1; display:flex; align-items:baseline; gap:8px; }
.dh b { font-size:20px; letter-spacing:-.02em; white-space:nowrap; }
.dh small { font-size:13px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.relive { flex:none; height:32px; padding:0 12px 0 10px; border-radius:999px; background:var(--ink); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px; }
.stop { padding:10px 14px 0; }
.sh { display:flex; align-items:center; gap:8px; padding:0 6px 7px; }
.sh i { width:9px; height:9px; border-radius:3px; background:var(--c); flex:none; }
.sh b { font-size:15px; line-height:1.2; }
.sh small { font-size:12.5px; color:var(--ink3); white-space:nowrap; }
.sh .n { margin-left:auto; font-size:12.5px; color:var(--ink3); font-weight:700; }
.sh .plan { font-size:12.5px; font-weight:700; color:var(--blue); white-space:nowrap; }
/* mosaic: favourites take a double tile; pinch the grid to change how many fit a row */
.grid { display:grid; grid-template-columns:repeat(var(--cols, 3), 1fr); grid-auto-rows:var(--cell); grid-auto-flow:dense; gap:3px; border-radius:16px; overflow:hidden; touch-action:pan-y; }
.th { position:relative; overflow:hidden; background:#ddd8cc; }
.th.big { grid-column:span 2; grid-row:span 2; }
html.c2 .th.big { grid-column:span 1; grid-row:span 1; } /* two a row: every photo is already big */
.th img, .th video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; }
.th .vd { position:absolute; right:6px; bottom:5px; z-index:1; color:#fff; font-size:11.5px; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.6); display:flex; align-items:center; gap:3px; }
.faces { position:absolute; left:5px; bottom:5px; z-index:1; display:flex; }
.faces i { width:18px; height:18px; border-radius:50%; background:var(--c, #555); color:#fff; font-style:normal; font-size:8.5px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 1.5px #fff; margin-right:-4px; }
.faces i.more { background:#141412; }
.th .hrt { position:absolute; right:6px; top:5px; z-index:1; color:#fff; font-size:13px; text-shadow:0 1px 4px rgba(0,0,0,.5); }
.th .new { position:absolute; left:5px; top:5px; z-index:1; padding:2px 6px; border-radius:6px; background:var(--ok); color:#fff; font-size:10.5px; font-weight:700; }
.th .ck { display:none; position:absolute; right:6px; top:6px; z-index:2; width:22px; height:22px; border-radius:50%; box-shadow:inset 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.4); }
body.sel .th .ck { display:block; }
body.sel .th .hrt { display:none; }
.th.on .ck { background:var(--blue); box-shadow:inset 0 0 0 2px #fff; }
.th.on .ck::after { content:''; position:absolute; left:7px; top:3.5px; width:6px; height:11px; border:solid #fff; border-width:0 2.4px 2.4px 0; transform:rotate(45deg); }
.th.on img, .th.on video { transform:scale(.88); border-radius:6px; transition:transform 160ms var(--ease); }
.th.gone { visibility:hidden; }
.other .sh i { background:#c9c4b8; }
.empty { margin:18px 14px 0; padding:22px; border-radius:16px; border:1.5px dashed rgba(20,20,10,.15); color:var(--ink3); font-size:14px; text-align:center; }
.hiddenrow { margin:26px 14px 0; display:flex; justify-content:center; }

/* select bar */
.selbar { position:fixed; left:0; right:0; bottom:0; z-index:40; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); background:rgba(252,250,246,.96); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 -1px 0 var(--line); display:flex; align-items:center; gap:6px; transform:translateY(110%); transition:transform 280ms var(--ease); }
body.sel .selbar { transform:none; }
.selbar .n { flex:1; font-weight:700; font-size:14.5px; min-width:0; }
.selbar button { height:42px; padding:0 13px; border-radius:14px; background:rgba(0,0,0,.06); font-weight:700; font-size:14px; }
.selbar button.go { background:var(--ink); color:#fff; }
.selbar button:disabled { opacity:.4; }

/* sheets */
.scrim { position:fixed; inset:0; z-index:60; background:rgba(14,12,8,.4); opacity:0; pointer-events:none; transition:opacity 220ms ease; }
.scrim.on { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; max-width:520px; margin:0 auto; max-height:86vh; overflow-y:auto; overscroll-behavior:contain; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); border-radius:28px 28px 0 0; background:#faf8f4; box-shadow:0 -20px 60px -20px rgba(0,0,0,.4); transform:translate3d(0,105%,0); transition:transform 360ms var(--ease); }
.sheet.on { transform:none; }
.grab { width:38px; height:5px; border-radius:3px; background:rgba(0,0,0,.16); margin:0 auto 12px; }
.sh-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.sh-h b { font-size:19px; }
.sh-h button { color:var(--ink3); font-weight:700; }
.daychips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
.daychips::-webkit-scrollbar { display:none; }
.daychips button { flex:none; padding:7px 12px; border-radius:12px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:13px; font-weight:700; text-align:left; line-height:1.15; }
.daychips button small { display:block; font-size:11px; font-weight:500; color:var(--ink3); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.daychips button.on { background:var(--ink); color:#fff; box-shadow:none; }
.daychips button.on small { color:rgba(255,255,255,.7); }
.stoplist { background:#fff; border-radius:18px; box-shadow:0 0 0 1px var(--line); overflow:hidden; }
.stoplist button { display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; text-align:left; border-top:1px solid var(--line); }
.stoplist button:first-child { border-top:0; }
.stoplist button:active { background:#f3f0ea; }
.stoplist i { width:10px; height:10px; border-radius:3px; background:var(--c); flex:none; }
.stoplist small { font-size:12.5px; color:var(--ink3); width:66px; flex:none; }
.stoplist b { font-size:15px; line-height:1.25; }
.tagppl { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
.tagppl button { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 4px; border-radius:18px; background:#fff; box-shadow:0 0 0 1px var(--line); font-weight:700; font-size:14px; }
.tagppl button i { width:46px; height:46px; border-radius:50%; background:var(--c); color:#fff; font-style:normal; display:grid; place-items:center; opacity:.45; }
.tagppl button.all { box-shadow:0 0 0 2px var(--ink); } .tagppl button.all i { opacity:1; }
.tagppl button.some i { opacity:.8; }
.tagppl button small { font-size:11.5px; color:var(--ink3); font-weight:500; }
.up-pick { display:flex; flex-direction:column; align-items:center; gap:6px; padding:22px; border-radius:18px; border:1.5px dashed rgba(20,20,10,.2); text-align:center; color:var(--ink2); font-size:14px; }
.up-pick b { font-size:16px; color:var(--ink); }
.up-pick input { display:none; }
.uprow { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.uprow .pt { position:relative; width:46px; height:46px; border-radius:10px; flex:none; overflow:hidden; background:#ddd8cc; }
.uprow .pt img, .uprow .pt video { width:100%; height:100%; object-fit:cover; display:block; }
.uprow .m { flex:1; min-width:0; }
.uprow .m b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.uprow .m small { display:block; font-size:12.5px; color:var(--ink3); }
.uprow .m small em { font-style:normal; color:var(--ink); font-weight:700; }
.prog { height:4px; border-radius:2px; background:rgba(0,0,0,.08); margin-top:6px; overflow:hidden; }
.prog i { display:block; height:100%; width:0; background:var(--blue); transition:width 200ms linear; }
.uprow.done .prog i { background:var(--ok); }
.honest { font-size:12.5px; color:var(--ink3); margin-top:12px; }

/* full-screen viewer */
.vw { position:fixed; inset:0; z-index:80; background:#000; touch-action:none; visibility:hidden; overflow:hidden; -webkit-user-select:none; user-select:none; }
.vw .info { -webkit-user-select:text; user-select:text; }
.vw.on { visibility:visible; }
.vw .track { position:absolute; inset:0; display:flex; will-change:transform; transition:transform 320ms var(--ease); }
.vw .track.up { transform:translate3d(0,-26vh,0); }
.vw .slide { flex:none; position:relative; width:100vw; height:100%; }
.vw .frame { position:absolute; overflow:hidden; will-change:transform; transform-origin:50% 50%; background:#111; }
.vw .frame img, .vw .frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; }
.vw .frame.real img, .vw .frame.real video { object-fit:contain; }
.vw .playbadge { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:68px; height:68px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center; color:#fff; }
.vw .top { position:absolute; left:0; right:0; top:0; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 14px 14px; color:#fff; background:linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0)); transition:opacity 200ms; }
.vw .top .mid { text-align:center; flex:1; min-width:0; line-height:1.2; }
.vw .top .mid b { display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vw .top .mid small { font-size:12px; opacity:.7; }
.vw .rb { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.14); display:grid; place-items:center; flex:none; color:#fff; }
.vw .rb.hearted { color:var(--heart); }
.vw .cap { position:absolute; left:0; right:0; bottom:0; z-index:3; padding:22px 0 calc(10px + env(safe-area-inset-bottom)); color:#fff; background:linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0)); transition:opacity 200ms, transform 320ms var(--ease); }
.vw .capt { display:flex; align-items:center; gap:10px; padding:0 16px; }
.vw .capt .faces { position:static; margin-right:4px; }
.vw .capt .faces i { width:24px; height:24px; font-size:10px; box-shadow:0 0 0 2px #000; }
.vw .capt b { display:block; font-size:14.5px; }
.vw .capt small { display:block; font-size:12.5px; opacity:.75; }
.vw .capt .up { margin-left:auto; display:flex; flex-direction:column; align-items:center; font-size:11px; font-weight:700; opacity:.8; }
/* filmstrip */
.fs { display:flex; gap:3px; overflow-x:auto; padding:12px 50vw 2px; scrollbar-width:none; scroll-behavior:smooth; }
.fs::-webkit-scrollbar { display:none; }
.fs button { position:relative; flex:none; width:34px; height:46px; border-radius:5px; overflow:hidden; opacity:.55; transition:width 220ms var(--ease), opacity 160ms; }
.fs button img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.fs button.on { width:58px; opacity:1; box-shadow:0 0 0 2px #fff; }
.vw.chrome-off .top, .vw.chrome-off .cap { opacity:0; pointer-events:none; }
.vw.showinfo .cap { transform:translateY(40px); opacity:0; pointer-events:none; }
/* swipe-up info */
.info { position:absolute; left:0; right:0; bottom:0; z-index:4; max-height:62vh; overflow-y:auto; padding:10px 16px calc(18px + env(safe-area-inset-bottom)); border-radius:24px 24px 0 0; background:#1b1a18; color:#fff; transform:translate3d(0,105%,0); transition:transform 320ms var(--ease); }
.vw.showinfo .info { transform:none; }
.info .grab { background:rgba(255,255,255,.25); }
.info h3 { font-size:19px; line-height:1.2; }
.info .meta { font-size:13px; opacity:.7; margin-top:3px; }
.info .desc { font-size:14px; opacity:.85; margin-top:10px; line-height:1.45; }
.info .lbl { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.55; margin:16px 0 8px; }
.info .tagrow { display:flex; gap:8px; }
.info .tagrow button { display:flex; flex-direction:column; align-items:center; gap:4px; width:58px; font-size:12px; font-weight:700; color:rgba(255,255,255,.6); }
.info .tagrow button i { width:42px; height:42px; border-radius:50%; background:var(--c); color:#fff; font-style:normal; display:grid; place-items:center; opacity:.35; transition:opacity 160ms, box-shadow 160ms; }
.info .tagrow button.on { color:#fff; } .info .tagrow button.on i { opacity:1; box-shadow:0 0 0 2px #1b1a18, 0 0 0 4px var(--c); }
.info .tagrow[disabled] button { pointer-events:none; }
.info .vmap { height:150px; border-radius:16px; overflow:hidden; margin-top:4px; background:#2a2926; }
.info .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.info .row a, .info .row button { height:40px; padding:0 14px; border-radius:12px; background:rgba(255,255,255,.12); color:#fff; font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px; }
.info .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px; margin-top:4px; }
.info .kv span:nth-child(odd) { opacity:.55; }
/* the flyer: the photo growing out of / back into its thumbnail */
.flyer { position:fixed; z-index:85; overflow:hidden; pointer-events:none; background:#111; }
.flyer img, .flyer video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.flyer.real img, .flyer.real video { object-fit:contain; }

/* relive the day: a story */
.story { position:fixed; inset:0; z-index:95; background:#000; color:#fff; visibility:hidden; touch-action:none; overflow:hidden; -webkit-user-select:none; user-select:none; }
.story.on { visibility:visible; }
.story .bars { position:absolute; left:10px; right:10px; top:calc(10px + env(safe-area-inset-top)); z-index:3; display:flex; gap:4px; }

<script src="../vendor/leaflet/leaflet.js"></script>
<script type="module">
import { DAYS } from '../data/itinerary.js?v=9';
import { PLACES } from '../data/places.js?v=9';
import { CAT } from '../js/colors.js?v=9';

import { readTaken } from '../js/exif.js?v=9';

/* PROTOTYPE: demo photos only. Nothing is uploaded or saved, and nothing here touches the real trip data. */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s) => document.querySelector(s);
const PEOPLE = { naf: { name: 'Naf', ini: 'N', c: '#2c4f86', couple: 'nasa' }, sara: { name: 'Sara', ini: 'S', c: '#6f4f98', couple: 'nasa' }, mariam: { name: 'Mariam', ini: 'Ma', c: '#cc5a26', couple: 'mm' }, m: { name: 'Mo', ini: 'Mo', c: '#b94b74', couple: 'mm' } };
const PIDS = Object.keys(PEOPLE);
const ME = (() => { try { const v = JSON.parse(localStorage.getItem('trips.me')); return PEOPLE[v] ? v : 'naf'; } catch { return 'naf'; } })();
const JST = 9 * 3600e3;
const dayStart = (d) => Date.parse(d.date + 'T00:00:00Z') - JST;
const dayById = Object.fromEntries(DAYS.map((d) => [d.id, d]));
const fmtDate = (d) => new Date(d.date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const kindColor = (s) => { const k = /dinner|lunch|breakfast|market|ramen|sushi|food|cafe|izakaya|okonomiyaki/i.test(s.title) ? 'food' : /shop|vintage|streetwear|don quijote|mall|arcade|ginza|uniqlo|street/i.test(s.title) ? 'shop' : /train|bus|subway|walk|→|keihan|shinkansen|transfer|taxi/i.test(s.title) ? 'transit' : /hotel|check/i.test(s.title) ? 'hotel' : 'sight'; return CAT[k][0]; };
const placeImg = (s) => (s.place && PLACES[s.place.name] && PLACES[s.place.name].img) ? '../img/places/' + PLACES[s.place.name].img : null;
const stopCache = {}; const stopsOfDay = (id) => (stopCache[id] = stopCache[id] || stopsOf(dayById[id]));
const stopOf = (p) => (p.stop ? stopsOfDay(p.day).find((s) => s.id === p.stop) || null : null);
const faces = (ids) => (ids && ids.length ? `<span class="faces">${ids.slice(0, 3).map((id) => `<i style="--c:${PEOPLE[id].c}">${PEOPLE[id].ini}</i>`).join('')}${ids.length > 3 ? `<i class="more">+${ids.length - 3}</i>` : ''}</span>` : '');
const isVid = (p) => !!(p.video || p.isVideo);

/* ── demo photos: our place pictures, cropped and shaped differently so a stop looks like several shots, on real stops Day 1–9 ── */
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const pick = (a) => a[Math.floor(rnd() * a.length)];
const SHAPES = [0.75, 0.75, 0.75, 1, 1.333, 0.5625]; // mostly portrait phone photos, some square, landscape and tall
let photos = [];
for (const d of DAYS.slice(0, 9)) {
  const stops = stopsOf(d).filter((s) => s.range && placeImg(s) && !/train|bus|subway|→|keihan|shinkansen/i.test(s.title));
  for (const s of stops) {
    const n = 2 + Math.floor(rnd() * 8);
    const who = s.who === 'nasa' ? ['naf', 'sara'] : s.who === 'mm' ? ['mariam', 'm'] : PIDS;
    for (let i = 0; i < n; i++) {
      const min = s.range[0] + Math.floor(rnd() * Math.max(5, s.range[1] - s.range[0]));
      const inPic = rnd() < 0.25 ? [] : who.filter(() => rnd() < 0.5); // who's in it (a quarter are just the place)
      photos.push({ id: 'p' + photos.length, day: d.id, stop: s.id, takenAt: dayStart(d) + min * 60e3, by: pick(who), img: placeImg(s), ar: pick(SHAPES),
        crop: { x: Math.round(rnd() * 100), y: Math.round(rnd() * 100), z: (1 + rnd() * 0.7).toFixed(2), hue: Math.round(rnd() * 16 - 8), br: (0.92 + rnd() * 0.16).toFixed(2) },
        in: inPic, hearts: rnd() < 0.16 ? PIDS.filter(() => rnd() < 0.5).slice(0, 3) : [],
        video: rnd() < 0.08 ? `0:${String(5 + Math.floor(rnd() * 50)).padStart(2, '0')}` : null });
    }
  }
  const imgs = stops.map(placeImg);
  if (imgs.length) for (let i = 0; i < 2; i++) photos.push({ id: 'p' + photos.length, day: d.id, stop: null, takenAt: dayStart(d) + (22 * 60 + Math.floor(rnd() * 80)) * 60e3, by: pick(PIDS), img: pick(imgs), ar: 0.75, crop: { x: Math.round(rnd() * 100), y: 50, z: '1.6', hue: 0, br: '0.8' }, in: PIDS.filter(() => rnd() < 0.6), hearts: [], video: null });
}

/* ── state ── */
const ui = { people: new Set(), kind: 'all', q: '', viewer: 'member', sel: new Set(), cols: 3 };
const member = () => ui.viewer === 'member';
const qOk = (p) => { if (!ui.q) return true; const s = stopOf(p), d = dayById[p.day]; const hay = `${s ? s.title : 'other moments'} ${d.title} day ${d.n}`.toLowerCase(); return ui.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w)); };
const visible = () => photos.filter((p) => !p.hidden
  && (ui.kind === 'all' || (ui.kind === 'video' ? isVid(p) : ui.kind === 'photo' ? !isVid(p) : p.hearts.length))
  && [...ui.people].every((id) => p.in.includes(id)) && qOk(p));
const imgTag = (p) => p.url
  ? (p.isVideo ? `<video src="${p.url}#t=0.1" muted playsinline preload="metadata"></video>` : `<img draggable="false" src="${p.url}" alt="" loading="lazy">`)
  : `<img draggable="false" src="${p.img}" alt="" loading="lazy" style="object-position:${p.crop.x}% ${p.crop.y}%;transform:scale(${p.crop.z});filter:hue-rotate(${p.crop.hue}deg) brightness(${p.crop.br})">`;
const thumb = (p, ix, big) => `<button class="th ${big ? 'big' : ''}" data-pid="${p.id}" data-ix="${ix}" aria-label="Photo">${imgTag(p)}${isVid(p) ? `<span class="vd"><svg width="11" height="11" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="#fff"/></svg>${p.video || ''}</span>` : ''}${faces(p.in)}${p.hearts.length ? '<span class="hrt">♥</span>' : ''}${p.fresh ? '<span class="new">New</span>' : ''}<span class="ck"></span></button>`;

/* ── filters (rendered once; only their state changes) ── */
$('#ppl').innerHTML = PIDS.map((id) => `<button class="pp press" data-pp="${id}" aria-pressed="false"><i style="--c:${PEOPLE[id].c}">${PEOPLE[id].ini}</i>${PEOPLE[id].name}</button>`).join('');
function syncFilters() {
  document.querySelectorAll('[data-pp]').forEach((b) => { const on = ui.people.has(b.dataset.pp); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $('[data-clrppl]').hidden = !ui.people.size;
  document.querySelectorAll('[data-kind]').forEach((b) => b.classList.toggle('on', b.dataset.kind === ui.kind));
  document.querySelectorAll('[data-as]').forEach((b) => b.classList.toggle('on', b.dataset.as === ui.viewer));
  $('[data-clrq]').hidden = !ui.q;
}
const names = (ids) => { const n = ids.map((id) => PEOPLE[id].name); return n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' & ' + n[n.length - 1]; };

/* ── the page ── */
let order = [];
function setCellSize() {
  const gw = Math.min(innerWidth, 520) - 28; const cell = Math.floor((gw - (ui.cols - 1) * 3) / ui.cols);
  const r = document.documentElement; r.style.setProperty('--cols', ui.cols); r.style.setProperty('--cell', cell + 'px'); r.classList.toggle('c2', ui.cols < 3);
}
// change how many photos fit a row, keeping the photo under your fingers (or the top day) in view
function setCols(n, at) {
  if (n === ui.cols) return;
  const el = at && at.closest && at.closest('.th, .stop, .day'); const before = el ? el.getBoundingClientRect().top : null;
  ui.cols = n; setCellSize();
  if (el && el.isConnected) window.scrollBy(0, el.getBoundingClientRect().top - before);
}
function render({ keepDay } = {}) {
  const anchor = keepDay ? currentDay() : null; const y = scrollY;
  order = []; setCellSize();
  const vis = visible(); const byDay = {};
  for (const p of vis) (byDay[p.day] = byDay[p.day] || []).push(p);
  const filtered = ui.people.size || ui.kind !== 'all' || ui.q;
  $('#fsum').textContent = `${vis.length} ${vis.length === 1 ? 'photo' : 'photos'}${ui.people.size ? ` with ${names([...ui.people])}` : ''}${ui.kind === 'video' ? ' (videos)' : ui.kind === 'photo' ? ' (no videos)' : ui.kind === 'fav' ? ' marked ♥' : ''}${ui.q ? ` matching “${ui.q}”` : ''}`;
  // day strip
  const tripDays = DAYS.filter((d) => photos.some((p) => p.day === d.id && !p.hidden));
  $('#dstrip').innerHTML = tripDays.map((d) => `<button data-jump="${d.id}" class="${byDay[d.id] ? '' : 'none'}">Day ${d.n}<small>${(byDay[d.id] || []).length}</small></button>`).join('');
  // the sample pass (only when nothing is filtered, so it's comparable)
  const d7 = stopsOfDay('d07'); const best = d7.map((s) => [s, photos.filter((p) => !p.hidden && p.stop === s.id)]).sort((a, b) => b[1].length - a[1].length)[0];
  const pass = !filtered && best && best[1].length ? `<p class="sec">On the plan</p>
    <button class="pass press" data-strip="${best[0].id}" style="--c:${kindColor(best[0])};display:block;width:calc(100% - 28px);text-align:left">
      <div class="hero" style="background-image:url('${placeImg(best[0])}')"><div class="t"><small>Day 7 · ${esc(best[0].time)}</small><b>${esc(best[0].title)}</b></div></div>
      <div class="pstrip">${best[1].slice(0, 4).map((p) => `<span class="pt">${imgTag(p)}</span>`).join('')}<span class="cnt">📷 ${best[1].length}</span></div></button>
    <p class="passnote">How a stop's pass would look on the trip page. Tap it to open that stop's photos.</p>` : '';
  const days = DAYS.filter((d) => byDay[d.id]).map((d) => {
    const ps = byDay[d.id].sort((a, b) => a.takenAt - b.takenAt);
    const stops = stopsOfDay(d.id).filter((s) => ps.some((p) => p.stop === s.id));
    const block = (title, small, c, list, sid) => {
      const start = order.length; order.push(...list);
      // mosaic: photos two or more of us loved get a double tile; a big stop with no favourites leads with its first photo
      const loved = list.filter((p) => p.hearts.length >= 2); const big = new Set(loved.length ? loved.slice(0, 2).map((p) => p.id) : list.length >= 6 ? [list[0].id] : []);
      return `<div class="stop ${sid ? '' : 'other'}"><div class="sh"><i style="--c:${c}"></i><span><b>${esc(title)}</b> ${small ? `<small>${esc(small)}</small>` : ''}</span><span class="n">${list.length}</span>${sid ? `<a class="plan" href="../?d=${d.id}">Plan ›</a>` : ''}</div>
        <div class="grid">${list.map((p, i) => thumb(p, start + i, big.has(p.id))).join('')}</div></div>`; };
    const others = ps.filter((p) => !stopOf(p));
    return `<section class="day" id="day-${d.id}" data-day="${d.id}"><div class="dh"><span class="tt"><b>Day ${d.n}</b><small>${fmtDate(d)} · ${esc(d.title)}</small></span><button class="relive press" data-relive="${d.id}"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="#fff"/></svg>Relive</button></div>
      ${stops.map((s) => block(s.title, s.time, kindColor(s), ps.filter((p) => p.stop === s.id), s.id)).join('')}
      ${others.length ? block('Other moments', 'between stops', '#c9c4b8', others, null) : ''}</section>`;
  }).join('');
  const nHidden = photos.filter((p) => p.hidden).length;
  $('#content').innerHTML = pass + (days || `<p class="empty">No photos ${ui.people.size ? `with ${names([...ui.people])} ` : ''}${ui.q ? `matching “${esc(ui.q)}” ` : ''}yet.</p>`)
    + (nHidden && member() ? `<div class="hiddenrow"><button class="pill press" data-unhideall>${nHidden} hidden · Show them again</button></div>` : '');
  document.body.classList.toggle('guest', !member());
  for (const id of ui.sel) { const el = document.querySelector(`.th[data-pid="${id}"]`); if (el) el.classList.add('on'); }
  syncFilters();
  if (anchor && document.getElementById('day-' + anchor)) document.getElementById('day-' + anchor).scrollIntoView({ block: 'start' }); else window.scrollTo(0, y);
  markDay();
}
// which day is at the top, highlighted in the strip
function currentDay() { const secs = [...document.querySelectorAll('.day')]; let cur = secs[0]; for (const s of secs) if (s.getBoundingClientRect().top < 120) cur = s; return cur ? cur.dataset.day : null; }
function markDay() {
  const cur = currentDay(); document.querySelectorAll('[data-jump]').forEach((b) => b.classList.toggle('on', b.dataset.jump === cur));
  const on = document.querySelector('[data-jump].on'); if (on) { const st = $('#dstrip'); const want = on.offsetLeft - st.clientWidth / 2 + on.offsetWidth / 2; if (Math.abs(st.scrollLeft - want) > 40) st.scrollTo({ left: want, behavior: 'smooth' }); }
}
let scrollRaf = 0; addEventListener('scroll', () => { if (scrollRaf) return; scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; markDay(); }); }, { passive: true });
addEventListener('resize', () => { setCellSize(); });

/* ── pinch the grid to change the size (2 to 6 a row), like the Photos app ── */
let gp = null;
document.addEventListener('touchstart', (e) => { if (e.touches.length !== 2 || vw.classList.contains('on') || story.classList.contains('on') || !e.target.closest('#content')) return; const [a, b] = e.touches; gp = { d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), c0: ui.cols, at: document.elementFromPoint((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2) }; }, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!gp || e.touches.length !== 2) return; e.preventDefault();
  const [a, b] = e.touches; const r = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / gp.d0;
  setCols(Math.max(2, Math.min(6, Math.round(gp.c0 / r))), gp.at);
}, { passive: false });
document.addEventListener('touchend', (e) => { if (gp && e.touches.length < 2) { gp = null; toast(`${ui.cols} photos a row`); } });
document.addEventListener('gesturestart', (e) => { if (e.target.closest && e.target.closest('#content')) e.preventDefault(); }); // iOS: no page zoom while pinching the grid

/* ── toast with undo ── */
let undoFn = null, toastT = 0;

    if (dy > 110 || dy / dt > 0.6) { const r = f ? rectOf(f) : null; if (f) f.style.visibility = 'hidden'; closeViewer(false, r); }
    else { if (f) { f.style.transition = 'transform 260ms cubic-bezier(.23,1,.32,1)'; f.style.transform = ''; } vw.style.background = ''; vw.classList.remove('chrome-off'); }
  } else if (was.mode === 'up') { setInfo(dy < -50 || dy / dt < -0.4); setTrack(0, true); }
  else if (was.mode === 'infodown') { if (dy > 40) setInfo(false); setTrack(0, true); }
  else if (!was.mode) {
    const now = Date.now();
    if (vw.classList.contains('showinfo')) { setInfo(false); setTrack(0, true); return; }
    if (now - lastTap < 300) { lastTap = 0; clearTimeout(tapT); if (zoom) { zoom = null; applyZoom(true); } else { zoom = { s: 2.5, x: (innerWidth / 2 - e.clientX) * 1.5, y: (innerHeight / 2 - e.clientY) * 1.5 }; applyZoom(true); } }
    else { lastTap = now; tapT = setTimeout(() => vw.classList.toggle('chrome-off'), 300); }
  }
};
vw.addEventListener('pointerup', endPtr); vw.addEventListener('pointercancel', endPtr);
// the info panel itself: swipe it down to close
let ig = null;
$('#vinfo').addEventListener('pointerdown', (e) => { if ($('#vinfo').scrollTop > 0) return; ig = { y: e.clientY }; });
$('#vinfo').addEventListener('pointerup', (e) => { if (ig && e.clientY - ig.y > 50) { setInfo(false); setTrack(0, true); } ig = null; });
addEventListener('keydown', (e) => { if (!vw.classList.contains('on')) return; if (e.key === 'Escape') closeViewer(); if (e.key === 'ArrowRight' && vi < vlist.length - 1) { vi++; drawViewer(); } if (e.key === 'ArrowLeft' && vi > 0) { vi--; drawViewer(); } if (e.key === 'ArrowUp') { setInfo(true); setTrack(0, true); } if (e.key === 'ArrowDown') { setInfo(false); setTrack(0, true); } });
vw.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  if (t('[data-vclose]')) return closeViewer();
  if (t('[data-heart]')) { if (!member()) return; const p = vlist[vi]; const had = p.hearts.includes(ME); p.hearts = had ? p.hearts.filter((x) => x !== ME) : [...p.hearts, ME]; if (!had) $('[data-heart]').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'cubic-bezier(.23,1,.32,1)' }); drawViewer(); render(); return; }
  const fsb = t('[data-fs]'); if (fsb) { vi = +fsb.dataset.fs; return drawViewer(); }
  if (t('.capt')) { setInfo(true); setTrack(0, true); return; }
  const vt = t('[data-vtag]'); if (vt && member()) { const p = vlist[vi], id = vt.dataset.vtag; p.in = p.in.includes(id) ? p.in.filter((x) => x !== id) : PIDS.filter((x) => x === id || p.in.includes(x)); drawViewer(); render(); return; }
  if (t('[data-vassign]')) return openAssign([vlist[vi].id]);
  if (t('[data-vhide]')) { hide([vlist[vi].id]); return drawViewer(); }
});

/* ═══ relive the day: an auto-playing story, stop by stop ═══ */
const story = $('#story');
let sItems = [], sGroups = [], sk = 0, sT0 = 0, sRaf = 0, sPaused = false, sElapsed = 0, sDay = null;
const DUR = { card: 2200, photo: 3000, end: 6000 };
function openStory(dayId) {
  const d = dayById[dayId]; sDay = d;
  const ps = visible().filter((p) => p.day === dayId).sort((a, b) => a.takenAt - b.takenAt);
  if (!ps.length) return toast('No photos to relive here');
  sItems = []; sGroups = [];
  const g0 = { start: 0 }; sItems.push({ kind: 'card', c: '#141412', small: `Day ${d.n} · ${fmtDate(d)}`, h: d.title, p: `${ps.length} photos${ui.people.size ? ` with ${names([...ui.people])}` : ''}` }); g0.end = 1; sGroups.push(g0);
  const stops = stopsOfDay(dayId).filter((s) => ps.some((p) => p.stop === s.id));
  const block = (title, small, c, list) => { const g = { start: sItems.length }; sItems.push({ kind: 'card', c, small, h: title, p: `${list.length} photo${list.length > 1 ? 's' : ''}` });
    // favourites first, then the rest in time order, up to 7 per stop so the story keeps moving
    const pick7 = [...list].sort((a, b) => b.hearts.length - a.hearts.length || a.takenAt - b.takenAt).slice(0, 7).sort((a, b) => a.takenAt - b.takenAt);
    pick7.forEach((p) => sItems.push({ kind: 'photo', p })); g.end = sItems.length; sGroups.push(g); };
  for (const s of stops) block(s.title, s.time, kindColor(s), ps.filter((p) => p.stop === s.id));
  const others = ps.filter((p) => !stopOf(p)); if (others.length) block('Other moments', 'between stops', '#55534d', others);
  const next = DAYS[DAYS.indexOf(d) + 1]; const hasNext = next && visible().some((p) => p.day === next.id);
  sItems.push({ kind: 'end', c: '#141412', small: 'That was', h: `Day ${d.n}`, p: `${ps.length} photos · ${stops.length} stops`, next: hasNext ? next : null });
  sGroups.push({ start: sItems.length - 1, end: sItems.length });
  $('#sbars').innerHTML = sGroups.map(() => '<i><b></b></i>').join('');
  $('#shead').innerHTML = `<span><b>Relive Day ${d.n}</b><small>${esc(d.title)}</small></span><button class="rb" data-sclose aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>`;
  $('#stage').innerHTML = ''; story.classList.add('on'); story.classList.remove('paused'); sPaused = false;
  showItem(0); history.pushState({ story: 1 }, '');
}
const itemDur = (it) => DUR[it.kind];
function itemHtml(it) {
  if (it.kind === 'photo') { const p = it.p; return `<div class="it" style="--dur:${DUR.photo + 600}ms">${p.url ? (p.isVideo ? `<video src="${p.url}" autoplay muted playsinline></video>` : `<img draggable="false" src="${p.url}" alt="">`) : `<img draggable="false" src="${p.img}" alt="" style="object-position:${p.crop.x}% ${p.crop.y}%;filter:hue-rotate(${p.crop.hue}deg) brightness(${p.crop.br})">`}<div class="cap2">${faces(p.in)}<span>${fmtMin(jstOf(p.takenAt, DAYS).min)}${p.hearts.length ? ' · ♥' : ''}</span></div></div>`; }
  return `<div class="it"><div class="card2" style="--c:${it.c}"><small>${esc(it.small)}</small><h2>${esc(it.h)}</h2><p>${esc(it.p)}</p>${it.kind === 'end' && it.next ? `<button class="go" data-snext="${it.next.id}">Next: Day ${it.next.n} ▶</button>` : it.kind === 'end' ? '<button class="go" data-sclose>Back to the photos</button>' : ''}</div></div>`;
}
function showItem(k) {
  sk = Math.max(0, Math.min(k, sItems.length - 1)); sElapsed = 0; sT0 = performance.now();
  const stage = $('#stage'); const el = document.createElement('div'); el.innerHTML = itemHtml(sItems[sk]); const it = el.firstChild; stage.appendChild(it);
  requestAnimationFrame(() => it.classList.add('on'));
  [...stage.children].slice(0, -1).forEach((old) => { old.classList.remove('on'); setTimeout(() => old.remove(), 450); });
  // preload the next photo
  const nx = sItems[sk + 1]; if (nx && nx.kind === 'photo' && nx.p.img) { const im = new Image(); im.src = nx.p.img; }
  cancelAnimationFrame(sRaf); sRaf = requestAnimationFrame(tick);
}
function tick(now) {
  if (!story.classList.contains('on')) return;
  const it = sItems[sk]; const el = sPaused ? sElapsed : sElapsed + (now - sT0);
  if (!sPaused) { sElapsed = el; sT0 = now; }
  const gi = sGroups.findIndex((g) => sk >= g.start && sk < g.end);
  $('#sbars').querySelectorAll('b').forEach((b, k) => { let f = 0; if (k < gi) f = 1; else if (k === gi) { const g = sGroups[k]; f = (sk - g.start + Math.min(1, el / itemDur(it))) / (g.end - g.start); } b.style.width = f * 100 + '%'; });
  if (el >= itemDur(it)) { if (it.kind === 'end') { sPaused = true; } else return showItem(sk + 1); }
  sRaf = requestAnimationFrame(tick);
}
function closeStory(fromPop) { story.classList.remove('on'); cancelAnimationFrame(sRaf); $('#stage').innerHTML = ''; if (!fromPop && history.state && history.state.story) history.back(); }
addEventListener('popstate', () => { if (story.classList.contains('on')) closeStory(true); });
// tap the right side for next, the left for back; hold to pause; swipe down to close
let sp = null;
story.addEventListener('pointerdown', (e) => { if (e.target.closest('[data-sclose], [data-snext]')) return; sp = { x: e.clientX, y: e.clientY, t: Date.now(), hold: setTimeout(() => { sPaused = true; story.classList.add('paused'); }, 220) }; });
story.addEventListener('pointermove', (e) => { if (sp && (Math.abs(e.clientX - sp.x) > 12 || Math.abs(e.clientY - sp.y) > 12)) clearTimeout(sp.hold); }); // moving is a swipe, not a hold
story.addEventListener('pointerup', (e) => {
  if (!sp) return; const was = sp; sp = null; clearTimeout(was.hold);
  const dy = e.clientY - was.y, held = story.classList.contains('paused') && sItems[sk].kind !== 'end';
  if (dy > 90) return closeStory();
  if (held) { sPaused = false; story.classList.remove('paused'); sT0 = performance.now(); return; }
  if (Math.abs(e.clientX - was.x) > 30 || Math.abs(dy) > 30) return;
  if (e.clientX < innerWidth * 0.33) showItem(sk - 1); else if (sk < sItems.length - 1) { sPaused = false; showItem(sk + 1); }
});
story.addEventListener('click', (e) => { if (e.target.closest('[data-sclose]')) return closeStory(); const n = e.target.closest('[data-snext]'); if (n) { closeStory(true); history.replaceState(null, ''); openStory(n.dataset.snext); } });
addEventListener('keydown', (e) => { if (!story.classList.contains('on')) return; if (e.key === 'Escape') closeStory(); if (e.key === 'ArrowRight') showItem(sk + 1); if (e.key === 'ArrowLeft') showItem(sk - 1); if (e.key === ' ') { sPaused = !sPaused; story.classList.toggle('paused', sPaused); sT0 = performance.now(); } });

/* ── page clicks ── */
document.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  if (e.target.closest('#vw, #story, #sheet')) return;
  if (t('[data-upload]')) return openUpload();
  if (t('[data-select]')) return setSel(true);
  if (t('[data-selx]')) return setSel(false);
  if (t('#selbar [data-assign]')) return openAssign([...ui.sel]);
  if (t('#selbar [data-tag]')) return openTag([...ui.sel]);
  if (t('#selbar [data-hide]')) return hide([...ui.sel]);
  const pp = t('[data-pp]'); if (pp) { const id = pp.dataset.pp; if (ui.people.has(id)) ui.people.delete(id); else ui.people.add(id); return render(); }
  if (t('[data-clrppl]')) { ui.people.clear(); return render(); }
  const k = t('[data-kind]'); if (k) { ui.kind = k.dataset.kind; return render(); }
  if (t('[data-size]')) { setCols(ui.cols === 3 ? 5 : ui.cols === 5 ? 2 : 3, document.elementFromPoint(innerWidth / 2, innerHeight / 2)); return toast(`${ui.cols} photos a row`); }
  if (t('[data-clrq]')) { ui.q = ''; $('#q').value = ''; return render(); }
  const as = t('[data-as]'); if (as) { ui.viewer = as.dataset.as; if (!member()) document.body.classList.remove('sel'); return render(); }
  const j = t('[data-jump]'); if (j) { const el = document.getElementById('day-' + j.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const rl = t('[data-relive]'); if (rl) return openStory(rl.dataset.relive);
  if (t('[data-unhideall]')) { photos.forEach((p) => (p.hidden = false)); return render(); }
  const st = t('[data-strip]'); if (st) { const list = visible().filter((p) => p.stop === st.dataset.strip).sort((a, b) => a.takenAt - b.takenAt); return openViewer(list, 0, st.querySelector('.pt')); }
  const th = t('.grid .th'); if (th && !document.body.classList.contains('sel')) return openViewer(order, +th.dataset.ix, th);
});
let qT = 0; $('#q').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { ui.q = e.target.value.trim(); render(); }, 160); });
render();
window.__photos = { get photos() { return photos; }, get order() { return order; }, ui, openStory };
</script>
