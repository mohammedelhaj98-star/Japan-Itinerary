<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Trip tools</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Zen+Old+Mincho:wght@700&display=swap">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
@font-face { font-family:'Zen Kaku'; font-weight:400; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:500; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:700; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format('woff2'); }
:root { --ink:#141412; --ink2:#4b4a45; --ink3:#86847c; --paper:#f6f4ef; --line:rgba(20,20,10,.08); --blue:#1e6bff; --red:#e23b2e; --ok:#2f9e57; --ease:cubic-bezier(.23,1,.32,1);
  --serif:'Instrument Serif','Times New Roman',serif; --mincho:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif; --sans:'Zen Kaku','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif; --top:calc(58px + env(safe-area-inset-top)); }
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:var(--sans); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent; font-variant-numeric:tabular-nums; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; border:0; background:none; padding:0; }
h1,h2,h3,p { margin:0; }
a { color:inherit; }
svg { display:inline-block; vertical-align:middle; fill:none; }
.press { transition:transform 160ms var(--ease); } .press:active { transform:scale(.96); }
.page { max-width:460px; margin:0 auto; padding:var(--top) 0 120px; min-height:100dvh; }
.ph { padding:0 20px 14px; }
.ph small { font-size:12px; font-weight:700; color:var(--ink3); letter-spacing:.06em; text-transform:uppercase; }
.ph h1 { font-size:32px; letter-spacing:-.035em; line-height:1.05; margin-top:2px; }
.ph p { font-size:14.5px; color:var(--ink2); margin-top:6px; }
.card { background:#fff; border-radius:22px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 26px -18px rgba(0,0,0,.3); }
.sec { padding:22px 20px 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
.sec button { font-size:12.5px; letter-spacing:0; text-transform:none; color:var(--blue); }
.seg { display:inline-flex; background:rgba(0,0,0,.05); border-radius:999px; padding:3px; position:relative; flex:none; }
.seg button { position:relative; z-index:1; padding:5px 11px; font-size:12.5px; font-weight:700; color:var(--ink3); border-radius:999px; transition:color 160ms; }
.seg button.on { color:var(--ink); }
.seg i { position:absolute; top:3px; bottom:3px; left:0; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); transition:transform 260ms var(--ease), width 260ms var(--ease); }
.av { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:13px; font-weight:700; flex:none; background:var(--c); }
.av.sm { width:24px; height:24px; font-size:10.5px; }
.demo { margin:0 12px 6px; padding:10px 14px; border-radius:14px; background:#fff6dd; color:#7a5a00; font-size:13px; display:flex; gap:10px; align-items:center; justify-content:space-between; }
.demo button { font-weight:700; color:#7a5a00; text-decoration:underline; }

/* ── expenses ── */
.tot { margin:0 12px; padding:18px 18px 16px; }
.tot-r { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.tot small { font-size:12px; font-weight:700; color:var(--ink3); }
.tot b.big { display:block; font-family:var(--serif); font-size:46px; font-weight:400; line-height:1; letter-spacing:-.02em; margin-top:4px; }
.tot .sub { font-size:14px; color:var(--ink2); margin-top:4px; }
.bars { display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:14px; background:var(--paper); }
.bars i { display:block; height:100%; background:var(--c); }
.legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; font-size:12px; color:var(--ink2); }
.legend span { display:inline-flex; align-items:center; gap:5px; }
.legend span::before { content:''; width:8px; height:8px; border-radius:2px; background:var(--c); }
.bal { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 12px; }
.bal .card { padding:12px 14px; display:flex; gap:10px; align-items:center; }
.bal .card b { display:block; font-size:15px; }
.bal .card small { display:block; font-size:12.5px; font-weight:700; }
.pos { color:var(--ok); } .neg { color:#c62d22; } .zero { color:var(--ink3); }
.settle { margin:0 12px; padding:6px 0; }
.tr { display:flex; align-items:center; gap:10px; padding:12px 16px; }
.tr + .tr { border-top:1px solid var(--line); }
.tr .arr { color:var(--ink3); }
.tr .who { flex:1; min-width:0; font-size:14.5px; line-height:1.3; }
.tr .who b { font-weight:700; }
.tr .amt { text-align:right; }
.tr .amt b { display:block; font-family:var(--serif); font-size:24px; font-weight:400; line-height:1; }
.tr .amt small { font-size:12px; color:var(--ink3); }
.tr .done { font-size:12.5px; font-weight:700; color:var(--blue); padding:6px 0 6px 8px; }
.even { padding:16px; text-align:center; font-size:14.5px; color:var(--ink2); }
.xlist { margin:0 12px; overflow:hidden; }
.xday { padding:10px 16px 4px; font-size:12px; font-weight:700; color:var(--ink3); background:#fbfaf7; border-top:1px solid var(--line); }
.xday:first-child { border-top:0; }
.xrow { display:flex; align-items:center; gap:12px; width:100%; padding:11px 16px; text-align:left; border-top:1px solid var(--line); }
.xday + .xrow { border-top:0; }
.xrow .ic { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 14%, #fff); color:var(--c); flex:none; font-size:16px; }
.xrow .m { flex:1; min-width:0; }
.xrow .m b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.xrow .m small { display:block; font-size:12.5px; color:var(--ink3); }
.xrow .r { text-align:right; }
.xrow .r b { display:block; font-size:15px; }
.xrow .r small { display:block; font-size:12px; color:var(--ink3); }
.xrow.settle-row .m b { color:var(--ok); }
.fab[hidden] { display:none; }
.fab { position:fixed; right:max(16px, calc(50% - 214px)); bottom:calc(80px + env(safe-area-inset-bottom)); z-index:600; height:56px; padding:0 22px 0 18px; border-radius:28px; background:var(--ink); color:#fff; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; box-shadow:0 14px 30px -10px rgba(0,0,0,.5); }

/* sheet */
.scrim { position:fixed; inset:0; z-index:900; background:rgba(20,16,10,.3); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 240ms ease; }
.scrim.on { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:950; max-width:460px; margin:0 auto; border-radius:30px 30px 0 0; background:rgba(250,248,244,.97); -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); padding:10px 16px calc(18px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; transform:translate3d(0,105%,0); transition:transform 380ms var(--ease); box-shadow:0 -20px 60px -20px rgba(0,0,0,.4); overscroll-behavior:contain; }
.sheet.on { transform:none; }
.grab { width:38px; height:5px; border-radius:3px; background:rgba(0,0,0,.16); margin:0 auto 12px; }
.sh-h { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.sh-h b { font-size:19px; letter-spacing:-.02em; }
.sh-h button { font-size:14.5px; font-weight:700; color:var(--ink3); }
.fld { display:block; margin-bottom:14px; }
.fld > span { display:block; font-size:12px; font-weight:700; color:var(--ink3); margin:0 2px 6px; }
.fld input { width:100%; font:500 16px var(--sans); color:var(--ink); background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:14px; padding:12px 14px; outline:none; -webkit-appearance:none; appearance:none; }
.fld input:focus { border-color:var(--ink); }
.amt-in { display:flex; gap:8px; align-items:stretch; }
.amt-in input { font-family:var(--serif); font-size:34px; font-weight:400; padding:6px 14px; }
.ppl { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.ppl button { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px; border-radius:16px; background:#fff; border:1.5px solid transparent; font-size:12.5px; font-weight:700; transition:border-color 160ms, background 160ms, opacity 160ms; }
.ppl button.on { border-color:var(--ink); }
.ppl.multi button:not(.on) { opacity:.45; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips button { padding:8px 12px; border-radius:12px; background:#fff; font-size:13.5px; font-weight:700; border:1px solid rgba(0,0,0,.06); transition:background 160ms, color 160ms; }
.chips button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.preview { font-size:13.5px; color:var(--ink2); background:#fff; border-radius:14px; padding:10px 12px; margin-bottom:14px; }
.save { width:100%; height:52px; border-radius:16px; background:var(--ink); color:#fff; font-size:16px; font-weight:700; }
.save:disabled { opacity:.35; }
.del { width:100%; height:46px; border-radius:14px; background:#fff; color:#c62d22; font-weight:700; margin-top:8px; }

/* ── taxi cards ── */
.hlist { display:grid; gap:10px; margin:0 12px; }
.hcard { position:relative; height:150px; border-radius:22px; overflow:hidden; background:center/cover no-repeat #555; color:#fff; display:flex; align-items:flex-end; text-align:left; width:100%; }
.hcard::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.05) 20%, rgba(0,0,0,.72)); }
.hcard > div { position:relative; z-index:1; padding:14px 16px; width:100%; }
.hcard small { font-size:12px; font-weight:700; opacity:.85; }
.hcard b { display:block; font-size:19px; letter-spacing:-.02em; line-height:1.15; }
.hcard .jp { font-family:var(--mincho); font-size:14px; opacity:.9; margin-top:2px; display:block; }
.tonight { position:absolute; top:12px; left:12px; z-index:2; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 9px; border-radius:999px; background:var(--red); color:#fff; }
.driver { position:fixed; inset:0; z-index:1000; background:#fbf8f1; display:flex; flex-direction:column; padding:calc(70px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); opacity:0; transform:scale(.97); pointer-events:none; transition:opacity 220ms ease, transform 280ms var(--ease); overflow-y:auto; }
.driver.on { opacity:1; transform:none; pointer-events:auto; }
.driver .x { position:absolute; top:var(--top); right:14px; width:48px; height:48px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 2px 10px rgba(0,0,0,.12); }
.driver .lbl { font-size:12px; font-weight:700; color:var(--ink3); letter-spacing:.05em; text-transform:uppercase; }
.driver .say { font-family:var(--mincho); font-size:26px; line-height:1.35; margin-top:6px; }
.driver .sayr { font-size:14.5px; color:var(--ink2); margin-top:2px; }
.driver .name { font-family:var(--mincho); font-size:min(10vw,46px); line-height:1.25; margin-top:26px; word-break:normal; overflow-wrap:anywhere; }
.driver .addr { font-family:var(--mincho); font-size:22px; line-height:1.45; margin-top:14px; }
.driver .en { font-size:15px; color:var(--ink2); margin-top:16px; }
.driver .warn { margin-top:14px; font-size:13.5px; color:#7a5a00; background:#fff6dd; border-radius:12px; padding:10px 12px; }
.driver .warn input { width:100%; margin-top:8px; font:500 16px var(--sans); border:1px solid rgba(0,0,0,.1); border-radius:10px; padding:10px 12px; }
.driver .acts { display:flex; gap:8px; margin-top:auto; padding-top:24px; }
.driver .acts a, .driver .acts button { flex:1; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:700; text-decoration:none; background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.driver .acts a.pri { background:var(--ink); color:#fff; }

/* ── food nearby ── */
.where { margin:0 12px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
.where-r { display:flex; align-items:center; gap:8px; }
.where-r select { flex:1; min-width:0; font:600 15px var(--sans); border:1px solid rgba(0,0,0,.08); background:#fff; border-radius:12px; padding:10px 12px; color:var(--ink); -webkit-appearance:none; appearance:none; }
.here { flex:none; height:42px; padding:0 14px; border-radius:12px; background:var(--blue); color:#fff; font-weight:700; font-size:14px; display:inline-flex; gap:6px; align-items:center; }
.fmap { height:230px; margin:10px 12px 0; border-radius:22px; overflow:hidden; background:#e9e6df; }
.fmap .leaflet-tile-pane { filter:saturate(.5) contrast(.92) brightness(1.06) sepia(.08); }
.fpin { width:26px; height:26px; border-radius:50%; background:#fff; border:2.5px solid var(--c); display:grid; place-items:center; font:700 11px var(--sans); box-shadow:0 3px 8px -2px rgba(0,0,0,.35); }
.fpin.me { background:var(--blue); border-color:#fff; width:18px; height:18px; box-shadow:0 0 0 6px rgba(30,107,255,.2); }
.fpin.sel { transform:scale(1.3); }
.leaflet-div-icon { background:transparent; border:0; }
.fl { margin:0 12px; overflow:hidden; }
.frow { display:flex; gap:12px; padding:12px 16px; width:100%; text-align:left; align-items:flex-start; }
.frow + .frow { border-top:1px solid var(--line); }
.frow .n { width:26px; height:26px; border-radius:50%; border:2.5px solid var(--c); display:grid; place-items:center; font-size:11px; font-weight:700; flex:none; margin-top:2px; }
.frow .m { flex:1; min-width:0; }
.frow .m b { display:block; font-size:15.5px; line-height:1.3; }
.frow .m .jp { font-family:var(--mincho); font-size:13px; color:var(--ink2); }
.frow .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
.tag { font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--paper); color:var(--ink2); }
.tag.halal { background:#e3f4e8; color:#1f7a3f; } .tag.pork { background:#fbe3e0; color:#b3261e; } .tag.pork2 { background:#fdeee0; color:#a14e10; } .tag.ok { background:#eef1f4; color:#3f4a55; } .tag.likely { background:#fff3d6; color:#8a5a00; } .tag.veg { background:#e9f3dc; color:#3f6a12; } .tag.fish { background:#e3eefc; color:#1e4fc2; }
.frow .info { font-size:12.5px; color:var(--ink3); margin-top:4px; }
.frow .go { flex:none; font-size:13px; font-weight:700; color:var(--blue); padding-top:4px; text-align:right; white-space:nowrap; }
.empty { padding:18px 16px; font-size:14px; color:var(--ink2); text-align:center; }
.honest { margin:10px 12px 0; font-size:12.5px; color:var(--ink3); padding:0 6px; }
.porkcard { margin:10px 12px 0; padding:14px 16px; display:flex; align-items:center; gap:12px; width:calc(100% - 24px); text-align:left; }
.porkcard b { display:block; font-family:var(--mincho); font-size:17px; line-height:1.35; }
.porkcard small { display:block; font-size:12.5px; color:var(--ink3); margin-top:2px; }

.tback { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:max(12px, calc(50% - 218px)); z-index:820; display:flex; align-items:center; gap:4px; height:36px; padding:0 14px 0 9px; border-radius:999px; background:rgba(252,250,246,.9); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); color:#141412; font-size:14px; font-weight:700; text-decoration:none; box-shadow:0 6px 18px -8px rgba(0,0,0,.3), 0 0 0 1px rgba(20,20,10,.08); }
/* picker */
.proto-picker { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:800; display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(10,10,10,.82); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; line-height:1; }
.proto-picker-highlight { position:absolute; top:4px; left:0; height:28px; border-radius:999px; background:rgba(255,255,255,.14); }
.proto-picker[data-ready] .proto-picker-highlight { transition:transform 250ms var(--ease), width 250ms var(--ease); }
.proto-picker-item { position:relative; white-space:nowrap; height:28px; padding:0 13px; border-radius:999px; color:rgba(255,255,255,.55); }
.proto-picker-item[data-active] { color:#fff; }
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { transition-duration:1ms !important; animation-duration:1ms !important; } }
</style>
</head>
<body>
<a class="tback press" href="../" onclick="if (document.referrer.startsWith(location.origin) &amp;&amp; history.length &gt; 1) { event.preventDefault(); history.back(); }" aria-label="Back to the trip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Trip</a>
<main class="page" id="page"></main>
<button class="fab press" id="fab" hidden><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Add expense</button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Expense"></section>
<div class="driver" id="driver" role="dialog" aria-label="Taxi card"></div>

  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Expenses</button>
  <button class="proto-picker-item">Taxi cards</button>
  <button class="proto-picker-item">Food nearby</button>
</nav>
<script src="../vendor/leaflet/leaflet.js"></script>
<script type="module">
import { DAYS, HOTELS } from '../data/itinerary.js';
import { FOOD } from '../data/guide.js';
import { PLACES } from '../data/places.js';
import { DIET } from '../data/diet.js';
import { HOTEL_JA } from '../data/hotels-ja.js';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k, f) { try { const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch { return f; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const X = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const ARROW = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LOC = '<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function moveSeg(seg) { if (!seg) return; const on = seg.querySelector('button.on'), i = seg.querySelector('i'); if (!on || !i) return; i.style.width = on.offsetWidth + 'px'; i.style.transform = `translateX(${on.offsetLeft}px)`; }

/* currency: same rates as the main app (8 Oct 2026, yen per unit) */
const RATE = { JPY: 1, CAD: 110.94, QAR: 43.44, USD: 158.1 };
const SYM = { JPY: '¥', CAD: 'C$', QAR: 'QAR ', USD: '$' };
const fmtY = (y) => '¥' + Math.round(y).toLocaleString('en-GB');
const fmtC = (y, c) => { const v = y / RATE[c]; const d = v >= 100 ? 0 : 2; return SYM[c] + v.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d }); };

/* ═══════════ 1 · EXPENSES ═══════════ */
const PEOPLE = [
  { id: 'naf', name: 'Naf', ini: 'N', c: '#2c4f86', couple: 'nasa' }, { id: 'sara', name: 'Sara', ini: 'S', c: '#6f4f98', couple: 'nasa' },

    <div class="card where"><div class="where-r"><select id="f-where" aria-label="Search around">${fd.here ? '<option selected>My location</option>' : ''}${SPOTS.map((s) => `<option ${!fd.here && s.name === fd.where ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select><button class="here press" data-here>${LOC}Near me</button></div>
      <div class="chips">${Object.entries(KIND).map(([k, [l]]) => `<button data-show="${k}" class="${fd.show[k] ? 'on' : ''}">${l.split(',')[0]}</button>`).join('')}<button data-radius class="${fd.radius > 800 ? 'on' : ''}">${fd.radius > 800 ? '1.5 km' : '800 m'}</button></div></div>
    <div class="fmap" id="fmap"></div>
    ${fd.err ? `<p class="honest">${esc(fd.err)}</p>` : ''}
    <p class="sec">${fd.res === 'loading' ? 'Searching…' : `${shown.length} place${shown.length === 1 ? '' : 's'} within ${fd.radius} m`}</p>
    <div class="card fl">${fd.res === 'loading' ? '<p class="empty">Looking around…</p>' : shown.length ? shown.slice(0, 25).map((x, i) => `<button class="frow" data-food="${x.id}" style="--c:${KIND[x.kinds[0]][2]}"><span class="n">${i + 1}</span><span class="m"><b>${esc(x.name)}</b>${x.ja ? `<span class="jp">${esc(x.ja)}</span>` : ''}<span class="tags">${x.kinds.map((k) => `<span class="tag ${KIND[k][1]}">${KIND[k][0]}</span>`).join('')}${x.cuisine ? `<span class="tag">${esc(x.cuisine)}</span>` : ''}</span><span class="info" style="display:block">${walk(x.m)}${x.hours ? ' · ' + esc(x.hours) : ''}</span></span><a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lng}&travelmode=walking" target="_blank" rel="noopener">Go ›</a></button>`).join('') : '<p class="empty">Nothing tagged here yet. Try 1.5 km, turn on Fish or seafood, or use the guide picks below.</p>'}</div>
    <button class="card porkcard press" data-pork><span><b>豚肉とアルコールが入ったものは食べられません</b><small>"I can't eat anything with pork or alcohol" · tap to show staff</small></span></button>
    <p class="sec">${fd.allGuide ? 'Your guide, checked for pork' : 'From your guide, nearby'}<button data-allguide>${fd.allGuide ? 'Nearby only' : 'See all in this city'}</button></p>
    <div class="card fl">${guide.length ? guide.map((x) => { const d = DIET[x.name]; return `<a class="frow" style="--c:${d && d.pork === 'main' ? '#c62d22' : d && d.halal === 'certified' ? '#1f7a3f' : '#2c4f86'};text-decoration:none" href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lng}&travelmode=walking" target="_blank" rel="noopener"><span class="n">★</span><span class="m"><b>${esc(x.name)}</b><span class="tags">${porkTag(d)}${halTag(d)}</span>${d ? `<span class="info" style="display:block;color:var(--ink);margin-top:6px">${esc(d.note)}</span>` : ''}${d && d.alt ? `<span class="info" style="display:block;color:#1f7a3f;font-weight:700;margin-top:3px">Halal nearby: ${esc(d.alt)}</span>` : ''}<span class="info" style="display:block">${esc(x.meta || '')} · ${walk(x.m)}</span></span><span class="go">Go ›</span></a>`; }).join('') : '<p class="empty">No guide picks within 2.5 km. Tap See all in this city.</p>'}</div>
    <p class="honest">"Muslim-friendly cuisine" means the cuisine is often halal (Indian, Turkish, Indonesian and so on), not that it's certified. Fish and udon places are usually pork-free, but broths and sauces can use mirin or sake.</p>`;
}
function mountFoodMap() {
  const el = document.getElementById('fmap'); if (!el || !window.L) return;
  if (fmap) { fmap.remove(); fmap = null; }
  const c = center(); fmap = L.map(el, { zoomControl: false, attributionControl: false }).setView([c.lat, c.lng], 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(fmap);
  L.circle([c.lat, c.lng], { radius: fd.radius, color: '#1e6bff', weight: 1, fillOpacity: 0.05 }).addTo(fmap);
  L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: '<div class="fpin me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(fmap);
  const shown = Array.isArray(fd.res) ? fd.res.filter((x) => x.kinds.some((k) => fd.show[k])).slice(0, 25) : [];
  shown.forEach((x, i) => { L.marker([x.lat, x.lng], { icon: L.divIcon({ className: '', html: `<div class="fpin" data-fp="${x.id}" style="--c:${KIND[x.kinds[0]][2]}">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(fmap).on('click', () => { const r = document.querySelector(`[data-food="${x.id}"]`); r && r.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); });
  if (shown.length) fmap.fitBounds([[c.lat, c.lng], ...shown.map((x) => [x.lat, x.lng])], { padding: [24, 24], maxZoom: 16 });
}

/* ═══════════ harness ═══════════ */
const page = document.getElementById('page'), fab = document.getElementById('fab');
const picker = document.querySelector('.proto-picker'), hl = picker.querySelector('.proto-picker-highlight'), items = [...picker.querySelectorAll('.proto-picker-item')];
let tab = Math.max(0, (parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
function render() {
  const y = scrollY;
  page.innerHTML = [renderExpenses, renderTaxi, renderFood][tab]();
  fab.hidden = tab !== 0;
  page.querySelectorAll('.seg').forEach(moveSeg);
  if (tab === 2) { mountFoodMap(); if (fd.res == null) searchFood(); }
  window.scrollTo(0, y);
}
function setTab(i) { tab = i; items.forEach((el, j) => el.toggleAttribute('data-active', j === i)); const el = items[i]; hl.style.width = el.offsetWidth + 'px'; hl.style.transform = `translateX(${el.offsetLeft}px)`; const u = new URL(location); u.searchParams.set('v', i + 1); history.replaceState(null, '', u); window.scrollTo(0, 0); render(); }
items.forEach((el, i) => el.addEventListener('click', () => setTab(i)));
fab.addEventListener('click', () => openEx(null));
page.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  const cu = t('[data-cur]'); if (cu) { ex.cur = cu.dataset.cur; ls.set('proto.excur', ex.cur); return render(); }
  const mo = t('[data-mode]'); if (mo) { ex.mode = mo.dataset.mode; ls.set('proto.exmode2', ex.mode); return render(); }
  if (t('[data-clear]')) { ex.list = []; saveEx(); return render(); }
  const pd = t('[data-paid]'); if (pd) { const tr = transfers(balances())[+pd.dataset.paid]; const from = ex.mode === 'couples' ? COUPLES[tr.from.id].ids[0] : tr.from.id, to = ex.mode === 'couples' ? COUPLES[tr.to.id].ids[0] : tr.to.id;
    ex.list.push({ id: 's' + Date.now().toString(36), title: `${tr.from.name} paid ${tr.to.name}`, yen: Math.round(tr.yen), payer: from, split: [to], cat: 'settle', day: todayId() }); saveEx(); return render(); }
  const xr = t('[data-ex]'); if (xr) return openEx(xr.dataset.ex);
  const h = t('[data-hotel]'); if (h) return openDriver(h.dataset.hotel);
  if (t('[data-here]')) { if (!navigator.geolocation) { fd.err = 'Location is not available on this device.'; return render(); }
    navigator.geolocation.getCurrentPosition((p) => { fd.here = { name: 'My location', lat: p.coords.latitude, lng: p.coords.longitude }; searchFood(); }, () => { fd.err = 'Could not get your location. Check location permission, or pick a stop instead.'; render(); }, { enableHighAccuracy: true, timeout: 10000 }); return; }
  const sh = t('[data-show]'); if (sh) { fd.show[sh.dataset.show] = !fd.show[sh.dataset.show]; return render(); }
  if (t('[data-allguide]')) { fd.allGuide = !fd.allGuide; return render(); }
  if (t('[data-radius]')) { fd.radius = fd.radius > 800 ? 800 : 1500; return searchFood(); }
  if (t('[data-pork]')) { driver.innerHTML = `<button class="x" data-dx aria-label="Close">${X}</button><p class="lbl">Show this to staff</p><p class="name" style="margin-top:40px">豚肉とアルコールが入ったものは食べられません</p><p class="sayr" style="margin-top:14px">butaniku to arukōru ga haitta mono wa taberaremasen</p><p class="en">"I can't eat anything that contains pork or alcohol."</p><p class="say" style="margin-top:30px;font-size:22px">これは豚肉が入っていますか</p><p class="sayr">kore wa butaniku ga haitte imasu ka · "Does this contain pork?"</p>`; driver.classList.add('on'); return; }
  const fr = t('[data-food]'); if (fr && !t('a')) { document.querySelectorAll('.fpin.sel').forEach((p) => p.classList.remove('sel')); const pin = document.querySelector(`[data-fp="${fr.dataset.food}"]`); if (pin) { pin.classList.add('sel'); const x = fd.res.find((r) => r.id === fr.dataset.food); fmap.panTo([x.lat, x.lng]); } }
});
page.addEventListener('change', (e) => { if (e.target.id === 'f-where') { if (e.target.value === 'My location') return; fd.here = null; fd.where = e.target.value; ls.set('proto.fwhere', fd.where); searchFood(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet(); driver.classList.remove('on'); } });
setTab(tab); requestAnimationFrame(() => picker.setAttribute('data-ready', ''));
</script>
