<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Trip tools</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Zen+Old+Mincho:wght@700&display=swap">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
@font-face { font-family:'Zen Kaku'; font-weight:400; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:500; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family:'Zen Kaku'; font-weight:700; font-display:swap; src:url(../vendor/fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format('woff2'); }
:root { --ink:#141412; --ink2:#4b4a45; --ink3:#86847c; --paper:#f6f4ef; --line:rgba(20,20,10,.08); --blue:#1e6bff; --red:#e23b2e; --ok:#2f9e57; --ease:cubic-bezier(.23,1,.32,1);
  --serif:'Instrument Serif','Times New Roman',serif; --mincho:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif; --sans:'Zen Kaku','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif; --top:calc(58px + env(safe-area-inset-top)); }
* { box-sizing:border-box; }
html,body { margin:0; }
body { font-family:var(--sans); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent; font-variant-numeric:tabular-nums; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; border:0; background:none; padding:0; }
h1,h2,h3,p { margin:0; }
a { color:inherit; }
svg { display:inline-block; vertical-align:middle; fill:none; }
.press { transition:transform 160ms var(--ease); } .press:active { transform:scale(.96); }
.page { max-width:460px; margin:0 auto; padding:var(--top) 0 120px; min-height:100dvh; }
.ph { padding:0 20px 14px; }
.ph small { font-size:12px; font-weight:700; color:var(--ink3); letter-spacing:.06em; text-transform:uppercase; }
.ph h1 { font-size:32px; letter-spacing:-.035em; line-height:1.05; margin-top:2px; }
.ph p { font-size:14.5px; color:var(--ink2); margin-top:6px; }
.card { background:#fff; border-radius:22px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 26px -18px rgba(0,0,0,.3); }
.sec { padding:22px 20px 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
.sec button { font-size:12.5px; letter-spacing:0; text-transform:none; color:var(--blue); }
.seg { display:inline-flex; background:rgba(0,0,0,.05); border-radius:999px; padding:3px; position:relative; flex:none; }
.seg button { position:relative; z-index:1; padding:5px 11px; font-size:12.5px; font-weight:700; color:var(--ink3); border-radius:999px; transition:color 160ms; }
.seg button.on { color:var(--ink); }
.seg i { position:absolute; top:3px; bottom:3px; left:0; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); transition:transform 260ms var(--ease), width 260ms var(--ease); }
.av { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:13px; font-weight:700; flex:none; background:var(--c); }
.av.sm { width:24px; height:24px; font-size:10.5px; }
.av.ph { background-size:cover; background-position:center; color:transparent; }
/* settings */
.scard { margin:0 12px; padding:16px; }
.foodseg { display:flex; justify-content:center; padding:2px 16px 0; }
.seg.big button { padding:7px 22px; font-size:14px; }
.foodseg .seg.big button { padding:7px 15px; }
.sg-map { font-size:12.5px; font-weight:700; color:var(--ink2); text-decoration:none; }
.sg-guest { font-size:14px; color:var(--ink2); }
.daysel { width:100%; height:40px; border-radius:12px; border:1px solid var(--line); background:#fff; padding:0 10px; font:inherit; font-size:14px; margin-bottom:10px; }
#sg-text { width:100%; border-radius:12px; border:1px solid var(--line); padding:10px 12px; font:inherit; font-size:16px; resize:vertical; margin-bottom:10px; background:#fff; }
.bigb:disabled { opacity:.4; }
.sg-t { font-size:15.5px; line-height:1.4; white-space:pre-wrap; }
.sg-m { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12.5px; color:var(--ink3); flex-wrap:wrap; }
.sg-m > span:first-child { flex:1; min-width:0; }
.sg-v { display:flex; }
.sg-v .av { margin-left:-6px; box-shadow:0 0 0 2px #fff; }
.vote { height:30px; padding:0 12px; border-radius:999px; background:rgba(0,0,0,.06); font-size:13px; font-weight:700; color:var(--ink); }
.vote.on { background:var(--ink); color:#fff; }
.sg-del { font-size:12.5px; font-weight:700; color:var(--red); }
.sg.pending { opacity:.6; }
.idea > b { display:block; font-size:16px; margin-bottom:4px; }
.pick { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); }
.pick > div { flex:1; min-width:0; }
.pick b { font-size:14.5px; }
.pick p { margin:2px 0 0; font-size:13px; color:var(--ink2); }
.pick a { flex:none; height:30px; padding:0 12px; display:inline-flex; align-items:center; border-radius:999px; background:rgba(0,0,0,.06); font-size:12.5px; font-weight:700; text-decoration:none; color:var(--ink); }
.navrow { display:flex; align-items:center; gap:10px; width:calc(100% - 24px); text-align:left; }
.navrow > span:first-child { flex:1; min-width:0; }
.navrow b { display:block; font-size:15.5px; }
.navrow small { display:block; font-size:12.5px; color:var(--ink3); margin-top:2px; }
.navrow .cnt { font-size:13px; font-weight:700; color:#fff; background:var(--ok); border-radius:999px; padding:2px 9px; }
.navrow .cnt:empty { display:none; }
.navrow svg { color:var(--ink3); flex:none; }
.subback { display:inline-flex; align-items:center; gap:2px; margin:0 16px 4px; height:34px; padding:0 14px 0 8px; border-radius:999px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:14px; font-weight:700; }
.stday { margin:10px 0 2px; font-size:12px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; }
.stday:first-child { margin-top:0; }
.strow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:14.5px; }
.strow span { min-width:0; }
.strow small { display:block; font-size:12px; color:var(--ink3); }
.strow button { flex:none; height:32px; padding:0 12px; border-radius:999px; background:rgba(0,0,0,.06); font-size:13px; font-weight:700; }
.linkb { color:var(--red); font-weight:700; font-size:14px; }
.bigb { width:100%; height:48px; border-radius:14px; background:var(--ink); color:#fff; font-weight:700; font-size:15px; }
.bk-top { display:flex; align-items:center; gap:8px; padding:4px 16px 0; }
.bk-top .seg { margin-left:auto; }
.bnum { font-size:13px; color:var(--ink3); padding:6px 11px; border-radius:999px; background:#fff; box-shadow:0 0 0 1px var(--line); }
.bnum b { color:var(--ok); font-size:14px; }
.bnum.todo b { color:#b5651d; }
.bk-list { display:grid; gap:10px; }
.bk { border-left:4px solid var(--ok); }
.bk.todo { border-left-color:#d48a1e; }
.bk-h { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.bk-h small { margin-left:auto; font-size:12px; color:var(--ink3); font-weight:700; }
.bk > b { display:block; font-size:16px; line-height:1.25; }
.bk > p { margin:5px 0 0; font-size:13.5px; color:var(--ink2); line-height:1.45; }
.bst { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:999px; }
.bst.ok { background:color-mix(in srgb, var(--ok) 14%, #fff); color:var(--ok); }
.bst.todo { background:#fbf0dd; color:#a86512; }
.bst.now { background:var(--red); color:#fff; }
.bchip { font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:rgba(0,0,0,.06); }
.bchip.nasa { color:#2c4f86; } .bchip.mm { color:#c25350; }
.bk-a { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.bk-a a, .bk-a button { display:inline-flex; align-items:center; height:34px; padding:0 13px; border-radius:999px; background:rgba(0,0,0,.06); font-size:13px; font-weight:700; text-decoration:none; color:var(--ink); }
.bk-a .pri { background:var(--ink); color:#fff; }
.scard .sub { margin:0; font-size:13px; color:var(--ink3); }
.scard .sw + .sub, .scard .key + .sub { margin-top:12px; }
.me { display:flex; align-items:center; gap:16px; }
.me .av { width:84px; height:84px; font-size:28px; box-shadow:0 0 0 3px #fff, 0 6px 18px -6px rgba(0,0,0,.35); }
.me b { display:block; font-size:22px; line-height:1.15; }
.me small { color:var(--ink3); font-size:13px; }
.me .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.me .btns label, .me .btns button { display:inline-flex; align-items:center; height:34px; padding:0 14px; border-radius:999px; background:rgba(0,0,0,.06); font-size:13.5px; font-weight:700; cursor:pointer; }
.me .btns label input { display:none; }
.sw { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.sw button { width:34px; height:34px; border-radius:50%; background:var(--c); box-shadow:0 0 0 1px rgba(0,0,0,.08) inset; }
.sw button.on { box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--c); }
.everyone { display:flex; justify-content:space-between; gap:6px; }
.everyone div { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:700; }
.everyone .av { width:48px; height:48px; font-size:16px; }
.everyone small { font-size:11px; font-weight:500; color:var(--ink3); }
.key { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
.key div { display:flex; align-items:center; gap:10px; font-size:14px; }
.key i { flex:none; width:30px; height:20px; border-radius:6px; background:var(--c); }
.key i.tk { background:#f3eee3; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.1); position:relative; }
.key i.tk::after { content:''; position:absolute; left:6px; right:6px; top:50%; height:3px; margin-top:-1.5px; border-radius:2px; background:var(--c); }
.key i.ln { height:5px; border-radius:3px; }
.key i.ln.dash { background:repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 10px); }
.key small { display:block; color:var(--ink3); font-size:12px; line-height:1.25; }
.setrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line); font-size:14.5px; }
.setrow:first-child { border-top:0; padding-top:2px; }
.setrow a { font-weight:700; text-decoration:none; color:var(--blue); }
.demo { margin:0 12px 6px; padding:10px 14px; border-radius:14px; background:#fff6dd; color:#7a5a00; font-size:13px; display:flex; gap:10px; align-items:center; justify-content:space-between; }
.demo button { font-weight:700; color:#7a5a00; text-decoration:underline; }

/* ── expenses ── */
.tot { margin:0 12px; padding:18px 18px 16px; }
.tot-r { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.tot small { font-size:12px; font-weight:700; color:var(--ink3); }
.tot b.big { display:block; font-family:var(--serif); font-size:46px; font-weight:400; line-height:1; letter-spacing:-.02em; margin-top:4px; }
.tot .sub { font-size:14px; color:var(--ink2); margin-top:4px; }
.bars { display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:14px; background:var(--paper); }
.bars i { display:block; height:100%; background:var(--c); }
.legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; font-size:12px; color:var(--ink2); }
.legend span { display:inline-flex; align-items:center; gap:5px; }
.legend span::before { content:''; width:8px; height:8px; border-radius:2px; background:var(--c); }
.bal { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 12px; }
.bal .card { padding:12px 14px; display:flex; gap:10px; align-items:center; }
.bal .card b { display:block; font-size:15px; }
.bal .card small { display:block; font-size:12.5px; font-weight:700; }
.pos { color:var(--ok); } .neg { color:#c62d22; } .zero { color:var(--ink3); }
.settle { margin:0 12px; padding:6px 0; }
.tr { display:flex; align-items:center; gap:10px; padding:12px 16px; }
.tr + .tr { border-top:1px solid var(--line); }
.tr .arr { color:var(--ink3); }
.tr .who { flex:1; min-width:0; font-size:14.5px; line-height:1.3; }
.tr .who b { font-weight:700; }
.tr .amt { text-align:right; }
.tr .amt b { display:block; font-family:var(--serif); font-size:24px; font-weight:400; line-height:1; }
.tr .amt small { font-size:12px; color:var(--ink3); }
.tr .done { font-size:12.5px; font-weight:700; color:var(--blue); padding:6px 0 6px 8px; }
.even { padding:16px; text-align:center; font-size:14.5px; color:var(--ink2); }
.xlist { margin:0 12px; overflow:hidden; }
.xday { padding:10px 16px 4px; font-size:12px; font-weight:700; color:var(--ink3); background:#fbfaf7; border-top:1px solid var(--line); }
.xday:first-child { border-top:0; }
.xrow { display:flex; align-items:center; gap:12px; width:100%; padding:11px 16px; text-align:left; border-top:1px solid var(--line); }
.xday + .xsw .xrow { border-top:0; }
.xsw { position:relative; overflow:hidden; }
.xsw .xrow { position:relative; z-index:1; background:#fff; touch-action:pan-y; will-change:transform; }
.xsw .xrow.snap { transition:transform 300ms var(--ease); }
.xdel { position:absolute; right:0; top:0; bottom:0; width:96px; display:grid; place-items:center; background:var(--red); color:#fff; font-weight:700; font-size:14px; }
.cfm-bg { position:fixed; inset:0; z-index:1200; background:rgba(20,16,10,.35); display:grid; place-items:center; padding:24px; opacity:0; pointer-events:none; transition:opacity 180ms ease; }
.cfm-bg.on { opacity:1; pointer-events:auto; }
.cfm { width:100%; max-width:330px; border-radius:22px; background:#fbf9f5; padding:20px 18px 14px; box-shadow:0 24px 60px -20px rgba(0,0,0,.5); transform:scale(.96); transition:transform 220ms var(--ease); }
.cfm-bg.on .cfm { transform:none; }
.cfm h3 { margin:0 0 6px; font-size:18px; }
.cfm p { margin:0 0 16px; color:var(--ink2); font-size:14.5px; }
.cfm .row { display:flex; gap:8px; }
.cfm .row button { flex:1; height:46px; border-radius:14px; font-weight:700; font-size:15px; background:rgba(0,0,0,.06); }
.cfm .row button.d { background:var(--red); color:#fff; }
.toast { position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:1100; display:flex; align-items:center; gap:14px; max-width:calc(100% - 32px); padding:10px 10px 10px 16px; border-radius:16px; background:rgba(20,20,18,.92); color:#fff; font-size:14px; box-shadow:0 12px 30px -10px rgba(0,0,0,.5); transform:translate3d(-50%,20px,0); opacity:0; pointer-events:none; transition:opacity 180ms ease, transform 300ms var(--ease); }
.toast.on { transform:translate3d(-50%,0,0); opacity:1; pointer-events:auto; }
.toast span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.toast button { flex:none; height:34px; padding:0 14px; border-radius:10px; background:rgba(255,255,255,.16); color:#fff; font-weight:700; }
.subchips { display:flex; gap:6px; margin-top:8px; }
.xrow .ic { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 14%, #fff); color:var(--c); flex:none; font-size:16px; }
.xrow .m { flex:1; min-width:0; }
.xrow .m b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.xrow .m small { display:block; font-size:12.5px; color:var(--ink3); }
.xrow .r { text-align:right; }
.xrow .r b { display:block; font-size:15px; }
.xrow .r small { display:block; font-size:12px; color:var(--ink3); }
.xrow.settle-row .m b { color:var(--ok); }
.fab[hidden] { display:none; }
.fab { position:fixed; right:max(16px, calc(50% - 214px)); bottom:calc(80px + env(safe-area-inset-bottom)); z-index:600; height:56px; padding:0 22px 0 18px; border-radius:28px; background:var(--ink); color:#fff; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; box-shadow:0 14px 30px -10px rgba(0,0,0,.5); }

/* sheet */
.scrim { position:fixed; inset:0; z-index:900; background:rgba(20,16,10,.3); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 240ms ease; }
.scrim.on { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:950; max-width:460px; margin:0 auto; border-radius:30px 30px 0 0; background:rgba(250,248,244,.97); -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); padding:10px 16px calc(18px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; transform:translate3d(0,105%,0); transition:transform 380ms var(--ease); box-shadow:0 -20px 60px -20px rgba(0,0,0,.4); overscroll-behavior:contain; }
.sheet.on { transform:none; }
body.practice .sheet { max-height:calc(100vh - 96px); } /* room above it for the practice tour's hint */
.grab { width:38px; height:5px; border-radius:3px; background:rgba(0,0,0,.16); margin:0 auto 12px; }
.sh-h { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.sh-h b { font-size:19px; letter-spacing:-.02em; }
.sh-h button { font-size:14.5px; font-weight:700; color:var(--ink3); }
.fld { display:block; margin-bottom:14px; }
.fld > span { display:block; font-size:12px; font-weight:700; color:var(--ink3); margin:0 2px 6px; }
.fld input { width:100%; font:500 16px var(--sans); color:var(--ink); background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:14px; padding:12px 14px; outline:none; -webkit-appearance:none; appearance:none; }
.fld input:focus { border-color:var(--ink); }
.amt-in { display:flex; gap:8px; align-items:stretch; }
.amt-in input { font-family:var(--serif); font-size:34px; font-weight:400; padding:6px 14px; }
.ppl { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.ppl button { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px; border-radius:16px; background:#fff; border:1.5px solid transparent; font-size:12.5px; font-weight:700; transition:border-color 160ms, background 160ms, opacity 160ms; }
.ppl button.on { border-color:var(--ink); }
.ppl.multi button:not(.on) { opacity:.45; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips button { padding:8px 12px; border-radius:12px; background:#fff; font-size:13.5px; font-weight:700; border:1px solid rgba(0,0,0,.06); transition:background 160ms, color 160ms; }
.chips button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.preview { font-size:13.5px; color:var(--ink2); background:#fff; border-radius:14px; padding:10px 12px; margin-bottom:14px; }
.save { width:100%; height:52px; border-radius:16px; background:var(--ink); color:#fff; font-size:16px; font-weight:700; }
.save:disabled { opacity:.35; }
.del { width:100%; height:46px; border-radius:14px; background:#fff; color:#c62d22; font-weight:700; margin-top:8px; }

/* ── taxi cards ── */
.hlist { display:grid; gap:10px; margin:0 12px; }
.hcard { position:relative; height:150px; border-radius:22px; overflow:hidden; background:center/cover no-repeat #555; color:#fff; display:flex; align-items:flex-end; text-align:left; width:100%; }
.hcard::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.05) 20%, rgba(0,0,0,.72)); }
.hcard > div { position:relative; z-index:1; padding:14px 16px; width:100%; }
.hcard small { font-size:12px; font-weight:700; opacity:.85; }
.hcard b { display:block; font-size:19px; letter-spacing:-.02em; line-height:1.15; }
.hcard .jp { font-family:var(--mincho); font-size:14px; opacity:.9; margin-top:2px; display:block; }
.tonight { position:absolute; top:12px; left:12px; z-index:2; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 9px; border-radius:999px; background:var(--red); color:#fff; }

<script type="module">
import { TRIP, DAYS, HOTELS } from '../data/itinerary.js?v=9';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const X = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const ARROW = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* currency: same rates as the main app (8 Oct 2026, yen per unit) */
const RATE = { JPY: 1, CAD: 110.94, QAR: 43.44, USD: 158.1 };
const SYM = { JPY: '¥', CAD: 'C$', QAR: 'QAR ', USD: '$' };

/* ═══════════ 1 · EXPENSES ═══════════ */
const PEOPLE = [
  { id: 'naf', name: 'Naf', ini: 'N', c: '#2c4f86', couple: 'nasa' }, { id: 'sara', name: 'Sara', ini: 'S', c: '#6f4f98', couple: 'nasa' },
  { id: 'mariam', name: 'Mariam', ini: 'Ma', c: '#cc5a26', couple: 'mm' }, { id: 'm', name: 'Mo', ini: 'Mo', c: '#b94b74', couple: 'mm' },
];
const COUPLES = { nasa: { name: 'NASA', ini: 'NA', c: '#4b4f9a', ids: ['naf', 'sara'] }, mm: { name: 'M&M', ini: 'M&M', c: '#c25350', ids: ['mariam', 'm'] } };
const P = Object.fromEntries(PEOPLE.map((p) => [p.id, p]));
const BASE_C = Object.fromEntries(PEOPLE.map((p) => [p.id, p.c]));
// Each person's chosen colour and photo (shared through the API) layered over the defaults.
function syncPeople() { const pf = store.getProfiles(); for (const p of PEOPLE) { p.c = (pf[p.id] && pf[p.id].color) || BASE_C[p.id]; p.photo = store.photoUrl(p.id); } }
const avStyle = (x) => `--c:${x.c}${x.photo ? `;background-image:url('${x.photo}')` : ''}`;
const CATS = { food: ['Food', '#cc5a26', '🍜'], transport: ['Transport', '#2f5fd0', '🚆'], tickets: ['Tickets', '#6f4f98', '🎟'], shopping: ['Shopping', '#b94b74', '🛍'], hotel: ['Hotel', '#55702f', '🏨'], other: ['Other', '#6b6a64', '•'], settle: ['Settled', '#2f9e57', '✓'] };
const SPLITS = { all: ['naf', 'sara', 'mariam', 'm'], nasa: ['naf', 'sara'], mm: ['mariam', 'm'] };
// Expenses live in the shared trip store (Cloudflare KV), so every phone sees the same list.
const ME = (() => { try { return JSON.parse(localStorage.getItem('trips.me')); } catch { return null; } })();
// Guests can look at bookings, ideas, taxi cards and settings, but change nothing and don't see the expenses.
// In the practice tour they can try everything (on an empty expense list; nothing is saved anyway).
const VIEW = GUEST && !SANDBOX;
const ex = { get list() { return Object.entries(store.getExpenses()).map(([id, x]) => ({ id, ...x })).filter((x) => P[x.payer] && x.split && x.split.every((id) => P[id]) && CATS[x.cat]); }, cur: ls.get('proto.excur', 'USD'), mode: ls.get('proto.exmode2', 'couples') };
const saveExpense = (id, rec) => store.setExpense(id, rec ? { title: rec.title, yen: rec.yen, payer: rec.payer, split: rec.split, cat: rec.cat, day: rec.day || null, ...(ME && P[ME] ? { by: ME } : {}) } : null);
const syncLine = () => store.mode === 'locked' ? '<span class="sync off">Locked: <a href="/?next=japan">enter the PIN</a> to save changes</span>' : store.mode === 'sandbox' ? '<span class="sync off">Practice mode: nothing here is saved</span>' : store.mode === 'online' ? '<span class="sync on">Shared with all four phones</span>' : store.mode === 'local' ? '<span class="sync off">Offline: saved on this phone, will sync when back online</span>' : '<span class="sync">Connecting…</span>';

/* who-owes-whom: balances, then greedily match the biggest debtor with the biggest creditor (n−1 transfers at most) */
function balances() {
  const b = Object.fromEntries(PEOPLE.map((p) => [p.id, 0]));
  for (const x of ex.list) { const share = x.yen / x.split.length; b[x.payer] += x.yen; for (const id of x.split) b[id] -= share; }
  return b;
}
function transfers(b) {
  let parties = ex.mode === 'couples' ? Object.entries(COUPLES).map(([k, c]) => ({ id: k, name: c.name, ini: c.ini, c: c.c, v: c.ids.reduce((s, id) => s + b[id], 0) })) : PEOPLE.map((p) => ({ id: p.id, name: p.name, ini: p.ini, c: p.c, photo: p.photo, v: b[p.id] }));
  const cr = parties.filter((p) => p.v > 0.5).map((p) => ({ ...p })).sort((a, z) => z.v - a.v), db = parties.filter((p) => p.v < -0.5).map((p) => ({ ...p, v: -p.v })).sort((a, z) => z.v - a.v);
  const out = [];

  return out;
}
const splitLabel = (s) => (s.length === 4 ? 'all four' : s.join() === SPLITS.nasa.join() ? 'NASA' : s.join() === SPLITS.mm.join() ? 'M&M' : s.map((id) => P[id].name).join(', '));
const dayOf = (id) => DAYS.find((d) => d.id === id);
function renderExpenses() {
  const b = balances(), t = transfers(b), total = ex.list.filter((x) => x.cat !== 'settle').reduce((s, x) => s + x.yen, 0);
  const byCat = {}; ex.list.filter((x) => x.cat !== 'settle').forEach((x) => (byCat[x.cat] = (byCat[x.cat] || 0) + x.yen));
  const curSeg = ['CAD', 'QAR', 'USD'].map((c) => `<button data-cur="${c}" class="${ex.cur === c ? 'on' : ''}">${c}</button>`).join('');
  const modeSeg = [['couples', 'Couples'], ['people', 'People']].map(([k, l]) => `<button data-mode="${k}" class="${ex.mode === k ? 'on' : ''}">${l}</button>`).join('');
  const groups = {}; [...ex.list].sort((a, z) => (z.day || '').localeCompare(a.day || '') || String(z.id).localeCompare(String(a.id))).forEach((x) => (groups[x.day] = groups[x.day] || []).push(x));
  const balCards = ex.mode === 'couples'
    ? Object.entries(COUPLES).map(([k, c]) => { const v = c.ids.reduce((s, id) => s + b[id], 0); return `<div class="card"><span class="av" style="--c:${c.c};font-size:11px">${esc(c.ini)}</span><span><b>${esc(c.name)}</b><small class="${v > 0.5 ? 'pos' : v < -0.5 ? 'neg' : 'zero'}">${v > 0.5 ? 'gets back ' + fmtC(v, ex.cur) : v < -0.5 ? 'owes ' + fmtC(-v, ex.cur) : 'all square'}</small></span></div>`; }).join('')
    : PEOPLE.map((p) => { const v = b[p.id]; return `<div class="card"><span class="av ${p.photo ? 'ph' : ''}" style="${avStyle(p)}">${p.ini}</span><span><b>${p.name}</b><small class="${v > 0.5 ? 'pos' : v < -0.5 ? 'neg' : 'zero'}">${v > 0.5 ? 'gets back ' + fmtC(v, ex.cur) : v < -0.5 ? 'owes ' + fmtC(-v, ex.cur) : 'all square'}</small></span></div>`; }).join('');
  return `<header class="ph"><small>Shared expenses</small><h1>Who owes whom</h1><p>Log anything someone paid for the group. It splits it and works out the fewest payments to settle up.</p>${syncLine()}</header>

      <div class="bars">${Object.entries(byCat).map(([k, v]) => `<i style="--c:${CATS[k][1]};width:${(v / total) * 100}%"></i>`).join('')}</div>
      <div class="legend">${Object.entries(byCat).map(([k, v]) => `<span style="--c:${CATS[k][1]}">${CATS[k][0]} ${fmtY(v)}</span>`).join('')}</div></div>
    <p class="sec">Settle up <span class="seg" id="modeseg">${modeSeg}<i></i></span></p>
    <div class="card settle">${t.length ? t.map((x, i) => `<div class="tr"><span class="av sm ${x.from.photo ? 'ph' : ''}" style="${avStyle(x.from)}">${esc(x.from.ini)}</span><span class="arr">${ARROW}</span><span class="av sm ${x.to.photo ? 'ph' : ''}" style="${avStyle(x.to)}">${esc(x.to.ini)}</span><span class="who"><b>${esc(x.from.name)}</b> pays <b>${esc(x.to.name)}</b></span><span class="amt"><b>${fmtC(x.yen, ex.cur)}</b><small>${fmtY(x.yen)}</small></span><button class="done" data-paid="${i}">Paid</button></div>`).join('') : '<p class="even">Everyone is square.</p>'}</div>
    <p class="sec">Balances</p><div class="bal">${balCards}</div>
    <p class="sec">All expenses</p><div class="card xlist">${Object.entries(groups).map(([d, xs]) => `<p class="xday">${dayOf(d) ? `Day ${dayOf(d).n} · ${esc(dayOf(d).title)}` : 'Other'}</p>${xs.map((x) => `<div class="xsw" data-sw="${x.id}"><button class="xdel" data-delask="${x.id}">Delete</button><button class="xrow ${x.cat === 'settle' ? 'settle-row' : ''}" data-ex="${x.id}" style="--c:${CATS[x.cat][1]}"><span class="ic">${CATS[x.cat][2]}</span><span class="m"><b>${esc(x.title)}</b><small>${P[x.payer].name} paid · ${x.cat === 'settle' ? 'to ' + P[x.split[0]].name : 'for ' + esc(splitLabel(x.split))}</small></span><span class="r"><b>${fmtY(x.yen)}</b><small>${fmtC(x.yen, ex.cur)}</small></span></button></div>`).join('')}`).join('') || '<p class="empty">No expenses yet. Tap Add expense.</p>'}</div>`;
}
/* add / edit sheet */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
let ed = null;
const todayId = () => { const t = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); return (DAYS.find((d) => d.date === t) || DAYS[0]).id; };
function openEx(id) {
  const x = id ? ex.list.find((y) => y.id === id) : null;
  ed = x ? { ...x, split: [...x.split], amt: String(x.yen), ccy: 'JPY', splitMode: x.split.length === 4 ? 'all' : x.split.join() === SPLITS.nasa.join() || x.split.join() === SPLITS.mm.join() ? 'couple' : 'pick' }

}
function closeSheet() { sheet.classList.remove('on'); scrim.classList.remove('on'); ed = null; }
const edYen = () => Math.round((parseFloat(ed.amt) || 0) * RATE[ed.ccy]);

  if (t('[data-unstampall]')) { const ids = Object.keys(store.state.checks || {}); return askConfirm('Unstamp everything?', `${ids.length} stamped stop${ids.length === 1 ? '' : 's'} go back to not done, on all four phones.`, 'Unstamp all', () => { ids.forEach((id) => store.isChecked(id) && store.toggleCheck(id)); render(); undoable(`Unstamped ${ids.length}`, () => ids.forEach((id) => !store.isChecked(id) && store.toggleCheck(id))); }); }
  if (t('[data-export]')) { exportDocx(); return; }
  const pc = t('[data-pcolor]'); if (pc && P[ME]) { store.setProfile(ME, { color: pc.dataset.pcolor }); return render(); }
  if (t('[data-rmphoto]') && P[ME]) { store.setProfile(ME, { photo: null }); return render(); }
  const cu = t('[data-cur]'); if (cu) { ex.cur = cu.dataset.cur; ls.set('proto.excur', ex.cur); return render(); }
  const mo = t('[data-mode]'); if (mo) { ex.mode = mo.dataset.mode; ls.set('proto.exmode2', ex.mode); return render(); }
  const pd = t('[data-paid]'); if (pd) { const tr = transfers(balances())[+pd.dataset.paid]; const from = ex.mode === 'couples' ? COUPLES[tr.from.id].ids[0] : tr.from.id, to = ex.mode === 'couples' ? COUPLES[tr.to.id].ids[0] : tr.to.id;
    const sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); saveExpense(sid, { title: `${tr.from.name} paid ${tr.to.name}`, yen: Math.round(tr.yen), payer: from, split: [to], cat: 'settle', day: todayId() }); render(); return undoable(`Marked ${tr.from.name} → ${tr.to.name} paid`, () => saveExpense(sid, null)); }
  const xr = t('[data-ex]'); if (xr) return openEx(xr.dataset.ex);
  const h = t('[data-hotel]'); if (h) return openDriver(h.dataset.hotel);
  if (t('[data-here]')) { if (!navigator.geolocation) { fd.err = 'Location is not available on this device.'; return render(); }
    navigator.geolocation.getCurrentPosition((p) => { fd.here = { name: 'My location', lat: p.coords.latitude, lng: p.coords.longitude }; searchFood(); }, () => { fd.err = 'Could not get your location. Check location permission, or pick a stop instead.'; render(); }, { enableHighAccuracy: true, timeout: 10000 }); return; }
  const sh = t('[data-show]'); if (sh) { fd.show[sh.dataset.show] = !fd.show[sh.dataset.show]; return render(); }
  if (t('[data-allguide]')) { fd.allGuide = !fd.allGuide; return render(); }
  if (t('[data-radius]')) { fd.radius = fd.radius > 800 ? 800 : 1500; return searchFood(); }
  if (t('[data-pork]')) { driver.innerHTML = `<button class="x" data-dx aria-label="Close">${X}</button><p class="lbl">Show this to staff</p><p class="name" style="margin-top:40px">豚肉とアルコールが入ったものは食べられません</p><p class="sayr" style="margin-top:14px">butaniku to arukōru ga haitta mono wa taberaremasen</p><p class="en">"I can't eat anything that contains pork or alcohol."</p><p class="say" style="margin-top:30px;font-size:22px">これは豚肉が入っていますか</p><p class="sayr">kore wa butaniku ga haitte imasu ka · "Does this contain pork?"</p>`; driver.classList.add('on'); return; }
  const fr = t('[data-food]'); if (fr && !t('a')) { document.querySelectorAll('.fpin.sel').forEach((p) => p.classList.remove('sel')); const pin = document.querySelector(`[data-fp="${fr.dataset.food}"]`); if (pin) { pin.classList.add('sel'); const x = fd.res.find((r) => r.id === fr.dataset.food); fmap.panTo([x.lat, x.lng]); } }
});
page.addEventListener('change', async (e) => {
  if (e.target.id === 'idea-day') { ideas.day = e.target.value; ls.set('proto.ideaday', ideas.day); return render(); }
  if (e.target.id === 'pf-photo' && P[ME] && e.target.files && e.target.files[0]) { const msg = document.getElementById('pf-msg'); if (msg) msg.textContent = 'Uploading…'; try { const d = await squarePhoto(e.target.files[0]); await store.setProfile(ME, { photo: d }, d); render(); } catch (err) { if (msg) msg.textContent = err.message; } return; }
 if (e.target.id === 'f-where') { if (e.target.value === 'My location') return; fd.here = null; fd.where = e.target.value; ls.set('proto.fwhere', fd.where); searchFood(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet(); driver.classList.remove('on'); } });
if (VIEW) { items[0].hidden = true; document.body.classList.add('guest'); }
setTab(tab); requestAnimationFrame(() => picker.setAttribute('data-ready', ''));
// Re-draw the expense list when another phone adds or changes something (not while the edit sheet is open).
let exSig = '';
store.subscribe(() => { const pf = store.getProfiles(); const sig = store.mode + JSON.stringify(store.getExpenses()) + JSON.stringify(Object.fromEntries(Object.entries(pf).map(([k, v]) => [k, [v.color, v.photo]]))); if (sig === exSig) return; exSig = sig; if ((tab === 0 || tab === 4) && !document.getElementById('sheet').classList.contains('on')) render(); });
let ckSig = ''; store.subscribe(() => { const sig = JSON.stringify(store.state.checks || {}); if (sig === ckSig) return; ckSig = sig; if (tab === 4 && !cfmBg.classList.contains('on')) render(); });
let sgSig = ''; store.subscribe(() => { const sig = JSON.stringify(store.state.suggestions || []); if (sig === sgSig) return; sgSig = sig; if (tab === 3 && foodView !== 'nearby' && document.activeElement?.id !== 'sg-text') render(); });
let bkSig = ''; store.subscribe(() => { const sig = JSON.stringify(Object.entries(store.state.choices || {}).filter(([k]) => k.startsWith('bk-'))); if (sig === bkSig) return; bkSig = sig; if (tab === 1) render(); });
store.start();
// The PIN was refused (it changed, or this phone lost it): enter it again on the trips page, then come back to the trip.
store.subscribe(() => { if (store.mode === 'locked' && navigator.onLine) location.replace('/?next=japan'); });
window.__tourEnv = {
  page: 'tools', store,
  getTab: () => tab, setTab: (i) => { if (tab !== i) setTab(i); },
  getFoodView: () => foodView, setFoodView: (v) => { if (v === 'ideas') v = 'food'; if (foodView !== v) { foodView = v; render(); } },
  exCount: () => ex.list.length, sheetOpen: () => sheet.classList.contains('on'), closeSheet: () => closeSheet(),
  driverOpen: () => driver.classList.contains('on'),
};
if (SANDBOX) { document.body.classList.add('practice'); setTimeout(runTour, 60); }
</script>
