# The Durable Object that holds the shared trip state (checks, choices, expenses, …) once, in one place, so two phones
# can never overwrite each other's change. A tiny Worker of its own, because a Pages project can only use a Durable
# Object that lives in a Worker. Deploy it once with scripts/deploy-state.sh, then bind it to the Pages project (README).
name = "japan2026-state"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "TRIP_STATE"
class_name = "TripState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TripState"]

# Flight tracking: the object checks the flights that are due every 5 minutes (lib/flights.js). Secrets, set once with
# `npx wrangler secret put … --config workers/state/wrangler.toml`: FLIGHTAWARE_KEY (AeroAPI; or AERODATABOX_KEY, a RapidAPI key) and VAPID_PRIVATE (phone
# alerts, from scripts/vapid-keys.mjs). VAPID_PUBLIC is the matching public key.
[triggers]
crons = ["*/5 * * * *"]
