# Cloudflare Pages config. Deploy with: scripts/deploy.sh
name = "japan2026"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "TRIP_KV"
id = "60f44ad8c3904423a35f7213856cebd8"

# Workers AI, for reading receipt photos (/api/scan)
[ai]
binding = "AI"

# The shared trip state in one Durable Object (workers/state), so two phones can never lose each other's change.
# Deploy the Worker first (scripts/deploy-state.sh), then uncomment these three lines; until then the state stays in KV.
# [[durable_objects.bindings]]
# name = "TRIP_DO"
# class_name = "TripState"
# script_name = "japan2026-state"
