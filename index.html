  <header class="top">
    <div class="top-row">
      <button class="brand" id="brand" type="button" aria-label="Go to today">
        <span class="brand-mark" aria-hidden="true">日</span>
        <span class="brand-text"><strong>Japan 2026</strong><small>16 Oct – 1 Nov</small></span>
      </button>
      <div class="top-actions">
        <div class="who" role="group" aria-label="Show plan for">
          <button type="button" data-who="all" aria-pressed="true">All</button>
          <button type="button" data-who="nasa" aria-pressed="false">NASA</button>
          <button type="button" data-who="mm" aria-pressed="false">M&amp;M</button>
        </div>
        <button class="icon-btn" id="search-btn" type="button" aria-label="Search the trip"><svg width="22" height="22"><use href="#i-search"/></svg></button>
        <button class="sync" id="sync" type="button" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="sr-only" id="sync-label">Connecting</span></button>
      </div>
    </div>
    <div class="banner" id="banner" hidden role="status"></div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div role="tablist">
      <button type="button" role="tab" data-tab="days" aria-selected="true" aria-controls="panel-days"><svg width="22" height="22" aria-hidden="true"><use href="#i-days"/></svg>Days</button>
      <button type="button" role="tab" data-tab="map" aria-selected="false" aria-controls="panel-map"><svg width="22" height="22" aria-hidden="true"><use href="#i-map"/></svg>Map</button>
      <button type="button" role="tab" data-tab="bookings" aria-selected="false" aria-controls="panel-bookings"><svg width="22" height="22" aria-hidden="true"><use href="#i-ticket"/></svg>Bookings</button>
      <button type="button" role="tab" data-tab="guide" aria-selected="false" aria-controls="panel-guide"><svg width="22" height="22" aria-hidden="true"><use href="#i-guide"/></svg>Guide</button>
      <button type="button" role="tab" data-tab="ideas" aria-selected="false" aria-controls="panel-ideas"><svg width="22" height="22" aria-hidden="true"><use href="#i-ideas"/></svg>Ideas</button>
    </div>
  </nav>

  <main class="main">
    <section class="panel on" id="panel-days" role="tabpanel">
      <div class="daystrip" id="daystrip" role="group" aria-label="Days of the trip"></div>
      <div class="split">
        <div class="timeline" id="timeline"></div>
        <aside class="sidemap" id="sidemap" aria-label="Map of this day"><div class="map" id="map-side"></div></aside>
      </div>
    </section>

    <section class="panel" id="panel-map" role="tabpanel" hidden>
      <div class="map-toolbar">
        <div class="seg" role="group" aria-label="What to show on the map">
          <button type="button" data-scope="day" aria-pressed="true">This day</button>
          <button type="button" data-scope="trip" aria-pressed="false">Hotels</button>
          <button type="button" data-scope="food" aria-pressed="false">Food</button>
        </div>
        <div class="legend" id="legend" aria-label="Line colours"></div>
      </div>
      <div class="stops" id="stops" role="list"></div>
    </section>

    <section class="panel" id="panel-bookings" role="tabpanel" hidden><div class="content" id="bookings"></div></section>
    <section class="panel" id="panel-guide" role="tabpanel" hidden><div class="content" id="guide"></div></section>
    <section class="panel" id="panel-ideas" role="tabpanel" hidden><div class="content" id="ideas"></div></section>
  </main>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head"><h3 id="sheet-title"></h3><button type="button" id="sheet-close" aria-label="Close"><svg width="22" height="22"><use href="#i-close"/></svg></button></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="search" id="search" hidden role="dialog" aria-modal="true" aria-label="Search the trip">
    <div class="search-box">
      <label class="sr-only" for="search-input">Search</label>
      <input id="search-input" type="search" placeholder="Search stops, food, bookings, tips" autocomplete="off" enterkeyhint="search">
      <button type="button" id="search-close" aria-label="Close search"><svg width="22" height="22"><use href="#i-close"/></svg></button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
