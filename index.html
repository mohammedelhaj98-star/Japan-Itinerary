.jp2 { display:inline-flex; flex-direction:column; align-items:center; max-width:100%; padding:5px 13px 6px; border-radius:16px; background:rgba(0,0,0,.36); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); line-height:1.2; text-align:center; }
.jp2 b { font-family:var(--mincho); font-size:15.5px; font-weight:700; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.jp2 small { font-size:11.5px; font-weight:500; opacity:.88; letter-spacing:.01em; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cnt { font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; background:rgba(0,0,0,.36); }
.pass.tk .pnav { position:static; padding:12px 12px 0; }
.pass.tk .st, .pass.tk .jp2, .pass.tk .cnt { background:rgba(0,0,0,.07); color:var(--ink); -webkit-backdrop-filter:none; backdrop-filter:none; }
.jpn { position:absolute; top:12px; right:14px; max-width:52%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:1; font-family:var(--mincho); font-size:15px; padding:4px 10px; border-radius:999px; background:rgba(0,0,0,.35); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.area { position:absolute; top:12px; left:14px; max-width:42%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:1; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.35); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.body { display:none; padding:14px 16px 16px; }
.pass.open .body { display:block; animation:fadeup 360ms var(--ease) both 60ms; }
@keyframes fadeup { from { opacity:0; transform:translateY(6px); } }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; gap:6px; align-items:center; padding:5px 10px; border-radius:10px; background:rgba(255,255,255,.16); font-size:13px; font-weight:700; }

.desc { font-size:15px; line-height:1.5; margin-top:12px; white-space:pre-line; opacity:.95; }
.cv-in { font:inherit; font-size:.82em; font-weight:700; padding:0 5px; border-radius:6px; background:rgba(255,255,255,.18); white-space:nowrap; color:inherit; transition:background 160ms; }
.cv-in:active { background:rgba(255,255,255,.32); }
.dyk { margin-top:14px; padding:12px 14px; border-radius:14px; background:rgba(0,0,0,.16); font-size:14px; line-height:1.45; }

.acts { display:flex; gap:8px; margin-top:14px; }
.acts > * { flex:1; min-height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:14.5px; text-decoration:none; }
.a-dir { background:#fff; color:var(--c); }
.a-jp { background:rgba(255,255,255,.16); color:#fff; font-family:var(--mincho); flex:0 0 58px; font-size:17px; }
.a-st { background:rgba(255,255,255,.16); color:#fff; }

.credit { font-size:10.5px; opacity:.6; margin-top:12px; }
.credit a { text-decoration:none; }
.hanko { position:absolute; top:7px; right:66px; width:50px; height:50px; border-radius:50%; border:2.5px solid var(--red); color:var(--red); background:rgba(252,247,238,.95); display:grid; place-items:center; font-family:var(--mincho); font-size:25px; opacity:0; transform:scale(1.6) rotate(-30deg); pointer-events:none; z-index:3; }
.pass.open .hanko { top:auto; bottom:auto; top:150px; right:16px; }
.pass.done .hanko { opacity:.96; transform:rotate(-14deg); }
.pass.done.stamped .hanko { animation:stamp 380ms cubic-bezier(.2,1.3,.4,1); }
@keyframes stamp { 0% { opacity:0; transform:scale(1.7) rotate(-30deg); } 60% { opacity:1; transform:scale(.94) rotate(-12deg); } 100% { transform:rotate(-14deg); } }
/* tickets: transit legs on paper */
.pass.tk { color:var(--ink); background:radial-gradient(circle at 0 64px, transparent 10px, #f3eee3 10.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 64px, transparent 10px, #f3eee3 10.5px) right/51% 100% no-repeat; box-shadow:none; filter:drop-shadow(0 -6px 14px rgba(0,0,0,.28)); }
.pass.tk .band { border-bottom:2px dashed rgba(0,0,0,.12); margin:0 0; }
.pass.tk .tkic { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 14%, #fff); color:var(--c); flex:none; }
.pass.tk.open .band { display:flex; }
.pass.tk .chip { background:rgba(0,0,0,.06); }
.pass.tk .a-st, .pass.tk .a-jp { background:rgba(0,0,0,.07); color:var(--ink); }
.pass.tk .a-dir { background:var(--ink); color:#fff; }
.pass.tk .cv-in { background:rgba(0,0,0,.07); }
.route { display:flex; align-items:center; gap:10px; padding:4px 0 10px; }
.route div { flex:1; min-width:0; }
.route small { display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; }
.route b { display:block; font-size:16px; letter-spacing:-.015em; line-height:1.2; }
.route .arr { color:var(--c); flex:none; }

/* ── after the wallet ── */
.sec { padding:26px 20px 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); font-weight:700; }
.cards { display:grid; gap:10px; padding:0 12px; }
.card { background:#fff; border-radius:20px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 20px -14px rgba(0,0,0,.25); }

.card h3 { font-size:16.5px; letter-spacing:-.015em; line-height:1.25; margin-top:1px; }
.card p { font-size:14px; color:var(--ink2); margin-top:4px; white-space:pre-line; }
.card.warn small { color:#c2410c; }
.opts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.opt { padding:8px 12px; border-radius:12px; background:var(--paper); font-size:13.5px; font-weight:700; text-align:left; transition:background 180ms, color 180ms, transform 160ms var(--ease); }
.opt.on { background:var(--ink); color:#fff; }
.opt:active { transform:scale(.97); }
.know { display:flex; gap:8px; overflow-x:auto; padding:0 12px 4px; scrollbar-width:none; scroll-snap-type:x mandatory; }
.know::-webkit-scrollbar { display:none; }
.know .card { flex:0 0 78%; scroll-snap-align:start; }
.know .card h3 { font-size:15px; }
.stay { position:relative; border-radius:22px; overflow:hidden; margin:0 12px; height:150px; background:center/cover no-repeat #555; color:#fff; display:flex; align-items:flex-end; text-decoration:none; }
.stay::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.7)); }
.stay div { position:relative; z-index:1; padding:14px 16px; }
.stay small { font-size:11.5px; font-weight:700; opacity:.8; }
.stay b { display:block; font-size:19px; letter-spacing:-.02em; }
.foot { padding:24px 20px 0; font-size:11.5px; color:var(--ink3); text-align:center; }

/* ── modal sheets (kit + japanese card) ── */
.scrim { position:fixed; inset:0; z-index:900; background:rgba(20,16,10,.3); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 260ms ease; }
.scrim.on { opacity:1; pointer-events:auto; }
.kit { position:fixed; left:0; right:0; bottom:0; z-index:950; max-width:460px; margin:0 auto; border-radius:30px 30px 0 0; background:rgba(250,248,244,.94); -webkit-backdrop-filter:blur(30px) saturate(1.7); backdrop-filter:blur(30px) saturate(1.7); padding:8px 0 calc(16px + env(safe-area-inset-bottom)); transform:translate3d(0,110%,0); touch-action:none; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 -20px 60px -20px rgba(0,0,0,.4); }
.kit-h { padding:0 16px 10px; display:flex; justify-content:center; }
.kit-b { overflow-y:auto; padding:0 16px; touch-action:pan-y; overscroll-behavior:contain; }
.cvbox { background:#fff; border-radius:24px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.cvin { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:2px 2px 12px; border-bottom:1px solid var(--line); }
.cvin small, .cvo small { font-size:12px; font-weight:700; color:var(--ink3); display:block; line-height:1.2; }
.cvin small i, .cvo small i { font-style:normal; font-weight:500; }
.cvin b { font-family:var(--serif); font-size:50px; line-height:1; letter-spacing:-.02em; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cvo { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; padding:10px 2px; border-bottom:1px solid var(--line); text-align:left; }
.cvo:last-child { border-bottom:0; padding-bottom:2px; }
.cvo b { font-family:var(--serif); font-size:30px; line-height:1; font-weight:400; color:var(--ink2); white-space:nowrap; }
.cvo:active b { color:var(--ink); }
.cvinl { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; font-size:13px; font-weight:700; color:var(--ink2); }
.swap { width:40px; height:40px; border-radius:50%; background:var(--paper); display:grid; place-items:center; transition:transform 300ms var(--ease); }
.qk { display:flex; gap:6px; overflow-x:auto; margin:12px 0 0; scrollbar-width:none; }
.qk button { flex:none; padding:8px 12px; border-radius:12px; background:#fff; font-size:13.5px; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.keys { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; }
.keys button { height:54px; border-radius:16px; background:#fff; font-size:22px; font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.05); transition:transform 120ms var(--ease), background 120ms; }
.keys button:active { transform:scale(.95); background:#eee; }
.rate { font-size:12px; color:var(--ink3); text-align:center; margin-top:10px; }
.kseg { margin:0 auto 14px; display:flex; }
.phr { display:grid; gap:8px; }
.phr button { text-align:left; background:#fff; border-radius:18px; padding:12px 14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.phr b { display:block; font-size:15px; }
.phr span { display:block; font-family:var(--mincho); font-size:20px; margin-top:2px; }
.phr small { display:block; font-size:12.5px; color:var(--ink3); }
.ess { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ess .card { padding:12px 14px; }
.ess .card.wide { grid-column:1/-1; }
.ess a.big { display:block; font-size:28px; font-weight:700; letter-spacing:-.02em; text-decoration:none; }
.jpcard { position:fixed; inset:0; z-index:1000; background:#fbf8f1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; opacity:0; transform:scale(.97); pointer-events:none; transition:opacity 220ms ease, transform 280ms var(--ease); }
.jpcard.on { opacity:1; transform:none; pointer-events:auto; }
.jpcard .k { font-family:var(--mincho); font-size:min(18vw,84px); line-height:1.15; letter-spacing:.04em; word-break:keep-all; }
.jpcard .r { font-size:20px; font-weight:500; color:var(--ink2); margin-top:10px; letter-spacing:.01em; }
.jpcard .s { font-family:var(--mincho); font-size:24px; margin-top:28px; }
.jpcard .sr { font-size:15px; color:var(--ink2); margin-top:4px; }
.jpcard .e { font-size:15px; color:var(--ink3); margin-top:10px; }
.jpcard .x { position:absolute; top:var(--top); right:14px; width:48px; height:48px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 2px 10px rgba(0,0,0,.12); }

/* key info pill + story */
.keyp { max-width:100%; min-width:0; padding:6px 14px 7px; border-radius:16px; background:rgba(0,0,0,.38); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; line-height:1.25; text-align:center; display:inline-flex; flex-direction:column; align-items:center; }
.keyp span { font-size:12.5px; font-weight:700; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.keyp i { font-style:normal; font-size:11px; font-weight:500; opacity:.8; white-space:nowrap; }
.pass.tk .keyp { background:rgba(0,0,0,.07); color:var(--ink); -webkit-backdrop-filter:none; backdrop-filter:none; }
.storyx { display:none; margin:0 0 14px; padding:12px 14px; border-radius:14px; background:rgba(0,0,0,.16); font-size:14.5px; line-height:1.5; }
.storyx b { display:block; font-family:var(--serif); font-style:italic; font-size:19px; font-weight:400; margin-bottom:2px; }
.pass.storyon .storyx { display:block; animation:fadeup 300ms var(--ease) both; }
.pass.tk .storyx { background:rgba(0,0,0,.05); }
/* the saying: Japanese name + romaji, opens phrase cards */
.say { display:flex; align-items:center; gap:12px; width:100%; margin-top:14px; padding:12px 14px; border-radius:14px; background:rgba(0,0,0,.16); text-align:left; color:inherit; }
.pass.tk .say { background:rgba(0,0,0,.05); }
.say-l { flex:1; min-width:0; }
.say-l b { display:block; font-family:var(--mincho); font-size:24px; line-height:1.2; font-weight:700; }
.say-l small { display:block; font-size:13.5px; opacity:.85; margin-top:2px; }
.say-r { flex:none; font-size:12.5px; font-weight:700; opacity:.85; text-align:right; line-height:1.25; display:flex; align-items:center; gap:4px; }
.a-ed { background:rgba(255,255,255,.16); color:#fff; flex:0 0 52px; }
.pass.tk .a-ed { background:rgba(0,0,0,.07); color:var(--ink); }
.who-tag { display:inline-flex; align-items:center; gap:4px; }
.addgap { position:absolute; left:50%; top:0; z-index:5; transform:translate(-50%,0); height:34px; padding:0 14px 0 10px; border-radius:999px; background:#fff; color:var(--ink); font-size:13px; font-weight:700; display:none; align-items:center; gap:6px; box-shadow:0 4px 14px -6px rgba(0,0,0,.3); white-space:nowrap; }
.addgap.on { display:inline-flex; }
.addgap svg, .addend svg { width:18px; height:18px; }
.addend { display:flex; align-items:center; justify-content:center; gap:6px; margin:14px 12px 0; width:calc(100% - 24px); height:52px; border-radius:18px; border:1.5px dashed rgba(0,0,0,.18); font-size:14.5px; font-weight:700; color:var(--ink2); }
.hd .gear { width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.05); display:grid; place-items:center; flex:none; }
.hd-r .rr { display:flex; align-items:center; gap:6px; }
/* editor sheet */
.ed { z-index:980; }
.ed .kit-b { padding-bottom:6px; }
.ed-h { display:flex; align-items:center; justify-content:space-between; margin:2px 2px 12px; }
.ed-h b { font-size:19px; letter-spacing:-.02em; }
.ed-h button { font-size:14.5px; font-weight:700; color:var(--ink3); padding:6px 4px; }
.fld { display:block; margin-bottom:12px; }
.fld > span { display:block; font-size:12px; font-weight:700; color:var(--ink3); margin:0 2px 5px; }
.fld input, .fld textarea { width:100%; font:500 16px var(--sans); color:var(--ink); background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:14px; padding:12px 14px; outline:none; -webkit-appearance:none; appearance:none; }
.fld input:focus, .fld textarea:focus { border-color:var(--ink); }
.fld textarea { min-height:84px; resize:vertical; line-height:1.4; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tchips { display:flex; flex-wrap:wrap; gap:6px; }
.tchips button { padding:8px 12px; border-radius:12px; background:#fff; font-size:13.5px; font-weight:700; border:1px solid rgba(0,0,0,.06); transition:background 160ms, color 160ms; }
.tchips button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.pcur { display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 12px; margin-bottom:8px; font-size:14.5px; font-weight:700; border:1px solid rgba(0,0,0,.06); }
.pcur span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcur button { color:var(--ink3); font-size:13px; font-weight:700; }
.pres { display:grid; gap:4px; margin-top:6px; }
.pres button { text-align:left; padding:10px 12px; border-radius:12px; background:#fff; font-size:14px; line-height:1.3; border:1px solid rgba(0,0,0,.05); }
.pres button small { display:block; color:var(--ink3); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pres p { font-size:13px; color:var(--ink3); padding:4px 2px; }
.here { margin-top:8px; font-size:13.5px; font-weight:700; color:var(--blue); padding:4px 2px; display:inline-flex; gap:6px; align-items:center; }
.more { font-size:13.5px; font-weight:700; color:var(--ink2); padding:2px; margin-bottom:12px; }
.save { width:100%; height:52px; border-radius:16px; background:var(--ink); color:#fff; font-size:16px; font-weight:700; margin-top:4px; transition:transform 160ms var(--ease); }
.save:active { transform:scale(.98); }
.save:disabled { opacity:.35; }
.edx { display:flex; gap:8px; margin-top:10px; }
.edx button { flex:1; height:46px; border-radius:14px; background:#fff; font-size:14px; font-weight:700; border:1px solid rgba(0,0,0,.06); }
.edx .danger { color:#c62d22; }
.edmsg { font-size:12.5px; color:var(--ink3); text-align:center; margin-top:10px; }
/* settings page */
.setp { position:fixed; inset:0; z-index:960; background:var(--paper); overflow-y:auto; overscroll-behavior:contain; transform:translate3d(100%,0,0); transition:transform 380ms var(--ease); padding:0 0 calc(40px + env(safe-area-inset-bottom)); }
.setp.on { transform:none; }
.set-me { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 16px 4px; padding:12px 14px; border-radius:16px; background:#fff; box-shadow:0 0 0 1px var(--line); font-size:14px; color:var(--ink2); text-decoration:none; }
.set-me span { display:flex; align-items:center; gap:2px; font-weight:700; color:var(--ink); white-space:nowrap; }
.set-h { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; background:rgba(246,244,239,.92); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
.set-h h2 { font-size:20px; letter-spacing:-.02em; flex:1; }
.set-h .tb { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.set-note { font-size:13.5px; color:var(--ink2); padding:4px 20px 12px; }
.sday { margin:0 12px 10px; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.sday summary { list-style:none; display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; }
.sday summary::-webkit-details-marker { display:none; }
.sday summary b { flex:1; font-size:15.5px; letter-spacing:-.01em; }
.sday summary small { font-size:12px; color:var(--ink3); font-weight:500; display:block; }
.sday summary .n { font-family:var(--serif); font-style:italic; font-size:26px; width:30px; }
.sday summary .cnt2 { font-size:11.5px; font-weight:700; color:#fff; background:var(--blue); border-radius:999px; padding:2px 8px; }
.srow { display:flex; align-items:center; gap:10px; width:100%; padding:11px 16px; border-top:1px solid var(--line); text-align:left; }
.srow .t { width:64px; flex:none; font-size:12.5px; color:var(--ink3); }
.srow .m { flex:1; min-width:0; }
.srow .m b { display:block; font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.srow .bd { display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
.bdg { font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:2px 7px; border-radius:6px; background:var(--paper); color:var(--ink2); }
.bdg.ed2 { background:#e5edff; color:#1e4fc2; } .bdg.add { background:#e3f4e8; color:#1f7a3f; } .bdg.hid { background:#f6e3e1; color:#a5281e; } .bdg.nasa { background:#efe7fb; color:#5a3a99; } .bdg.mm { background:#fdebd9; color:#a14e10; }
.srow.hidden .m b { color:var(--ink3); text-decoration:line-through; }
.sadd { display:flex; align-items:center; gap:6px; width:100%; padding:12px 16px; border-top:1px solid var(--line); font-size:14px; font-weight:700; color:var(--blue); }
.set-reset { display:block; margin:18px auto 0; font-size:14px; font-weight:700; color:#c62d22; padding:10px 16px; }
/* phrase cards */
.jpcard.car { justify-content:flex-start; padding:calc(70px + env(safe-area-inset-top)) 0 30px; }
.car-t { font-size:13px; font-weight:700; color:var(--ink3); letter-spacing:.04em; text-transform:uppercase; padding:0 24px; }
