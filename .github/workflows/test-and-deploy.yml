# Every push: run the three test suites, side by side. A push to main: if they all pass, put it live (Cloudflare Pages).
# Deploying needs two repository secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (README); without them only the tests run.
name: Test and deploy
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: 'App (e2e)', run: 'npm test', shots: tests/shots }
          - { name: 'Practice tour', run: 'npm run test:tour', shots: tests/shots/tour }
          - { name: 'Photos and money backups', run: 'npm run test:photos', shots: tests/shots/photos }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: ${{ matrix.suite.name }}
        run: ${{ matrix.suite.run }}
      - name: Screenshots, if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ strategy.job-index }}
          path: ${{ matrix.suite.shots }}
          retention-days: 7
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # without the secrets this is skipped (sessions deploy by hand with scripts/deploy.sh)
      - name: Are the Cloudflare secrets set?
        id: keys
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Not deployed: no Cloudflare secrets. Deploy by hand with scripts/deploy.sh."; fi
      # the group photo is kept out of git: take it from the live site
      - if: steps.keys.outputs.ok == 'true'
        run: mkdir -p hub/img && curl -fsS -A "Mozilla/5.0" -o hub/img/group.webp https://ourtrips.date/img/group.webp
      - if: steps.keys.outputs.ok == 'true'
        run: bash scripts/deploy.sh
