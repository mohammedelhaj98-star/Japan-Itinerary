# Every push: run the three test suites. A push to main: if they all pass, put it live (Cloudflare Pages).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (README → "If the site breaks").
name: Test and deploy
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: App (e2e)
        run: npm test
      - name: Practice tour
        run: npm run test:tour
      - name: Photos and money backups
        run: npm run test:photos
      - name: Screenshots, if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: shots, path: tests/shots, retention-days: 7 }
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check the secrets are set
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions"; exit 1; }'
      # the group photo is kept out of git: take it from the live site
      - run: mkdir -p hub/img && curl -fsS -A "Mozilla/5.0" -o hub/img/group.webp https://ourtrips.date/img/group.webp
      - run: bash scripts/deploy.sh
