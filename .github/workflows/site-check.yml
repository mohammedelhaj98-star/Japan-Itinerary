# Every morning (07:17 in Japan) check the live site; a failure here emails the repo owner.
# Scheduled workflows only run from the default branch: set it to main (Settings → General → Default branch).
name: Daily site check
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check https://ourtrips.date
        run: node tests/live-check.mjs
